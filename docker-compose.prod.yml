version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kimbor_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kimbor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kimbor_sec_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-kimbor_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kimbor} -d ${POSTGRES_DB:-kimbor_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kimbor_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: kimbor_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-kimbor}:${POSTGRES_PASSWORD:-kimbor_sec_pass_2026}@postgres:5432/${POSTGRES_DB:-kimbor_db}?schema=public
      REDIS_URL: redis://redis:6379
      BOT_TOKEN: ${BOT_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    container_name: kimbor_bot
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-kimbor}:${POSTGRES_PASSWORD:-kimbor_sec_pass_2026}@postgres:5432/${POSTGRES_DB:-kimbor_db}?schema=public
      REDIS_URL: redis://redis:6379
      BOT_TOKEN: ${BOT_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      WEBAPP_URL: https://${DOMAIN:-olmaliq.online}
      WEBHOOK_URL: https://${DOMAIN:-olmaliq.online}/api/telegram/webhook
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  webapp:
    build:
      context: .
      dockerfile: apps/webapp/Dockerfile
    container_name: kimbor_webapp
    restart: always

  caddy:
    image: caddy:2-alpine
    container_name: kimbor_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - webapp

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
