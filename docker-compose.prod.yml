version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kimbor_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kimbor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kimbor_sec_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-kimbor_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kimbor} -d ${POSTGRES_DB:-kimbor_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kimbor_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: kimbor_api
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-kimbor}:${POSTGRES_PASSWORD:-kimbor_sec_pass_2026}@postgres:5432/${POSTGRES_DB:-kimbor_db}?schema=public
      REDIS_URL: redis://redis:6379
      BOT_TOKEN: ${BOT_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    container_name: kimbor_bot
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-kimbor}:${POSTGRES_PASSWORD:-kimbor_sec_pass_2026}@postgres:5432/${POSTGRES_DB:-kimbor_db}?schema=public
      REDIS_URL: redis://redis:6379
      BOT_TOKEN: ${BOT_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # VAQTINCHA O'CHIRILGAN (2026-08-28, 2-marta): DNS A-record to'g'ri
      # sozlangan va Google/Cloudflare/Quad9 kabi ommaviy DNS'larda allaqachon
      # to'g'ri (62.72.20.22), LEKIN Telegram'ning o'z ichki DNS keshi hali
      # ESKI IP'ni (2.57.91.93) ko'rsatmoqda — webhookni qayta o'rnatishga
      # urinishda ham SSL xatosi bilan yana muvaffaqiyatsiz bo'ldi (tasdiqlandi).
      # Telegram keshi yangilanguncha (odatda bir necha soat) polling rejimida
      # qolamiz — bu xabar yo'qolishining oldini oladi. Keyinroq qayta tekshirib,
      # tasdiqlangach shu qatorni qaytaring:
      # WEBHOOK_URL: https://${DOMAIN:-olmaliq.online}/webhook
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  webapp:
    build:
      context: .
      dockerfile: apps/webapp/Dockerfile
    container_name: kimbor_webapp
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    container_name: kimbor_caddy
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      DOMAIN: ${DOMAIN:-olmaliq.online}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - webapp

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
