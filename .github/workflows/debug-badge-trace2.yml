name: One-off - Trace badge scoring (in-place, safe, auto-revert)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Trace via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            docker exec kimbor_api cp /app/packages/core/dist/search/searchEngine.js /tmp/searchEngine.js.bak
            docker exec kimbor_api sed -i "s/scoredListings.sort((a, b) => b.score - a.score);/scoredListings.sort((a, b) => b.score - a.score); if (process.env.TRACE_SCORE) { console.error('TRACE', JSON.stringify(scoredListings.map(s => ({ name: s.listing.name, score: s.score, badges: s.listing.badges })))); }/" /app/packages/core/dist/search/searchEngine.js

            docker exec -e TRACE_SCORE=1 kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const { searchListings, extractRequestedBadges } = require('/app/packages/core/dist/index.js');
              const db = new PrismaClient();
              const CITY = '23fdb721-7073-4fd3-bda5-b61bde593490';
              (async () => {
                const msg = 'Taksi kerak zudlik bilan';
                const badges = extractRequestedBadges(msg);
                console.log('requestedBadges passed:', JSON.stringify(badges));
                const r = await searchListings({ cityId: CITY, categoryName: 'taksi', rawMessage: msg, intent: 'SERVICE', requestedBadges: badges });
                console.log('Final top result:', r ? r.listing.name : 'null');
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "

            echo "=== restoring original file ==="
            docker exec kimbor_api cp /tmp/searchEngine.js.bak /app/packages/core/dist/search/searchEngine.js
            docker exec kimbor_api diff /tmp/searchEngine.js.bak /app/packages/core/dist/search/searchEngine.js && echo "RESTORED OK - files identical"
