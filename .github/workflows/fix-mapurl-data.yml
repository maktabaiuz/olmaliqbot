name: One-off - clean malformed mapUrl data and verify fix

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Fix and verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 3m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const db = new PrismaClient();
            (async () => {
              const all = await db.listing.findMany({ where: { mapUrl: { not: null } } });
              const dirty = all.filter(l => l.mapUrl && l.mapUrl.trim() !== (l.mapUrl.match(/https?:\/\/\S+/) || [''])[0]);
              console.log('DIRTY_MAPURL_LISTINGS:', JSON.stringify(dirty.map(l => ({ id: l.id, name: l.name, mapUrl: l.mapUrl }))));
              for (const l of dirty) {
                const match = l.mapUrl.match(/https?:\/\/\S+/);
                if (match) {
                  await db.listing.update({ where: { id: l.id }, data: { mapUrl: match[0] } });
                  console.log('CLEANED:', l.id, l.name, '->', match[0]);
                }
              }

              // haqiqiy Gondra so'roviga toliq zanjirni qayta tekshirish
              const { zeroLayerFilter } = require('/app/apps/bot/dist/filter/zeroLayerFilter.js');
              const { classifyQuery } = require('/app/apps/bot/dist/filter/aiClassifier.js');
              const { buildResultKeyboard } = require('/app/apps/bot/dist/utils/listingReply.js');
              const core = require('/app/packages/core/dist/index.js');
              const gondra = await db.listing.findFirst({ where: { name: { contains: 'Gondra', mode: 'insensitive' } } });
              console.log('GONDRA_MAPURL_NOW:', gondra && gondra.mapUrl);
              const q = 'gondra zaprafka qata';
              const passed = zeroLayerFilter(q);
              const classification = await classifyQuery(q, gondra.cityId, BigInt(999999));
              const isSeeking = classification.intent !== 'NOT_RELEVANT';
              const searchResult = await core.searchListings({
                cityId: gondra.cityId,
                categoryName: isSeeking ? classification.category : null,
                landmarkName: isSeeking ? classification.landmark : null,
                rawMessage: q,
              });
              console.log('ZERO_LAYER_PASSED:', passed, 'FOUND:', !!searchResult);
              if (searchResult) {
                const kb = await buildResultKeyboard(0, searchResult.listingId, searchResult.listing.mapUrl);
                console.log('KEYBOARD:', JSON.stringify(kb.inline_keyboard));
              }

              await db.\$disconnect();
              process.exit(0);
            })().catch(e => { console.error('FIX_ERROR:', e); process.exit(1); });
            "
