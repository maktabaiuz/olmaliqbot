name: One-off - Check Feruza listing status and city

on:
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Query via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();
              (async () => {
                const listings = await db.listing.findMany({
                  where: { id: { in: ['8536b5f4-991f-44bc-9a68-c331863918c3', '9f050767-0abd-440c-b589-6486a56b7c89'] } },
                  select: { id: true, name: true, status: true, cityId: true, categoryId: true, jargonSynonyms: true },
                });
                console.log('LISTINGS:', JSON.stringify(listings, null, 2));
              })().catch(e=>{console.error(e); process.exit(1)}).finally(()=>db.\$disconnect());
            "
