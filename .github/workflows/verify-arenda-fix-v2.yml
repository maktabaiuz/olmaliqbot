name: One-off - Verify root-cause category matching fix (10 runs) + regression

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 120s
          command_timeout: 10m
          script: |
            docker exec kimbor_api node -e "
              const crypto = require('crypto');
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();
              function buildInitData(telegramId) {
                const botToken = process.env.BOT_TOKEN;
                const user = JSON.stringify({ id: telegramId, first_name: 'Test', last_name: 'Admin' });
                const params = { auth_date: Math.floor(Date.now()/1000).toString(), user };
                const paramsArray = Object.entries(params).sort((a,b)=>a[0].localeCompare(b[0]));
                const dataCheckString = paramsArray.map(([k,v])=>k+'='+v).join('\\n');
                const secretKey = crypto.createHmac('sha256','WebAppData').update(botToken).digest();
                const hash = crypto.createHmac('sha256', secretKey).update(dataCheckString).digest('hex');
                const usp = new URLSearchParams(params);
                usp.set('hash', hash);
                return usp.toString();
              }
              (async () => {
                const superAdmin = await db.user.findFirst({ where: { role: 'SUPER_ADMIN' } });
                const initData = buildInitData(superAdmin.telegramId.toString());
                const headers = { 'x-init-data': initData, 'Content-Type': 'application/json' };

                console.log('=== THE BUG (10 runs): stol-stul arenda -> must NEVER be Rano/Bahtiyor ===');
                let badCount = 0;
                for (let i = 0; i < 10; i++) {
                  const simRes = await fetch('http://localhost:4000/api/admin/simulate', {
                    method: 'POST', headers,
                    body: JSON.stringify({ message: 'Саломалейкум хаммага стол стул арендага берадиган одамни номери кимда бор.' }),
                  });
                  const simData = await simRes.json();
                  const bad = simData.finalResult?.categoryName === 'Uy/kvartira arendaga';
                  if (bad) badCount++;
                  console.log('run', i+1, '-> found:', simData.finalResult?.found, 'listing:', simData.finalResult?.listingName, 'category:', simData.finalResult?.categoryName, bad ? '<<<< STILL WRONG' : '');
                }
                console.log('WRONG RESULTS:', badCount, '/ 10');
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "

            echo ''
            echo '=== REGRESSION: balon rescue, Propan-silence, Metan, Taksi+Zudlik, self-offer, betonchi/quy, apartment-still-findable ==='
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const { searchListings, extractRequestedBadges, isSelfOffer } = require('/app/packages/core/dist/index.js');
              const db = new PrismaClient();
              const CITY = '23fdb721-7073-4fd3-bda5-b61bde593490';
              (async () => {
                const r0 = await searchListings({ cityId: CITY, categoryName: 'avtomobil shinasi', rawMessage: 'toy tepada balon kerak', intent: 'NOT_RELEVANT', requestedBadges: [] });
                console.log('balon rescue (expect Largo):', r0 ? r0.listing.name : 'null');

                const r1msg = 'Propan qayerda ishlayabdi akalar';
                const r1 = await searchListings({ cityId: CITY, categoryName: 'avtomobil zapravkasi', rawMessage: r1msg, intent: 'SERVICE', requestedBadges: extractRequestedBadges(r1msg) });
                console.log('Propan (expect null/silent):', r1 ? r1.listing.name : 'null - OK');

                const r2msg = 'Metan quyadigan zapravka qayerda';
                const r2 = await searchListings({ cityId: CITY, categoryName: 'avtomobil zapravkasi', rawMessage: r2msg, intent: 'SERVICE', requestedBadges: extractRequestedBadges(r2msg) });
                console.log('Metan (expect Deska):', r2 ? r2.listing.name : 'null');

                const r3msg = 'Taksi kerak zudlik bilan';
                const r3 = await searchListings({ cityId: CITY, categoryName: 'taksi', rawMessage: r3msg, intent: 'SERVICE', requestedBadges: extractRequestedBadges(r3msg) });
                console.log('Taksi+Zudlik (expect Muhridin):', r3 ? r3.listing.name : 'null');

                console.log('isSelfOffer labo+phone (expect true):', isSelfOffer('Лабо хизмати 776880696'));

                const r4 = await searchListings({ cityId: CITY, categoryName: 'betonchi', rawMessage: 'Fundament quyadigan usta kerak', intent: 'SERVICE', requestedBadges: [] });
                console.log('Betonchi/quy-fix (expect Biton quyuvchi):', r4 ? r4.listing.name : 'null');

                console.log('');
                console.log('=== CRITICAL: genuine apartment-rental query must STILL find Rano/Bahtiyor (not over-corrected to silence) ===');
                const r5 = await searchListings({ cityId: CITY, categoryName: 'uy/kvartira arendaga', rawMessage: 'Kvartira kerak ijaraga', intent: 'SERVICE', requestedBadges: [] });
                console.log('Real apartment query (expect Rano or Bahtiyor, NOT null):', r5 ? r5.listing.name : 'null <<<< BAD if null');

                console.log('');
                console.log('=== CRITICAL: equipment rental (Asbob-uskuna arendasi) must still work directly ===');
                const r6 = await searchListings({ cityId: CITY, categoryName: 'asbob-uskuna arendasi', rawMessage: 'Lesa arendaga bormi', intent: 'SERVICE', requestedBadges: [] });
                console.log('Lesa query (expect Arenda Lesa):', r6 ? r6.listing.name : 'null');
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "
