name: One-off - Verify session survives a container restart

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            echo "=== 1) Confirm session_secret persisted in DB ==="
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();
              (async () => {
                const s = await db.appSetting.findUnique({ where: { key: 'session_secret' } });
                console.log('session_secret exists:', !!s?.value, 'length:', s?.value?.length);
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "

            echo ""
            echo "=== 2) Web-login to get a fresh session cookie ==="
            docker exec kimbor_api node -e "
              (async () => {
                const res = await fetch('http://localhost:4000/api/auth/web-login', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ loginUsername: 'Mubina2026', password: 'Mubina2026' }),
                });
                const setCookie = res.headers.get('set-cookie');
                console.log('login status:', res.status);
                const match = /kimbor_session=([^;]+)/.exec(setCookie || '');
                console.log('COOKIE_VALUE:' + (match ? match[1] : 'NONE'));
              })().catch(e => { console.error('ERR', e); process.exit(1); });
            " > /tmp/login_output.txt
            cat /tmp/login_output.txt
            COOKIE=$(grep -o 'COOKIE_VALUE:.*' /tmp/login_output.txt | cut -d: -f2-)
            echo "extracted cookie: $COOKIE"

            echo ""
            echo "=== 3) Confirm this cookie works RIGHT NOW (sanity check) ==="
            docker exec kimbor_api node -e "
              (async () => {
                const res = await fetch('http://localhost:4000/api/admin/system-health', { headers: { Cookie: 'kimbor_session=$COOKIE' } });
                console.log('before-restart status:', res.status);
              })().catch(e => { console.error('ERR', e); process.exit(1); });
            "

            echo ""
            echo "=== 4) RESTART kimbor_api (simulating a deploy) ==="
            docker restart kimbor_api
            sleep 6
            until docker exec kimbor_api node -e "1" 2>/dev/null; do sleep 1; done
            sleep 2

            echo ""
            echo "=== 5) Confirm the SAME cookie STILL works after restart ==="
            docker exec kimbor_api node -e "
              (async () => {
                const res = await fetch('http://localhost:4000/api/admin/system-health', { headers: { Cookie: 'kimbor_session=$COOKIE' } });
                console.log('after-restart status:', res.status, res.status === 200 ? '=> SESSION SURVIVED RESTART (fix confirmed)' : '=> SESSION DIED (fix failed)');
              })().catch(e => { console.error('ERR', e); process.exit(1); });
            "
