name: One-off - Check if new localDispatcher code actually deployed
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 90s
          command_timeout: 10m
          script: |
            echo "--- git log on host ---"
            cd /app && git log -1 --oneline
            echo "--- grep dist for new marker (cityNameNormalized) ---"
            docker exec kimbor_api grep -c "cityNameNormalized" /app/packages/core/dist/emergency/localDispatcher.js || echo "NOT FOUND"
            echo "--- grep dist for old marker (hasWordMatch = distinctiveWords.some) ---"
            docker exec kimbor_api grep -o "distinctiveWords\.\(some\|every\)" /app/packages/core/dist/emergency/localDispatcher.js
            echo "--- file mtime in container ---"
            docker exec kimbor_api stat /app/packages/core/dist/emergency/localDispatcher.js
            echo "--- image build time ---"
            docker inspect kimbor_api --format '{{.Created}}'
