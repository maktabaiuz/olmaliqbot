name: One-off - Mine real landmark usage from driver group QueryLog
on:
  workflow_dispatch:
jobs:
  mine:
    runs-on: ubuntu-latest
    steps:
      - name: Mine via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 90s
          command_timeout: 10m
          script: |
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const { normalizeText } = require('/app/packages/core/dist/transliteration/index.js');
              const db = new PrismaClient();
              (async () => {
                const logs = await db.queryLog.findMany({
                  where: { landmarkName: { not: null } },
                  select: { landmarkName: true },
                });
                const freq = new Map();
                for (const l of logs) {
                  const n = normalizeText(l.landmarkName).trim();
                  if (!n || n.length < 2) continue;
                  freq.set(n, (freq.get(n) || 0) + 1);
                }
                const sorted = Array.from(freq.entries()).sort((a,b) => b[1]-a[1]);
                console.log('TOTAL_DISTINCT_LANDMARK_MENTIONS:', sorted.length);
                console.log('TOTAL_LOGS_WITH_LANDMARK:', logs.length);

                const existing = await db.landmark.findMany({ select: { name: true, synonyms: true } });
                const existingNorm = new Set();
                for (const e of existing) {
                  existingNorm.add(normalizeText(e.name));
                  for (const s of e.synonyms) existingNorm.add(normalizeText(s));
                }

                console.log('--- TOP 60 MOST-MENTIONED landmarkName VALUES (with match status) ---');
                for (const [name, count] of sorted.slice(0, 60)) {
                  const known = existingNorm.has(name) ? 'KNOWN' : 'MISSING';
                  console.log(count, '\t', known, '\t', name);
                }
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "
