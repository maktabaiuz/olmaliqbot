name: One-off - diagnose bot not responding
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 90s
          command_timeout: 10m
          script: |
            echo "=== 1) Container status ==="
            docker ps -a --format '{{.Names}}: {{.Status}}' | grep kimbor
            echo ""
            echo "=== 2) git log on server ==="
            cd /root/kimbor && git log -1 --oneline
            echo ""
            echo "=== 3) bot logs, last 150 lines ==="
            docker logs --tail 150 kimbor_bot 2>&1
            echo ""
            echo "=== 4) bot errors, last 30 min ==="
            docker logs --since 30m kimbor_bot 2>&1 | grep -i "error\|xato\|exception\|fatal\|timeout\|ECONN\|EAI_AGAIN" | tail -60 || echo "(xato topilmadi)"
            echo ""
            echo "=== 5) api logs, last 60 lines ==="
            docker logs --tail 60 kimbor_api 2>&1
            echo ""
            echo "=== 6) db/redis reachability ==="
            docker exec kimbor_bot node -e "
              const { db } = require('/app/packages/db/dist/index.js');
              (async () => {
                const c = await db.city.count();
                console.log('DB_OK cities=' + c);
                await db.\$disconnect();
              })().catch(e => { console.log('DB_FAIL ' + e.message); process.exit(0); });
            "
            echo ""
            echo "=== 7) live classify + simulate a real message ==="
            docker exec kimbor_bot node -e "
              const { classifyQuery, zeroLayerFilter } = require('/app/packages/core/dist/index.js');
              (async () => {
                const start = Date.now();
                const r = await classifyQuery('santexnik kerak suv tomayabdi');
                console.log('CLASSIFY_OK ms=' + (Date.now()-start) + ' ' + JSON.stringify(r));
              })().catch(e => { console.log('CLASSIFY_FAIL ' + e.message); process.exit(0); });
            "
            echo ""
            echo "=== 8) GEMINI_API_KEY / BOT_TOKEN presence (not values) ==="
            docker exec kimbor_bot node -e "console.log('GEMINI_SET=' + !!process.env.GEMINI_API_KEY, 'BOT_TOKEN_SET=' + !!process.env.BOT_TOKEN)"
            echo ""
            echo "=== 9) grammY polling/webhook status via getMe + getWebhookInfo ==="
            docker exec kimbor_bot node -e "
              (async () => {
                const token = process.env.BOT_TOKEN;
                const r1 = await fetch('https://api.telegram.org/bot' + token + '/getMe');
                console.log('getMe:', JSON.stringify(await r1.json()));
                const r2 = await fetch('https://api.telegram.org/bot' + token + '/getWebhookInfo');
                console.log('getWebhookInfo:', JSON.stringify(await r2.json()));
              })().catch(e => console.log('TG_CHECK_FAIL ' + e.message));
            "
