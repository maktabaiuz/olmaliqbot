name: One-off - verify prompt refinement for near-miss category picking

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const core = require('/app/packages/core/dist/index.js');
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const { classifyQuery } = require('/app/apps/bot/dist/filter/aiClassifier.js');
            const db = new PrismaClient();
            (async () => {
              const g = await db.listing.findFirst({ where: { name: { contains: 'Gondra', mode: 'insensitive' } } });
              const cityId = g.cityId;
              let pass = 0; const failures = [];

              async function stabilityRun(label, q, n, expectFn) {
                let allOk = true;
                const cats = {};
                for (let i = 0; i < n; i++) {
                  const c = await classifyQuery(q, cityId, BigInt(Math.floor(Math.random()*1000000)+9910000));
                  cats[c.category] = (cats[c.category] || 0) + 1;
                  const seek = c.intent !== 'NOT_RELEVANT';
                  const sr = await core.searchListings({
                    cityId, categoryName: seek ? c.category : null, landmarkName: seek ? c.landmark : null,
                    rawMessage: q, intent: c.intent, name: seek ? c.name : null,
                  });
                  const m = sr ? sr.listing.name.trim() : 'NONE';
                  if (!expectFn(m)) { allOk = false; console.log('  ', label, 'run', i, 'FAILED with', m, '| cat:', c.category); }
                }
                if (allOk) pass++; else failures.push(label);
                console.log((allOk ? 'PASS' : 'FAIL'), label, '(' + n + 'x) | cat taqsimoti:', JSON.stringify(cats));
              }
              const SILENT = (m) => m === 'NONE';
              const ANSWER = (m) => m !== 'NONE';
              const IS = (s) => (m) => m.toLowerCase().includes(s);

              console.log('=== YAQIN-TOVUSHDOSH MUAMMOSI TUZATILDIMI (6 martadan) ===');
              await stabilityRun('PEREKRUTEL', 'Assalomu aleykum mashina ochib qolgan kimda perekrutel bor', 6, SILENT);
              await stabilityRun('GAZ_ORNATISH', 'Matizga gaz ornatish qancha', 6, SILENT);

              console.log('=== HAQIQIY SOROVLAR HALI ISHLASHI SHART ===');
              await stabilityRun('SANTEXNIK', 'santexnik kerak', 3, ANSWER);
              await stabilityRun('GAZAVIK_REAL', 'gazavik kerak, uyda gaz hidi yoq lekin plita ishlamayapti', 3, ANSWER);
              await stabilityRun('TAKSI_PLAIN', 'taksi kerak', 3, ANSWER);
              await stabilityRun('BESHBIR', 'beshbirdagi zaprafka ochiqmi', 3, IS('carvon'));

              console.log('---');
              console.log('RESULT: PASS=' + pass + ' FAIL=' + failures.length);
              for (const f of failures) console.log('FAILED:', f);
              await db.\$disconnect();
              process.exit(failures.length > 0 ? 1 : 0);
            })().catch(e => { console.error('DEBUG_ERROR:', e); process.exit(1); });
            "
