name: One-off - check if 'ustasi' word leaks across all trade categories

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const db = new PrismaClient();
            (async () => {
              const cleanCat = 'gaz plita ustasi';
              const catWords = cleanCat.split(/\s+/).filter(w => w.length >= 4);
              console.log('CAT_WORDS:', JSON.stringify(catWords));

              const allCats = await db.category.findMany({ select: { id: true, name: true, synonyms: true } });
              const wordMatches = allCats.filter((c) => {
                const targetWords = new Set([c.name, ...c.synonyms].flatMap((s) => s.toLowerCase().split(/\s+/)));
                return catWords.some((w) => targetWords.has(w));
              });
              console.log('MATCHED_CATEGORIES_COUNT:', wordMatches.length);
              console.log('MATCHED_CATEGORIES:', JSON.stringify(wordMatches.map(c => c.name)));

              // Har bir mos kelgan kategoriyada nechta faol yozuv bor?
              const g = await db.listing.findFirst({ where: { name: { contains: 'Gondra', mode: 'insensitive' } } });
              const cityId = g.cityId;
              for (const c of wordMatches) {
                const cnt = await db.listing.count({ where: { cityId, status: 'ACTIVE', categoryId: c.id } });
                if (cnt > 0) console.log('  HAS_LISTINGS:', c.name, '=', cnt);
              }

              await db.\$disconnect();
              process.exit(0);
            })().catch(e => { console.error('DEBUG_ERROR:', e); process.exit(1); });
            "
