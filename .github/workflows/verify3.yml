name: One-off - debug scoreBreakdown for choyxona query
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 90s
          command_timeout: 10m
          script: |
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const core = require('/app/packages/core/dist/index.js');
              const db = new PrismaClient();
              (async () => {
                const city = await db.city.findFirst();
                const m = 'Assalomu aleykum akalar 29 linya kanechnik tomondan qanaqa choyxona bor';
                for (let i = 0; i < 3; i++) {
                  const r = await core.searchListings({
                    cityId: city.id,
                    categoryName: 'choyxona',
                    landmarkName: '29 linya',
                    rawMessage: m,
                    intent: 'SERVICE',
                    name: null,
                    requestedBadges: [],
                    rentalFilters: null,
                    isReplyToPhoto: false,
                    debug: true,
                  });
                  console.log('out:RUN' + i + '_NAME=' + r?.listing?.name);
                  console.log('out:RUN' + i + '_BREAKDOWN=' + JSON.stringify(r?.scoreBreakdown));
                }
                await db.\$disconnect();
              })().catch(e=>{console.error('ERR', e.stack); process.exit(1)});
            "
