name: Check bot admin permissions (one-off)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 3m
          script: |
            docker exec kimbor_bot node -e "
              const token = process.env.BOT_TOKEN;
              const base = 'https://api.telegram.org/bot' + token;
              (async () => {
                const meRes = await fetch(base + '/getMe');
                const me = (await meRes.json()).result;
                console.log('Bot:', me.username, me.id);

                const groups = [
                  { title: 'Olmaliq Suhbat', chatId: -1004480934800 },
                  { title: 'DSK', chatId: -1002421893642 },
                  { title: 'Olmaliq yollari', chatId: -1001647665739 },
                ];

                for (const g of groups) {
                  try {
                    const res = await fetch(base + '/getChatMember?chat_id=' + g.chatId + '&user_id=' + me.id);
                    const data = await res.json();
                    if (!data.ok) { console.log(g.title + ': API XATO -', JSON.stringify(data)); continue; }
                    const member = data.result;
                    console.log(g.title + ':', JSON.stringify({
                      status: member.status,
                      can_delete_messages: member.can_delete_messages,
                      can_restrict_members: member.can_restrict_members,
                    }));
                  } catch (e) {
                    console.log(g.title + ': XATO -', e.message);
                  }
                }
                process.exit(0);
              })().catch(e => { console.error('ERR', e); process.exit(1); });
            "
