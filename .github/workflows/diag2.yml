name: One-off - diagnose bot not responding (2)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 90s
          command_timeout: 10m
          script: |
            echo "=== 1) Container status ==="
            docker ps -a --format '{{.Names}}: {{.Status}}' | grep kimbor
            echo ""
            echo "=== 2) Webhook status ==="
            docker exec kimbor_bot node -e "
              (async () => {
                const r = await fetch('https://api.telegram.org/bot' + process.env.BOT_TOKEN + '/getWebhookInfo');
                console.log('WEBHOOK:', JSON.stringify(await r.json()));
              })();
            "
            echo ""
            echo "=== 3) bot logs, last 200 lines ==="
            docker logs --tail 200 kimbor_bot 2>&1
            echo ""
            echo "=== 4) bot errors, last 60 min ==="
            docker logs --since 60m kimbor_bot 2>&1 | grep -i "error\|xato\|exception\|fatal\|abort" | tail -60 || echo "(xato topilmadi)"
            echo ""
            echo "=== 5) recent QueryLog entries (last 30 min) — is the bot even seeing messages? ==="
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();
              (async () => {
                const since = new Date(Date.now() - 60*60*1000);
                const logs = await db.queryLog.findMany({ where: { createdAt: { gte: since } }, orderBy: { createdAt: 'desc' }, take: 20, select: { rawMessage: true, intent: true, categoryName: true, landmarkName: true, isResolved: true, confidence: true, createdAt: true, chatId: true } });
                console.log('out:COUNT_LAST_HOUR=' + logs.length);
                for (const l of logs) console.log('out:' + JSON.stringify(l, (k,v) => typeof v === 'bigint' ? v.toString() : v));
                const msgEvCount = await db.groupMessageEvent.count({ where: { createdAt: { gte: since } } });
                console.log('out:GROUP_MESSAGE_EVENT_LAST_HOUR=' + msgEvCount);
                await db.\$disconnect();
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "
