name: One-off - check if landmark-confusion bug affects other intents

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 3m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const core = require('/app/packages/core/dist/index.js');
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const { classifyQuery } = require('/app/apps/bot/dist/filter/aiClassifier.js');
            const db = new PrismaClient();
            (async () => {
              const gondra = await db.listing.findFirst({ where: { name: { contains: 'Gondra', mode: 'insensitive' } } });
              const cityId = gondra.cityId;

              async function run(label, q, userId) {
                const c = await classifyQuery(q, cityId, BigInt(userId));
                const isSeeking = c.intent !== 'NOT_RELEVANT';
                const sr = await core.searchListings({
                  cityId,
                  categoryName: isSeeking ? c.category : null,
                  landmarkName: isSeeking ? c.landmark : null,
                  rawMessage: q,
                  intent: c.intent,
                  name: isSeeking ? c.name : null,
                });
                console.log(label, '| intent:', c.intent, '| category:', c.category, '| name:', c.name, '| landmark:', c.landmark, '| MATCHED:', sr ? sr.listing.name.trim() : 'NONE (jim)');
              }

              // Xuddi shu 'LADA magazin oldida Sariq bola pizza' andozasini
              // BOSHQA intentlar bilan sinaymiz - HOURS, SERVICE, LOCATION, PRICE
              await run('HOURS_VARIANT', 'sariq bola pizza oldidagi LADA magazin ochiqmi', 9200001);
              await run('SERVICE_VARIANT', 'sariq bola pizza oldida LADA magazin bor, u yerda shina bormi', 9200002);
              await run('LOCATION_VARIANT', 'sariq bola pizza oldidagi LADA magazin qayerda joylashgan', 9200003);
              await run('PRICE_VARIANT', 'sariq bola pizza oldidagi LADA magazinda narxlar qancha', 9200004);

              await db.\$disconnect();
              process.exit(0);
            })().catch(e => { console.error('DEBUG_ERROR:', e); process.exit(1); });
            "
