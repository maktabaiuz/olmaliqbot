name: One-off - verify fuzzy-threshold hardening + regressions

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Run classifier regression cases via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            docker exec kimbor_bot node -e "
              const { classifyQuery } = require('/app/apps/bot/dist/filter/aiClassifier.js');
              const { zeroLayerFilter } = require('/app/apps/bot/dist/filter/zeroLayerFilter.js');
              (async () => {
                const cases = [
                  // Bugning aynan o'zi (regressiya emas, aynan shu xato)
                  'chumadim barbir qizilga tushdiz',
                  // Ilgari to'g'irlangan xatolar (regressiya sinovi)
                  'kafel yotqizadigan usta kerak',
                  'Oydinda nima bor?',
                  'Oydin mahallada nimalar bor',
                  'Oydinda qanday xizmatlar bor',
                  'taxi kerak edi Olmaliqqa',
                  'такси килишга ЕМАС кимда боса айтворила',
                  'Горсетни kim biladi',
                  // Haqiqiy so'rovlar hali ham ishlashi kerak (yolg'on-manfiy sinovi)
                  'santexnik kerak suv tomayabdi',
                  'sartarosh kerak',
                  'parikmaxer bormi',
                  'kvartira arendaga kerak',
                  'taksi kerak edi',
                  'kompyuter ustasi bormi'
                ];
                for (const c of cases) {
                  const zl = zeroLayerFilter(c);
                  let ai = null;
                  if (zl) {
                    const start = Date.now();
                    ai = await classifyQuery(c);
                    ai = { ms: Date.now()-start, ...ai };
                  }
                  console.log('out:' + JSON.stringify({q: c, zeroLayer: zl, ai}));
                }
              })().catch(e=>{console.error('ERR',e); process.exit(1)});
            "
