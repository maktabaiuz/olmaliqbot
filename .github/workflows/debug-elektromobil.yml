name: One-off - diagnose electric-charging vs gas-station mixup

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const core = require('/app/packages/core/dist/index.js');
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const { classifyQuery } = require('/app/apps/bot/dist/filter/aiClassifier.js');
            const db = new PrismaClient();
            (async () => {
              const g = await db.listing.findFirst({ where: { name: { contains: 'Gondra', mode: 'insensitive' } } });
              const cityId = g.cityId;

              // Oxirgi 1 soatdagi 'elektr'/'zaryad' bilan bogliq sorovlarni topamiz
              const since = new Date(Date.now() - 6 * 60 * 60 * 1000);
              const logs = await db.queryLog.findMany({
                where: { cityId, createdAt: { gte: since }, rawMessage: { contains: 'elektr', mode: 'insensitive' } },
                orderBy: { createdAt: 'desc' },
                take: 10,
              });
              console.log('RECENT_LOGS:', JSON.stringify(logs.map(l => ({ msg: l.rawMessage, intent: l.intent, cat: l.categoryName, resolved: l.isResolved, at: l.createdAt }))));

              // Elektr zaryadlash kategoriyasi va Avtomobil zapravkasi
              const evCat = await db.category.findFirst({ where: { name: { contains: 'zaryad', mode: 'insensitive' } } });
              console.log('EV_CATEGORY:', JSON.stringify(evCat));
              const fuelCat = await db.category.findFirst({ where: { name: 'Avtomobil zapravkasi' } });
              console.log('FUEL_CATEGORY_ID:', fuelCat ? fuelCat.id : null);

              if (evCat) {
                const evListings = await db.listing.findMany({ where: { cityId, categoryId: evCat.id, status: 'ACTIVE' }, select: { name: true, jargonSynonyms: true } });
                console.log('EV_LISTINGS_COUNT:', evListings.length);
                console.log('EV_LISTINGS:', JSON.stringify(evListings));
              }

              await db.\$disconnect();
              process.exit(0);
            })().catch(e => { console.error('DEBUG_ERROR:', e); process.exit(1); });
            "
