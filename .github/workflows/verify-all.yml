name: One-off - full precision regression suite

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 8m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const core = require('/app/packages/core/dist/index.js');
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const { classifyQuery } = require('/app/apps/bot/dist/filter/aiClassifier.js');
            const db = new PrismaClient();
            (async () => {
              const g = await db.listing.findFirst({ where: { name: { contains: 'Gondra', mode: 'insensitive' } } });
              const cityId = g.cityId;
              let pass = 0; const failures = [];

              async function run(label, q, userId, expectFn) {
                const c = await classifyQuery(q, cityId, BigInt(userId));
                const seek = c.intent !== 'NOT_RELEVANT';
                const sr = await core.searchListings({
                  cityId,
                  categoryName: seek ? c.category : null,
                  landmarkName: seek ? c.landmark : null,
                  rawMessage: q,
                  intent: c.intent,
                  name: seek ? c.name : null,
                });
                const m = sr ? sr.listing.name.trim() : 'NONE';
                const ok = expectFn(m);
                if (ok) pass++; else failures.push(label + ' -> ' + m);
                console.log((ok ? 'PASS' : 'FAIL'), label, '| cat:', JSON.stringify(c.category), '| name:', JSON.stringify(c.name), '| MATCHED:', m);
              }
              const SILENT = (m) => m === 'NONE';
              const ANSWER = (m) => m !== 'NONE';
              const IS = (s) => (m) => m.toLowerCase().includes(s);

              console.log('=== A. ARENDA: mashina arendasi bizda YO\\'Q -> JIM ===');
              await run('ARENDA_CAR_CYR', 'арендага механика мошин керак', 9700001, SILENT);
              await run('ARENDA_CAR_LAT', 'arendaga mexanika moshin kerak', 9700002, SILENT);
              await run('ARENDA_CAR_3', 'mashina arendaga kerak edi 2 kunga', 9700003, SILENT);
              console.log('=== A2. ASBOB arendasi bizda BOR -> JAVOB ===');
              await run('ARENDA_LESA', 'lesa arenda kerak', 9700004, IS('lesa'));
              await run('ARENDA_BOLGARKA', 'bolgarka arendaga kerak', 9700005, ANSWER);

              console.log('=== B. BIZDA YO\\'Q NOM -> JIM ===');
              await run('MIB', 'Olmaliq mib nechigacha ishlaydi', 9700010, SILENT);
              await run('HOKIMIYAT', 'hokimiyat nechigacha ishlaydi', 9700011, SILENT);
              await run('MRU', 'bugun mru ishlaydimi nomer olishga', 9700012, SILENT);

              console.log('=== C. LADA (mo\\'ljal boshqa) ===');
              await run('LADA_CONTACT', 'assalomualekum akalar 5/3 sariq bola pizza oldgai LADA magazin nomerini tashab berilar iltmos', 9700020, SILENT);
              await run('LADA_SERVICE', 'sariq bola pizza oldida LADA magazin bor, u yerda shina bormi', 9700021, SILENT);
              await run('LADA_PRICE', 'sariq bola pizza oldidagi LADA magazinda narxlar qancha', 9700022, SILENT);
              await run('LADA_HOURS', 'sariq bola pizza oldidagi LADA magazin ochiqmi', 9700023, SILENT);
              await run('LADA_LOCATION', 'sariq bola pizza oldidagi LADA magazin qayerda joylashgan', 9700024, SILENT);

              console.log('=== D. FARTUNA ===');
              await run('FORTUNA_1', 'akalar fartunani nomeri bormi', 9700030, SILENT);
              await run('FORTUNA_2', 'fartuna kafeni raqami bormi', 9700031, SILENT);
              await run('FORTUNA_3', 'fartuna telefoni bormi', 9700032, SILENT);
              await run('FORTUNA_4', 'kimda fartunani nomeri bor', 9700033, SILENT);
              await run('FORTUNA_5', 'fartuna nemeri kerak edi', 9700034, SILENT);
              await run('FORTUNA_6', 'fartuna qayerda joylashganini biladiganlar bormi', 9700035, SILENT);

              console.log('=== E. HAQIQIY SO\\'ROVLAR -> JAVOB SHART ===');
              await run('BESHBIR_1', 'beshbirdagi zaprafka ochiqmi', 9700040, IS('carvon'));
              await run('BESHBIR_2', 'beshbirdagi zaprafka ishlayaptimi hozir', 9700041, IS('carvon'));
              await run('BESHBIR_3', 'beshbir zaprafka nechigacha ishlaydi', 9700042, IS('carvon'));
              await run('GONDRA', 'gondra zaprafka ochiqmi', 9700043, IS('gondra'));
              await run('DESKA', 'deska zaprafka ishlayabdimi', 9700044, IS('deska'));
              await run('SARIQ_BOLA', 'sariq bola pizza nomeri bormi', 9700045, IS('sariq bola'));
              await run('SANTEXNIK', 'santexnik kerak', 9700046, ANSWER);
              await run('AVTOELEKTIRIK', 'avtoelektirik kerak', 9700047, ANSWER);
              await run('BALON', 'balon kerak', 9700048, ANSWER);
              await run('LABO', 'labo kerak edi yuk tashish uchun', 9700049, ANSWER);
              await run('YAQIN_ATROF', 'yaqin atrofda zapravka bormi', 9700050, ANSWER);
              await run('TOY_TEPA', 'toy tepada balon kerak', 9700051, ANSWER);
              await run('KVARTIRA', 'ijaraga 1 xonali kvartira kerak edi', 9700052, ANSWER);

              console.log('---');
              console.log('RESULT: PASS=' + pass + ' FAIL=' + failures.length);
              for (const f of failures) console.log('FAILED:', f);
              await db.\$disconnect();
              process.exit(failures.length > 0 ? 1 : 0);
            })().catch(e => { console.error('DEBUG_ERROR:', e); process.exit(1); });
            "
