name: One-off - migrate plaintext passwordHash values to proper PBKDF2

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Migrate via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 3m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const crypto = require('crypto');
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const db = new PrismaClient();

            function hashPassword(password) {
              const salt = process.env.PASSWORD_SALT || 'kimbor_hyperlocal_secure_salt_2026';
              return crypto.pbkdf2Sync(password, salt, 10000, 64, 'sha512').toString('hex');
            }

            (async () => {
              const users = await db.user.findMany({
                where: { passwordHash: { not: null } },
                select: { id: true, role: true, passwordHash: true },
              });
              let migrated = 0;
              for (const u of users) {
                const isPbkdf2Format = /^[0-9a-f]{128}$/.test(u.passwordHash || '');
                if (isPbkdf2Format) { console.log('SKIP (already hashed):', u.id, u.role); continue; }
                const plaintext = u.passwordHash;
                const properHash = hashPassword(plaintext);
                await db.user.update({ where: { id: u.id }, data: { passwordHash: properHash } });
                console.log('MIGRATED:', u.id, u.role, '| eski uzunlik:', plaintext.length, '-> yangi uzunlik:', properHash.length);
                migrated++;
              }
              console.log('JAMI KOCHIRILDI:', migrated);
              await db.\$disconnect();
              process.exit(0);
            })().catch(e => { console.error('MIGRATE_ERROR:', e); process.exit(1); });
            "
