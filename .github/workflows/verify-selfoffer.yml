name: One-off - verify isSelfOffer fix live

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 2m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const core = require('/app/packages/core/dist/index.js');
            const tests = [
              ['metall olaman', true],
              ['labo xizmatim bor', true],
              ['santexnik qayerdan olaman', false],
              ['santexnik kerak', false],
              ['metalchi kerak', false],
            ];
            let allOk = true;
            for (const [t, expected] of tests) {
              const result = core.isSelfOffer(t);
              const ok = result === expected;
              if (!ok) allOk = false;
              console.log((ok ? 'OK' : 'MISMATCH'), JSON.stringify(t), '->', result, '(expected ' + expected + ')');
            }
            console.log('ALL_PASS:', allOk);
            process.exit(allOk ? 0 : 1);
            "
