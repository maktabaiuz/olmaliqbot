name: One-off - Check dashboard noise intent values

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();
              (async () => {
                const examples = [
                  'Gayilar', 'Kocha Tinchmi', 'Elektrika Ishlarini', 'Arendaga Yegil Moshina', 'металлом оламиз'
                ];
                for (const ex of examples) {
                  const logs = await db.queryLog.findMany({
                    where: { rawMessage: { contains: ex, mode: 'insensitive' } },
                    select: { rawMessage: true, intent: true, isResolved: true, confidence: true },
                    take: 3,
                  });
                  console.log(JSON.stringify({ search: ex, logs }));
                }
                console.log('');
                console.log('=== overall intent breakdown among isResolved:false ===');
                const grouped = await db.queryLog.groupBy({
                  by: ['intent'],
                  where: { isResolved: false },
                  _count: true,
                });
                console.log(JSON.stringify(grouped));
              })().catch(e=>{console.error(e); process.exit(1)}).finally(()=>db.\$disconnect());
            "
