name: One-off - diagnose gas-news misclassification and reveal-button flow

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const core = require('/app/packages/core/dist/index.js');
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const { classifyQuery } = require('/app/apps/bot/dist/filter/aiClassifier.js');
            const { setRankedList, revealNextRankedItem } = require('/app/apps/bot/dist/cache/rankedListCache.js');
            const db = new PrismaClient();
            (async () => {
              const g = await db.listing.findFirst({ where: { name: { contains: 'Gondra', mode: 'insensitive' } } });
              const cityId = g.cityId;

              console.log('=== 1. GAZ-YANGILIK SOROVI ===');
              const q = 'Акалар газ качон беришидан хабарилар борми?';
              const N = core.normalizeText;
              console.log('NORMALIZED:', JSON.stringify(N(q)));
              for (let i = 0; i < 3; i++) {
                const c = await classifyQuery(q, cityId, BigInt(9800001 + i));
                const seek = c.intent !== 'NOT_RELEVANT';
                const sr = await core.searchListings({
                  cityId, categoryName: seek ? c.category : null, landmarkName: seek ? c.landmark : null,
                  rawMessage: q, intent: c.intent, name: seek ? c.name : null,
                });
                console.log('run', i, '| intent:', c.intent, '| cat:', JSON.stringify(c.category), '| conf:', c.confidence, '| MATCHED:', sr ? sr.listing.name.trim() : 'NONE');
              }

              console.log('=== 2. ELEKTROMOBIL - REVEAL SIKLI (haqiqiy Redis orqali) ===');
              const q2 = 'Elektra mabil zaprafka qata bor';
              const c2 = await classifyQuery(q2, cityId, BigInt(9800010));
              const sr2 = await core.searchListings({
                cityId, categoryName: c2.category, landmarkName: c2.landmark,
                rawMessage: q2, intent: c2.intent, name: c2.name,
              });
              if (!sr2) { console.log('SEARCH_RESULT: NONE'); }
              else {
                console.log('MAIN_MATCH:', sr2.listing.name.trim(), '| otherMatches.length:', sr2.otherMatches.length, '| hasMore:', sr2.hasMore, '| totalMatches:', sr2.totalMatches);
                await setRankedList(sr2.listingId, sr2.otherMatches);
                let round = 0;
                while (true) {
                  const revealed = await revealNextRankedItem(sr2.listingId);
                  if (!revealed) { console.log('REVEAL_STOPPED at round', round, '(hech narsa qolmadi)'); break; }
                  round++;
                  const nameMatch = revealed.item.formattedText.match(/<b>([^<]+)<\\/b>/);
                  console.log('REVEAL round', round, '| remaining:', revealed.remaining, '| text_snippet:', revealed.item.formattedText.slice(0, 120).replace(/\\n/g, ' | '));
                  if (round > 10) { console.log('TOO_MANY_ROUNDS - toxtatildi'); break; }
                }
                console.log('JAMI KORSATILGAN (asosiy + reveal):', 1 + round);
              }

              await db.\$disconnect();
              process.exit(0);
            })().catch(e => { console.error('DEBUG_ERROR:', e && e.stack || e); process.exit(1); });
            "
