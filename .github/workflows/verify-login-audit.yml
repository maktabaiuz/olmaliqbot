name: One-off - Verify LOGIN audit logging via real web-login

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            docker exec kimbor_api node -e "
              (async () => {
                const res = await fetch('http://localhost:4000/api/auth/web-login', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ loginUsername: 'Mubina2026', password: 'Mubina2026' }),
                });
                console.log('web-login status:', res.status);
                const data = await res.json();
                console.log('response:', JSON.stringify(data));
              })().catch(e => { console.error('ERR', e); process.exit(1); });
            "
            echo "--- checking audit log ---"
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();
              (async () => {
                const logs = await db.auditLog.findMany({ where: { action: 'LOGIN' }, orderBy: { createdAt: 'desc' }, take: 3, include: { user: { select: { firstName: true, loginUsername: true } } } });
                console.log('recent LOGIN logs:', JSON.stringify(logs.map(l => ({ by: l.user?.firstName, loginUsername: l.user?.loginUsername, details: l.details, createdAt: l.createdAt, ip: l.ipAddress, device: l.deviceInfo }))));
              })().catch(e => { console.error('ERR', e); process.exit(1); });
            "
