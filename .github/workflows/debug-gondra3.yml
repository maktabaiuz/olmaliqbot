name: One-off - check real querylog for gondra

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 3m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const db = new PrismaClient();
            (async () => {
              const logs = await db.queryLog.findMany({
                where: { rawMessage: { contains: 'zaprafka', mode: 'insensitive' } },
                orderBy: { createdAt: 'desc' },
                take: 15,
              });
              console.log('QUERYLOG_MATCHES:', JSON.stringify(logs.map(l => ({ rawMessage: l.rawMessage, intent: l.intent, categoryName: l.categoryName, landmarkName: l.landmarkName, isResolved: l.isResolved, confidence: l.confidence, createdAt: l.createdAt })), null, 2));

              const logs2 = await db.queryLog.findMany({
                where: { rawMessage: { contains: 'gondra', mode: 'insensitive' } },
                orderBy: { createdAt: 'desc' },
                take: 15,
              });
              console.log('QUERYLOG_GONDRA_MATCHES:', JSON.stringify(logs2.map(l => ({ rawMessage: l.rawMessage, intent: l.intent, categoryName: l.categoryName, landmarkName: l.landmarkName, isResolved: l.isResolved, confidence: l.confidence, createdAt: l.createdAt })), null, 2));

              await db.\$disconnect();
              process.exit(0);
            })().catch(e => { console.error('DEBUG_ERROR:', e); process.exit(1); });
            "
