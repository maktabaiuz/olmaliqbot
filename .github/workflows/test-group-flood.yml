name: Test group flood (one-off)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 3m
          script: |
            docker exec kimbor_bot node -e "
              const { checkAndRecordGroupFlood } = require('/app/apps/bot/dist/moderation/floodTracker.js');
              (async () => {
                const chatId = -999888777;
                const text = 'royhatdan oting promo www.test-sayt.uz kod XYZ2026';
                for (let userId = 1; userId <= 3; userId++) {
                  const r = await checkAndRecordGroupFlood(chatId, userId, 5000 + userId, text);
                  console.log('user' + userId + ':', JSON.stringify(r));
                }
                process.exit(0);
              })().catch(e => { console.error('ERR', e); process.exit(1); });
            "
