name: One-off - Deploy landmark quality system and verify
on:
  workflow_dispatch:
jobs:
  deploy_and_verify:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy and verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 90s
          command_timeout: 15m
          script: |
            cd /root/kimbor
            git pull origin main || git pull origin master
            git log -1 --oneline
            docker compose -f docker-compose.prod.yml up -d --build
            sleep 25
            docker exec kimbor_api node -e "
              const crypto = require('crypto');
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();
              function buildInitData(telegramId) {
                const botToken = process.env.BOT_TOKEN;
                const user = JSON.stringify({ id: telegramId, first_name: 'Test', last_name: 'Admin' });
                const params = { auth_date: Math.floor(Date.now()/1000).toString(), user };
                const paramsArray = Object.entries(params).sort((a,b)=>a[0].localeCompare(b[0]));
                const dataCheckString = paramsArray.map(([k,v])=>k+'='+v).join('\\n');
                const secretKey = crypto.createHmac('sha256','WebAppData').update(botToken).digest();
                const hash = crypto.createHmac('sha256', secretKey).update(dataCheckString).digest('hex');
                const usp = new URLSearchParams(params);
                usp.set('hash', hash);
                return usp.toString();
              }
              (async () => {
                const superAdmin = await db.user.findFirst({ where: { role: 'SUPER_ADMIN' } });
                const initData = buildInitData(superAdmin.telegramId.toString());
                const headers = { 'x-init-data': initData, 'Content-Type': 'application/json' };

                console.log('=== A) quality-check endpoint ===');
                const qcRes = await fetch('http://localhost:4000/api/admin/landmarks/quality-check', { headers });
                const qc = await qcRes.json();
                console.log('duplicatePairs count:', qc.duplicatePairs?.length);
                for (const d of (qc.duplicatePairs || [])) console.log('  DUP:', d.a.name, '<->', d.b.name, '|', d.detail);
                console.log('notAPlace count:', qc.notAPlace?.length);
                for (const n of (qc.notAPlace || [])) console.log('  NOT_A_PLACE:', n.name, '->', n.resolvedCategory, '(', n.listingCount, 'listings)');

                console.log('');
                console.log('=== B) creation guard test ===');
                const createRes = await fetch('http://localhost:4000/api/admin/landmarks', {
                  method: 'POST', headers, body: JSON.stringify({ name: 'elektrik' }),
                });
                const createData = await createRes.json();
                console.log('Create profession-name landmark -> status:', createRes.status, JSON.stringify(createData));

                const createRes2 = await fetch('http://localhost:4000/api/admin/landmarks', {
                  method: 'POST', headers, body: JSON.stringify({ name: 'Test Real Joy Nomi XYZ' }),
                });
                const createData2 = await createRes2.json();
                console.log('Create genuine new place -> status:', createRes2.status, JSON.stringify(createData2));
                if (createData2.success && createData2.landmark) {
                  await db.landmark.delete({ where: { id: createData2.landmark.id } });
                  console.log('(cleaned up test landmark)');
                }

                console.log('');
                console.log('=== C) bot simulator: verify Qorahitoy + Shanxay now recognized ===');
                for (const msg of ['Qoraxitoy choyxona nomeri bormi', 'Shanxayda taksi kerak', 'Telegrafda santexnik kerak']) {
                  const simRes = await fetch('http://localhost:4000/api/admin/simulate', {
                    method: 'POST', headers, body: JSON.stringify({ message: msg }),
                  });
                  const simData = await simRes.json();
                  console.log('MSG:', msg, '| AI_LANDMARK:', simData?.steps?.aiClassification?.landmark, '| FOUND:', simData?.finalResult?.found, '| LISTING:', simData?.finalResult?.listingName);
                }
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "
