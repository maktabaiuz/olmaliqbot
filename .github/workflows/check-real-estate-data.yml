name: One-off - Check existing real-estate listing data before TZ design
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 90s
          command_timeout: 10m
          script: |
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();
              (async () => {
                const cat = await db.category.findFirst({ where: { name: { contains: 'kvartira', mode: 'insensitive' } } });
                console.log('CATEGORY:', JSON.stringify(cat));
                if (cat) {
                  const listings = await db.listing.findMany({
                    where: { categoryId: cat.id },
                    select: { name: true, approxPrice: true, description: true, badges: true, status: true },
                  });
                  console.log('COUNT:', listings.length);
                  console.log(JSON.stringify(listings, null, 2));
                }
                const allCats = await db.category.findMany({ select: { name: true, objectType: true } });
                console.log('ALL_CATEGORIES:', JSON.stringify(allCats.map(c=>c.name)));
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "
