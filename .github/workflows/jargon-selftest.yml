name: One-off - jargon self-consistency test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Run jargon self-test via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 90s
          command_timeout: 14m
          script: |
            docker exec -i kimbor_bot node - <<'JS'
            const core = require('/app/packages/core/dist/index.js');
            const { db } = require('/app/packages/db/dist/index.js');
            (async () => {
              const listings = await db.listing.findMany({
                where: { status: 'ACTIVE', jargonSynonyms: { isEmpty: false } },
                select: { id: true, name: true, cityId: true, jargonSynonyms: true, category: { select: { name: true } } },
              });
              const longest = (p) => core.normalizeText(p).split(/\s+/).sort((a, b) => b.length - a.length)[0] || '';
              const variants = {
                A_exact: (p) => p + ' nomeri bormi',
                G_noisy: (p) => 'assalomu alaykum akalar ' + p + ' bormi',
                D_typo: (p) => { const t = longest(p); return t.length >= 7 ? p.replace(t, t.slice(0, 3) + t.slice(4)) + ' bormi' : null; },
              };
              const stats = {};
              for (const k of Object.keys(variants)) stats[k] = { ok: 0, wrong: 0, miss: 0 };
              const wrongs = [], misses = [];
              const jobs = [];
              for (const l of listings) {
                for (const p of l.jargonSynonyms.slice(0, 3)) {
                  for (const [k, fn] of Object.entries(variants)) {
                    const q = fn(p);
                    if (q) jobs.push({ l, p, k, q });
                  }
                }
              }
              console.log('out:LISTINGS_WITH_JARGON=' + listings.length + ' TESTS=' + jobs.length);
              let idx = 0;
              const worker = async () => {
                while (idx < jobs.length) {
                  const j = jobs[idx++];
                  let res = null;
                  try { res = await core.searchListings({ cityId: j.l.cityId, categoryName: null, landmarkName: null, rawMessage: j.q, intent: 'SERVICE', name: null, debug: true }); } catch (e) { res = null; }
                  const got = res && res.listing;
                  if (got && got.id === j.l.id) stats[j.k].ok++;
                  else if (got) {
                    const norm = (x) => core.normalizeText(x).replace(/\s+/g, '');
                    const dup = (got.jargonSynonyms || []).some((x) => norm(x) === norm(j.p));
                    if (dup) { stats[j.k].dupSharedPhrase = (stats[j.k].dupSharedPhrase || 0) + 1; }
                    else { stats[j.k].wrong++; wrongs.push({ k: j.k, want: j.l.name, wantCat: j.l.category && j.l.category.name, got: got.name, gotCat: got.category && got.category.name, phrase: j.p, msg: j.q, top: (res.scoreBreakdown || []).slice(0, 2).map((b) => ({ n: b.name, s: b.jargonStrength, ph: b.matchedJargonPhrase, tot: Math.round(b.totalScore) })) }); }
                  }
                  else { stats[j.k].miss++; if (j.k === 'A_exact') misses.push({ want: j.l.name, cat: j.l.category && j.l.category.name, phrase: j.p }); }
                }
              };
              await Promise.all(Array.from({ length: 8 }, worker));
              for (const [k, v] of Object.entries(stats)) console.log('out:STAT ' + k + ' ' + JSON.stringify(v));
              wrongs.slice(0, 45).forEach((w) => console.log('out:WRONG ' + JSON.stringify(w)));
              console.log('out:WRONG_TOTAL=' + wrongs.length);
              misses.slice(0, 40).forEach((m) => console.log('out:MISS_A ' + JSON.stringify(m)));
              console.log('out:MISS_A_TOTAL=' + misses.length);
              process.exit(0);
            })().catch((e) => { console.error('ERR', e); process.exit(1); });
            JS
