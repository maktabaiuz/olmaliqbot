name: One-off - verify LADA fix + full regression

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 4m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const core = require('/app/packages/core/dist/index.js');
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const { classifyQuery } = require('/app/apps/bot/dist/filter/aiClassifier.js');
            const db = new PrismaClient();
            (async () => {
              const gondra = await db.listing.findFirst({ where: { name: { contains: 'Gondra', mode: 'insensitive' } } });
              const cityId = gondra.cityId;

              async function run(label, q, userId) {
                const c = await classifyQuery(q, cityId, BigInt(userId));
                const isSeeking = c.intent !== 'NOT_RELEVANT';
                const sr = await core.searchListings({
                  cityId,
                  categoryName: isSeeking ? c.category : null,
                  landmarkName: isSeeking ? c.landmark : null,
                  rawMessage: q,
                  intent: c.intent,
                  name: isSeeking ? c.name : null,
                });
                console.log(label, '| intent:', c.intent, '| name:', c.name, '| landmark:', c.landmark, '| MATCHED:', sr ? sr.listing.name.trim() : 'NONE (jim)');
              }

              console.log('--- YANGI TUZATISH: LADA magazin (Sariq bola pizza faqat molyal) ---');
              await run('LADA', 'assalomualekum akalar 5/3 sariq bola pizza oldgai LADA magazin nomerini tashab berilar iltmos', 9100001);

              console.log('--- SANITY: Sariq bola pizzaning ozini sorasa hali topilishi kerak ---');
              await run('SARIQ_BOLA_DIRECT', 'Sariq bola pizza nomeri bormi', 9100002);

              console.log('--- REGRESSIYA: fartuna (6 variatsiya) ---');
              const fartunaPhrasings = [
                'Akalar fartunani nomeri bormi',
                'Fartunani raqami kimda bor',
                'Fartuna kompaniyasining telefon nomeri kerak edi',
                'Fartunaning nomerini biladiganlar bormi akalar',
                'Kimda fartunani raqami bor yozing',
                'Fartuna degan joyning nomeri bormi',
              ];
              for (let i = 0; i < fartunaPhrasings.length; i++) {
                await run('FARTUNA_' + i, fartunaPhrasings[i], 9100010 + i);
              }

              console.log('--- REGRESSIYA: boshqa avvalgi tuzatishlar ---');
              await run('AVTOELEKTIRIK_TYPO', 'avtoelektirik kerak', 9100020);
              await run('TOY_TEPA', 'toy tepa pavarot zaprafka ishlayaptimi', 9100021);
              await run('YAQIN_ATROF', 'yaqin atrofda zaprafka bormi', 9100022);
              await run('BESHBIR', 'Beshbirdagi zaprafka ochiqmi', 9100023);
              await run('DESKA', 'deska zaprafka ochiqmi', 9100024);
              await run('GONDRA', 'gondra zaprafka ochiqmi', 9100025);
              await run('BALON', 'balon kerak qata bor', 9100026);

              await db.\$disconnect();
              process.exit(0);
            })().catch(e => { console.error('VERIFY_ERROR:', e); process.exit(1); });
            "
