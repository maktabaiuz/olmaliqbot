name: One-off - broader audit for qaysi-class bugs
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 90s
          command_timeout: 10m
          script: |
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();
              const j = (o) => JSON.stringify(o, (k,v) => typeof v === 'bigint' ? v.toString() : v);
              (async () => {
                // 1) 'nechanchi' (which-numbered) so'zi bilan javob berilgan so'rovlar
                const nechanchi = await db.queryLog.findMany({
                  where: { isResolved: true, rawMessage: { contains: 'nechanchi', mode: 'insensitive' } },
                  select: { rawMessage: true, categoryName: true, landmarkName: true, resolvedListingId: true, createdAt: true },
                  take: 15, orderBy: { createdAt: 'desc' },
                });
                console.log('out:NECHANCHI_COUNT=' + nechanchi.length);
                nechanchi.forEach(r => console.log('out:NECHANCHI ' + j(r)));

                // 2) Deiktik 'bu'/'shu' + mo'ljalsiz + javob berilgan so'rovlar
                //    (fotosuratga/oldingi xabarga reply bo'lgan bo'lishi mumkin)
                const deictic = await db.queryLog.findMany({
                  where: {
                    isResolved: true,
                    landmarkName: null,
                    intent: { not: 'NOT_RELEVANT' },
                    OR: [
                      { rawMessage: { contains: ' bu ', mode: 'insensitive' } },
                      { rawMessage: { contains: ' shu ', mode: 'insensitive' } },
                      { rawMessage: { contains: 'mana bu', mode: 'insensitive' } },
                      { rawMessage: { contains: 'mana shu', mode: 'insensitive' } },
                    ],
                  },
                  select: { rawMessage: true, categoryName: true, resolvedListingId: true, createdAt: true },
                  take: 25, orderBy: { createdAt: 'desc' },
                });
                console.log('out:DEICTIC_COUNT=' + deictic.length);
                deictic.forEach(r => console.log('out:DEICTIC ' + j(r)));

                // 3) Umumiy tekshiruv: landmarksiz, jargon'siz kategoriyalarda BIR XIL
                //    (yoki juda o'xshash) so'rov turi TURLI natijaga chiqqan holatlar —
                //    kategoriya bo'yicha, landmarkName=null, resolvedListingId turlicha
                //    bo'lgan holatlarni sanaymiz (faqat 2+ ACTIVE yozuvli kategoriyalarda).
                const cats = await db.category.findMany({ select: { id: true, name: true } });
                const catListingCounts = await db.listing.groupBy({ by: ['categoryId'], where: { status: 'ACTIVE' }, _count: { _all: true } });
                const multiListingCatIds = new Set(catListingCounts.filter(c => c._count._all >= 2).map(c => c.categoryId));
                const multiListingCatNames = new Set(cats.filter(c => multiListingCatIds.has(c.id)).map(c => c.name.toLowerCase()));

                const rows = await db.queryLog.findMany({
                  where: { isResolved: true, landmarkName: null, intent: { not: 'NOT_RELEVANT' }, categoryName: { not: null }, resolvedListingId: { not: null } },
                  select: { rawMessage: true, categoryName: true, resolvedListingId: true, createdAt: true },
                  take: 3000, orderBy: { createdAt: 'desc' },
                });
                const byCat = new Map();
                for (const r of rows) {
                  const cn = (r.categoryName||'').toLowerCase();
                  if (!multiListingCatNames.has(cn)) continue;
                  if (!byCat.has(cn)) byCat.set(cn, new Set());
                  byCat.get(cn).add(r.resolvedListingId);
                }
                const unstable = [...byCat.entries()].filter(([,ids]) => ids.size >= 2).sort((a,b) => b[1].size - a[1].size);
                console.log('out:UNSTABLE_CATS_COUNT=' + unstable.length);
                unstable.slice(0, 15).forEach(([cn, ids]) => console.log('out:UNSTABLE ' + cn + ' distinctListings=' + ids.size));

                await db.\$disconnect();
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "
