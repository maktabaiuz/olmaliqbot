name: One-off - reproduce toy tepa wrong match

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 3m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const core = require('/app/packages/core/dist/index.js');
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const { classifyQuery } = require('/app/apps/bot/dist/filter/aiClassifier.js');
            const db = new PrismaClient();
            (async () => {
              const gondra = await db.listing.findFirst({ where: { name: { contains: 'Gondra', mode: 'insensitive' } } });
              const cityId = gondra.cityId;
              const q = 'Туй тепа паварот заправка ишлаяпдими';

              console.log('NORMALIZED:', core.normalizeText(q));

              const c = await classifyQuery(q, cityId, BigInt(5000001));
              console.log('CLASSIFICATION:', JSON.stringify(c));

              const isSeeking = c.intent !== 'NOT_RELEVANT';
              const sr = await core.searchListings({
                cityId,
                categoryName: isSeeking ? c.category : null,
                landmarkName: isSeeking ? c.landmark : null,
                rawMessage: q,
              });
              console.log('MATCHED:', sr ? sr.listing.name : 'NONE (jim turdi)');

              // Zapravka landmarklarini ham tekshiramiz - Toy tepa haqiqatan bazada yoqmi
              const allLandmarks = await db.landmark.findMany({ where: { cityId }, select: { name: true, synonyms: true } });
              const toyTepaLike = allLandmarks.filter(l => core.normalizeText(l.name).includes('tepa') || l.synonyms.some(s => core.normalizeText(s).includes('tepa')));
              console.log('TEPA_LANDMARKS_IN_DB:', JSON.stringify(toyTepaLike));

              await db.\$disconnect();
              process.exit(0);
            })().catch(e => { console.error('DEBUG_ERROR:', e); process.exit(1); });
            "
