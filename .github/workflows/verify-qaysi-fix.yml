name: One-off - verify qaysi fix + audit historical occurrences
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 90s
          command_timeout: 10m
          script: |
            docker exec kimbor_api node -e "
              const crypto = require('crypto');
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();
              const j = (o) => JSON.stringify(o, (k,v) => typeof v === 'bigint' ? v.toString() : v);
              function buildInitData(telegramId) {
                const botToken = process.env.BOT_TOKEN;
                const user = JSON.stringify({ id: telegramId, first_name: 'Test', last_name: 'Admin' });
                const params = { auth_date: Math.floor(Date.now()/1000).toString(), user };
                const paramsArray = Object.entries(params).sort((a,b)=>a[0].localeCompare(b[0]));
                const dataCheckString = paramsArray.map(([k,v])=>k+'='+v).join('\\n');
                const secretKey = crypto.createHmac('sha256','WebAppData').update(botToken).digest();
                const hash = crypto.createHmac('sha256', secretKey).update(dataCheckString).digest('hex');
                const usp = new URLSearchParams(params);
                usp.set('hash', hash);
                return usp.toString();
              }
              (async () => {
                const superAdmin = await db.user.findFirst({ where: { role: 'SUPER_ADMIN' } });
                const headers = { 'x-init-data': buildInitData(superAdmin.telegramId.toString()), 'Content-Type': 'application/json' };

                // 1) Aynan skrinshotdagi xabar (va lotin/krill variantlari) — endi JIM bo'lishi kerak
                const regressionMsgs = [
                  ['BUG (kirill k)', 'Кайси заправка бу катдаги'],
                  ['BUG (kirill q)', 'Қайси заправка бу катдаги'],
                  ['BUG (lotin)', 'qaysi zapravka bu qatdagi'],
                  ['REGRESSION: landmark bor bolsa hali ishlashi kerak', 'Deskadagi qaysi zapravka ochiq'],
                  ['REGRESSION: oddiy sorov hali ishlashi kerak', 'zapravka qaerda'],
                  ['REGRESSION: boshqa kategoriya qaysi so\'zi bilan', 'Qaysi santexnik yaxshi'],
                  ['REGRESSION: jargon aniq moslik bolsa ishlashi kerak', 'Gondra qaysi tomonda'],
                ];
                for (const [label, msg] of regressionMsgs) {
                  const r = await fetch('http://localhost:4000/api/admin/simulate', { method: 'POST', headers, body: JSON.stringify({ message: msg }) });
                  const d = await r.json();
                  console.log('out:' + label + ' | msg=' + msg + ' | found=' + (d.finalResult && d.finalResult.found) + ' | listing=' + (d.finalResult && d.finalResult.listingName));
                }

                // 2) Tarixiy QueryLog'da 'qaysi'/'kaysi'/'кайси'/'қайси' bilan JAVOB BERILGAN so'rovlar
                const historical = await db.queryLog.findMany({
                  where: {
                    isResolved: true,
                    OR: [
                      { rawMessage: { contains: 'qaysi', mode: 'insensitive' } },
                      { rawMessage: { contains: 'kaysi', mode: 'insensitive' } },
                      { rawMessage: { contains: 'кайси', mode: 'insensitive' } },
                      { rawMessage: { contains: 'қайси', mode: 'insensitive' } },
                    ],
                  },
                  select: { rawMessage: true, categoryName: true, landmarkName: true, createdAt: true },
                  orderBy: { createdAt: 'desc' },
                  take: 30,
                });
                console.log('out:HISTORICAL_COUNT=' + historical.length);
                for (const h of historical) console.log('out:HIST ' + j(h));

                await db.\$disconnect();
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "
