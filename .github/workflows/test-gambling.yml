name: Test gambling AI filter (one-off)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 3m
          script: |
            docker exec kimbor_bot node -e "
              const { checkGamblingWithAI } = require('/app/apps/bot/dist/moderation/gamblingAiCheck.js');
              const geminiKey = process.env.GEMINI_API_KEY;
              (async () => {
                const cases = [
                  'tetya Anvar har kuni yutyapti, qiziqsangiz shaxsiyga yozing',
                  'bugun futbolda kim yutadi deb oylaysiz',
                  'tugilgan kuningiz bilan baxtli bolib yashang',
                ];
                for (const c of cases) {
                  const start = Date.now();
                  const r = await checkGamblingWithAI(c, geminiKey);
                  console.log(JSON.stringify({ text: c, ms: Date.now()-start, isGamblingAd: r }));
                }
                process.exit(0);
              })().catch(e => { console.error('ERR', e); process.exit(1); });
            "
