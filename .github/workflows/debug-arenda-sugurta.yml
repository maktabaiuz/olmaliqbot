name: One-off - Debug arenda moshina to sugurta mismatch

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Run via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            docker exec kimbor_bot node -e "
              const { classifyQuery } = require('/app/apps/bot/dist/filter/aiClassifier.js');
              const CITY = '23fdb721-7073-4fd3-bda5-b61bde593490';
              (async () => {
                const msg = \"Akalar arendaga yegil moshina kerak kimda bo'lsa qarab akuratniy haydab yuriladi uzoq muddatga\";
                for (let i=0;i<3;i++) {
                  const r = await classifyQuery(msg, CITY);
                  console.log('CLASSIFY_RESULT run'+i+':', JSON.stringify(r));
                }
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "
            echo '---SEARCH ENGINE DIRECT---'
            docker exec kimbor_api node -e "
              const { searchListings } = require('/app/packages/core/dist/index.js');
              const CITY = '23fdb721-7073-4fd3-bda5-b61bde593490';
              (async () => {
                const msg = \"Akalar arendaga yegil moshina kerak kimda bo'lsa qarab akuratniy haydab yuriladi uzoq muddatga\";
                console.log('=== with categoryName=sug urta (simulating AI mistake) ===');
                const r1 = await searchListings({ cityId: CITY, categoryName: \"sug'urta\", rawMessage: msg, intent: 'SERVICE' });
                console.log(JSON.stringify(r1 ? { name: r1.listing && r1.listing.name } : null));
                console.log('=== jargon-only, no categoryName ===');
                const r2 = await searchListings({ cityId: CITY, rawMessage: msg, intent: 'SERVICE' });
                console.log(JSON.stringify(r2 ? { name: r2.listing && r2.listing.name } : null));
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "
