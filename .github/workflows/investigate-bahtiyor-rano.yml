name: One-off - Check Bahtiyor and Rano listing category details

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Investigate via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();
              (async () => {
                const listings = await db.listing.findMany({
                  where: { name: { in: ['Bahtiyor', 'Rano'] } },
                  select: { id: true, name: true, jargonSynonyms: true, description: true, category: { select: { name: true, objectType: true, synonyms: true } } },
                });
                console.log(JSON.stringify(listings, null, 2));
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "
