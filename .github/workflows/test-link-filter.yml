name: Test link filter (one-off)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 3m
          script: |
            docker exec kimbor_bot node -e "
              const { db } = require('/app/packages/db/dist/index.js');
              const { checkEasyModerationFilters } = require('/app/packages/core/dist/index.js');
              (async () => {
                const city = await db.city.findFirst();
                const group = await db.cityGroup.create({
                  data: { city: { connect: { id: city.id } }, chatId: BigInt(-555444333), title: 'PROD Test Guruh' },
                });
                await db.groupFeatureToggle.create({ data: { cityGroupId: group.id, featureKey: 'SPAM_LINK', isEnabled: true } });
                await db.allowedDomain.create({ data: { cityGroupId: group.id, domain: 'olmaliqshop.uz' } });

                const fresh = await db.cityGroup.findUnique({
                  where: { id: group.id },
                  include: { featureToggles: { where: { isEnabled: true } }, allowedDomains: true },
                });
                const enabledKeys = new Set(fresh.featureToggles.map(f => f.featureKey));
                const allowed = ['t.me/olmaliq_bot', 'olmaliq.online', ...fresh.allowedDomains.map(d => d.domain)];
                console.log('Yoqilgan:', [...enabledKeys], 'Ruxsat etilgan:', allowed);

                const tests = ['olmaliqshop.uz/mahsulot', 'boshqa-shop.uz/x', 'olmaliq.online/listing/5', 't.me/olmaliq_bot', 'salom hammaga'];
                for (const t of tests) {
                  const r = checkEasyModerationFilters(t, enabledKeys, allowed);
                  console.log(JSON.stringify({ text: t, result: r }));
                }

                await db.allowedDomain.deleteMany({ where: { cityGroupId: group.id } });
                await db.groupFeatureToggle.deleteMany({ where: { cityGroupId: group.id } });
                await db.cityGroup.delete({ where: { id: group.id } });
                console.log('Tozalandi');
                process.exit(0);
              })().catch(e => { console.error('ERR', e); process.exit(1); });
            "
