name: One-off - Investigate false-positive matches

on:
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Query via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();
              (async () => {
                console.log('=== A) QueryLog: kochdi / salon / jak ===');
                const logs1 = await db.queryLog.findMany({
                  where: {
                    OR: [
                      { rawMessage: { contains: 'кочди', mode: 'insensitive' } },
                      { rawMessage: { contains: 'kochdi', mode: 'insensitive' } },
                      { rawMessage: { contains: 'салон', mode: 'insensitive' } },
                      { rawMessage: { contains: 'salon', mode: 'insensitive' } },
                    ],
                  },
                  orderBy: { createdAt: 'desc' },
                  take: 15,
                  select: { rawMessage: true, categoryName: true, landmarkName: true, isResolved: true, confidence: true, createdAt: true },
                });
                console.log(JSON.stringify(logs1, null, 2));

                console.log('=== B) QueryLog: kazmaz / avtomobil kondisioner ===');
                const logs2 = await db.queryLog.findMany({
                  where: {
                    OR: [
                      { rawMessage: { contains: 'kazmaz', mode: 'insensitive' } },
                      { rawMessage: { contains: 'казмаз', mode: 'insensitive' } },
                      { categoryName: { contains: 'sug', mode: 'insensitive' } },
                    ],
                  },
                  orderBy: { createdAt: 'desc' },
                  take: 20,
                  select: { rawMessage: true, categoryName: true, landmarkName: true, isResolved: true, confidence: true, createdAt: true },
                });
                console.log(JSON.stringify(logs2, null, 2));

                console.log('=== C) Betonchi listing jargon ===');
                const beton = await db.listing.findMany({
                  where: { name: { contains: 'beton', mode: 'insensitive' } },
                  select: { id: true, name: true, categoryId: true, jargonSynonyms: true, specificServices: true },
                });
                console.log(JSON.stringify(beton, null, 2));
              })().catch(e=>{console.error(e); process.exit(1)}).finally(()=>db.\$disconnect());
            "
