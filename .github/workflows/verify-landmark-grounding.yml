name: One-off - Verify landmark grounding

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Run tests via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            docker exec kimbor_bot node -e "
              const { classifyQuery } = require('/app/apps/bot/dist/filter/aiClassifier.js');
              const CITY = '23fdb721-7073-4fd3-bda5-b61bde593490';
              (async () => {
                const results = {};

                console.log('=== A) Ma\\'lum mo\\'ljallarni TO\\'G\\'RI tanish (sinonim variant bilan) ===');
                const known = [
                  ['karzinka oldida taksi kerak', 'karzinka'],
                  ['buxora maktab atrofida santexnik kerak', 'buxora maktab'],
                  ['gosstandart orqasidagi 5e avtoservisda mashina yuvish bormi', 'gosstandart'],
                  ['oydin tuneldan chiqqanda taksi kerak', 'oydin tunel'],
                  ['kalonka ustasi kerak suv isimayabdi', null],
                ];
                for (const [q, expectSubstr] of known) {
                  const r = await classifyQuery(q, CITY);
                  const lm = (r.landmark || '').toLowerCase();
                  const ok = expectSubstr ? lm.includes(expectSubstr) : true;
                  console.log(JSON.stringify({q, landmark: r.landmark, category: r.category, ok}));
                }

                console.log('');
                console.log('=== B) Ro\\'yxatda YO\\'Q joy — o\\'z so\\'zi bilan qolishi kerak, zo\\'rlab moslashtirilmasin ===');
                const unknown = [
                  'yangi bozor oldida usta kerak',
                  'metro bekati yonida taksi',
                ];
                for (const q of unknown) {
                  const r = await classifyQuery(q, CITY);
                  console.log(JSON.stringify({q, landmark: r.landmark, category: r.category}));
                }

                console.log('');
                console.log('=== C) Buzuq/chalkash matn — mo\\'ljal sifatida noto\\'g\\'ri talqin qilinmasligi kerak ===');
                const garbled = [
                  '3-orinda taksi kerak',
                  'shu yerda mashina kerak edi',
                  'т0йтепа паворот тахи керак',
                ];
                for (const q of garbled) {
                  const r = await classifyQuery(q, CITY);
                  console.log(JSON.stringify({q, landmark: r.landmark, category: r.category, intent: r.intent}));
                }

                console.log('');
                console.log('=== D) Regressiya — avval tuzatilgan xato turlari qayta chiqmasligi ===');
                const regression = [
                  ['ishlaydigan odam kerak', 'umumiy so\\'z filtri'],
                  ['taksi kerak edi karzinka tomonda', 'TRANSPORT + landmark filtri'],
                  ['mashina ochib qolgan, kimda perekrutel bor', 'category=NONE kutiladi'],
                  ['Matizga gaz o\\'rnatish qancha', 'category=NONE kutiladi'],
                  ['kvartira kerak', 'oddiy ob\\'ekt qidiruv'],
                ];
                for (const [q, note] of regression) {
                  const r = await classifyQuery(q, CITY);
                  console.log(JSON.stringify({q, note, category: r.category, landmark: r.landmark, intent: r.intent}));
                }

                console.log('');
                console.log('=== DONE ===');
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "
