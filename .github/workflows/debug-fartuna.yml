name: One-off - reproduce fartuna wrong match

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 3m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const core = require('/app/packages/core/dist/index.js');
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const { classifyQuery } = require('/app/apps/bot/dist/filter/aiClassifier.js');
            const db = new PrismaClient();
            (async () => {
              const mondo = await db.listing.findFirst({ where: { name: { contains: 'Mondo', mode: 'insensitive' } } });
              const cityId = mondo.cityId;
              const q = 'Akalar fartunani nomeri bormi';

              console.log('NORMALIZED:', core.normalizeText(q));
              const c = await classifyQuery(q, cityId, BigInt(7000001));
              console.log('CLASSIFICATION:', JSON.stringify(c));

              const isSeeking = c.intent !== 'NOT_RELEVANT';
              const sr = await core.searchListings({
                cityId,
                categoryName: isSeeking ? c.category : null,
                landmarkName: isSeeking ? c.landmark : null,
                rawMessage: q,
              });
              console.log('MATCHED:', sr ? sr.listing.name.trim() : 'NONE (jim)');

              // Fartuna nomli yoki jargonli yozuv bazada bormi?
              const fartunaListing = await db.listing.findMany({ where: { cityId, OR: [ { name: { contains: 'fartuna', mode: 'insensitive' } }, { name: { contains: 'fortuna', mode: 'insensitive' } }, { jargonSynonyms: { hasSome: ['fartuna', 'fortuna'] } } ] } });
              console.log('FARTUNA_IN_DB:', JSON.stringify(fartunaListing.map(l => ({ name: l.name, type: l.type, jargonSynonyms: l.jargonSynonyms }))));

              // Kafe kategoriyasidagi barcha yozuvlar
              const kafeCat = await db.category.findFirst({ where: { name: { contains: 'Kafe', mode: 'insensitive' } } });
              if (kafeCat) {
                const kafeListings = await db.listing.findMany({ where: { categoryId: kafeCat.id, cityId }, select: { name: true, jargonSynonyms: true } });
                console.log('KAFE_CATEGORY_LISTINGS:', JSON.stringify(kafeListings));
              }

              await db.\$disconnect();
              process.exit(0);
            })().catch(e => { console.error('DEBUG_ERROR:', e); process.exit(1); });
            "
