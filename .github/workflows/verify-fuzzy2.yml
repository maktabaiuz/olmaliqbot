name: One-off - isolate whether landmark filter causes the 2-candidate set
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 90s
          command_timeout: 10m
          script: |
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const core = require('/app/packages/core/dist/index.js');
              const db = new PrismaClient();
              (async () => {
                const city = await db.city.findFirst();
                const m = 'Assalomu aleykum akalar 29 linya kanechnik tomondan qanaqa choyxona bor';
                // Test A: landmark omitted entirely
                const rA = await core.searchListings({
                  cityId: city.id, categoryName: 'choyxona', landmarkName: null, rawMessage: m,
                  intent: 'SERVICE', name: null, requestedBadges: [], rentalFilters: null, isReplyToPhoto: false, debug: true,
                });
                console.log('out:A_noLandmark_total=' + rA?.totalMatches + ' name=' + rA?.listing?.name);
                console.log('out:A_ids=' + JSON.stringify(rA?.scoreBreakdown?.map(s=>s.listingId)));
                // Test B: with landmark, but rawMessage stripped of 'choyxona' word entirely (still category set)
                const m2 = 'Assalomu aleykum akalar 29 linya kanechnik tomondan qanaqa bor';
                const rB = await core.searchListings({
                  cityId: city.id, categoryName: 'choyxona', landmarkName: '29 linya', rawMessage: m2,
                  intent: 'SERVICE', name: null, requestedBadges: [], rentalFilters: null, isReplyToPhoto: false, debug: true,
                });
                console.log('out:B_noChoyxonaWord_total=' + rB?.totalMatches + ' name=' + rB?.listing?.name);
                console.log('out:B_ids=' + JSON.stringify(rB?.scoreBreakdown?.map(s=>s.listingId)));
                await db.\$disconnect();
              })().catch(e=>{console.error('ERR', e.stack); process.exit(1)});
            "
