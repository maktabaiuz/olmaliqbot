name: One-off - find exact fuzzy match target for 'perekrutel'

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const core = require('/app/packages/core/dist/index.js');
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const db = new PrismaClient();
            (async () => {
              const N = core.normalizeText;
              const lev = core.levenshteinDistance;
              const cand = 'perekrutel';
              const allCategories = await db.category.findMany({ select: { id: true, name: true, synonyms: true } });
              for (const cat of allCategories) {
                const targets = [cat.name, ...cat.synonyms].map((s) => N(s).replace(/[\\s'-]+/g, '')).filter((t) => t.length >= 4);
                for (const target of targets) {
                  if (Math.abs(target.length - cand.length) > 3) continue;
                  const dist = lev(cand, target);
                  const threshold = Math.max(1, Math.floor(target.length / 6));
                  if (dist <= threshold + 2) {
                    console.log('CLOSE:', JSON.stringify({ cat: cat.name, target, dist, threshold, wouldMatch: dist <= threshold }));
                  }
                }
              }
              await db.\$disconnect();
              process.exit(0);
            })().catch(e => { console.error('DEBUG_ERROR:', e); process.exit(1); });
            "
