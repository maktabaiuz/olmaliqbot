name: One-off - verify transport-landmark fix and full regression

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const core = require('/app/packages/core/dist/index.js');
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const { classifyQuery } = require('/app/apps/bot/dist/filter/aiClassifier.js');
            const db = new PrismaClient();
            (async () => {
              const g = await db.listing.findFirst({ where: { name: { contains: 'Gondra', mode: 'insensitive' } } });
              const cityId = g.cityId;
              let pass = 0; const failures = [];

              async function run(label, q, userId, expectFn) {
                const c = await classifyQuery(q, cityId, BigInt(userId));
                if (c.intent !== 'EMERGENCY' && (core.isSelfOffer(q) || core.isJobVacancy(q) || core.isUtilityStatusQuestion(q))) {
                  const ok0 = expectFn('NONE');
                  if (ok0) pass++; else failures.push(label + ' -> NONE (deterministik)');
                  console.log((ok0 ? 'PASS' : 'FAIL'), label, '| DETERMINISTIK | MATCHED: NONE');
                  return;
                }
                const seek = c.intent !== 'NOT_RELEVANT';
                const sr = await core.searchListings({
                  cityId, categoryName: seek ? c.category : null, landmarkName: seek ? c.landmark : null,
                  rawMessage: q, intent: c.intent, name: seek ? c.name : null,
                });
                const m = sr ? sr.listing.name.trim() : 'NONE';
                const ok = expectFn(m);
                if (ok) pass++; else failures.push(label + ' -> ' + m);
                console.log((ok ? 'PASS' : 'FAIL'), label, '| intent:', c.intent, '| cat:', JSON.stringify(c.category), '| landmark:', JSON.stringify(c.landmark), '| MATCHED:', m);
              }
              const SILENT = (m) => m === 'NONE';
              const ANSWER = (m) => m !== 'NONE';
              const IS = (s) => (m) => m.toLowerCase().includes(s);

              console.log('=== 0. YANGI: TAKSI + MOLJAL (real shikoyat) ===');
              await run('TAKSI_BOCHKA', 'Assalomu alekum bochkadan olmaliqqa ketadigan taxilar bormi', 9700101, ANSWER);
              await run('TAKSI_SAMARQAND', 'Olmaliqdan Samarqand Ishtihonga taksi kk', 9700102, ANSWER);
              await run('TAKSI_TOSHKENT', 'toshkentga taksi kerak', 9700103, IS('xolmurtof'));
              await run('TAKSI_PLAIN', 'taksi kerak', 9700104, ANSWER);
              await run('LABO_MOLJAL', 'bochkadan yuk tashiydigan labo kerak', 9700105, ANSWER);

              console.log('=== 0b. HAQIQIY MOLJALLI (nozapravka/usta) SOROVLAR HALI ISHLASHI KERAK ===');
              await run('TOYTEPA_YOQ', 'toytepa pavarot zaprafka bormi', 9700110, SILENT);
              await run('BESHBIR_1', 'beshbirdagi zaprafka ochiqmi', 9700111, IS('carvon'));
              await run('YAQIN_ATROF', 'yaqin atrofda zapravka bormi', 9700112, ANSWER);

              console.log('=== 1. OLDINGI TUZATISHLAR (regressiya) ===');
              await run('SANTEXNIK', 'santexnik kerak', 9700120, ANSWER);
              await run('GONDRA', 'gondra zaprafka ochiqmi', 9700121, IS('gondra'));
              await run('DESKA', 'deska zaprafka ishlayabdimi', 9700122, IS('deska'));
              await run('PEREKRUTEL', 'Assalomu aleykum mashina ochib qolgan kimda perekrutel bor', 9700123, SILENT);
              await run('GAZ_PLITA', 'Уйдаги газ плитани ремонт киладиган усталар номери кимда бор ёзиб юборинглар илтимос', 9700124, IS('sardor'));
              await run('MOYXONA', 'moshina moyi almashtirish kerak', 9700125, IS('dilshod'));
              await run('QULF', 'mashinamni qulfi buzilgan, kimda qulf ustasi bor', 9700126, IS('jamshid'));
              await run('GAS_NEWS', 'Акалар газ качон беришидан хабарилар борми?', 9700127, SILENT);
              await run('MATIZ', 'Matiz 35talik propan bilan qancha yuradi', 9700128, SILENT);
              await run('ARENDA_CAR', 'арендага механика мошин керак', 9700129, SILENT);
              await run('KVARTIRA', 'ijaraga 1 xonali kvartira kerak edi', 9700130, ANSWER);
              await run('BALON', 'balon kerak', 9700131, ANSWER);
              await run('MIB', 'Olmaliq mib nechigacha ishlaydi', 9700132, SILENT);
              await run('FORTUNA', 'akalar fartunani nomeri bormi', 9700133, SILENT);
              await run('LADA_SERVICE', 'sariq bola pizza oldida LADA magazin bor, u yerda shina bormi', 9700134, SILENT);

              console.log('---');
              console.log('RESULT: PASS=' + pass + ' FAIL=' + failures.length);
              for (const f of failures) console.log('FAILED:', f);
              await db.\$disconnect();
              process.exit(failures.length > 0 ? 1 : 0);
            })().catch(e => { console.error('DEBUG_ERROR:', e); process.exit(1); });
            "
