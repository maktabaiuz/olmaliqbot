name: One-off - stability check for taxi fix and known AI-nondeterminism cases

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const core = require('/app/packages/core/dist/index.js');
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const { classifyQuery } = require('/app/apps/bot/dist/filter/aiClassifier.js');
            const db = new PrismaClient();
            (async () => {
              const g = await db.listing.findFirst({ where: { name: { contains: 'Gondra', mode: 'insensitive' } } });
              const cityId = g.cityId;

              async function stabilityRun(label, q, n, expectFn) {
                let allOk = true;
                const cats = {};
                for (let i = 0; i < n; i++) {
                  const c = await classifyQuery(q, cityId, BigInt(Math.floor(Math.random()*1000000)+9800000));
                  cats[c.intent + '|' + c.category] = (cats[c.intent + '|' + c.category] || 0) + 1;
                  const seek = c.intent !== 'NOT_RELEVANT';
                  const sr = await core.searchListings({
                    cityId, categoryName: seek ? c.category : null, landmarkName: seek ? c.landmark : null,
                    rawMessage: q, intent: c.intent, name: seek ? c.name : null,
                  });
                  const m = sr ? sr.listing.name.trim() : 'NONE';
                  if (!expectFn(m)) { allOk = false; console.log('  ', label, 'run', i, 'FAILED with', m, '| intent/cat:', c.intent + '/' + c.category); }
                }
                console.log((allOk ? 'PASS' : 'FAIL'), label, '(' + n + 'x) | AI javob taqsimoti:', JSON.stringify(cats));
              }
              const ANSWER = (m) => m !== 'NONE';
              const IS = (s) => (m) => m.toLowerCase().includes(s);

              console.log('=== TAKSI TUZATISHI BARQARORLIGI ===');
              await stabilityRun('TAKSI_BOCHKA', 'Assalomu alekum bochkadan olmaliqqa ketadigan taxilar bormi', 5, ANSWER);
              await stabilityRun('TAKSI_SAMARQAND', 'Olmaliqdan Samarqand Ishtihonga taksi kk', 5, ANSWER);

              console.log('=== ESKI, AI-BEQARORLIGIGA BOGLIQ HOLATLAR (tuzatishdan mustaqil) ===');
              await stabilityRun('TOYTEPA_YOQ', 'toytepa pavarot zaprafka bormi', 5, (m) => m === 'NONE');
              await stabilityRun('GAZ_PLITA', 'Уйдаги газ плитани ремонт киладиган усталар номери кимда бор ёзиб юборинглар илтимос', 5, IS('sardor'));
              await stabilityRun('PEREKRUTEL', 'Assalomu aleykum mashina ochib qolgan kimda perekrutel bor', 5, (m) => m === 'NONE');

              await db.\$disconnect();
              process.exit(0);
            })().catch(e => { console.error('DEBUG_ERROR:', e); process.exit(1); });
            "
