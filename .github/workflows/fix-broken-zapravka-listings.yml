name: One-off - fix broken zapravka listings

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Fix via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const db = new PrismaClient();
            (async () => {
              // Kategoriyasi ZAPRAVKA (objectType) bo'lgan, lekin turi (type) ADASHIB
              // boshqa qiymatda saqlangan yozuvlarni topamiz va tuzatamiz — bular
              // 'Turi bilan Kategoriya uzilib qolish' xatosi tufayli yaralgan.
              const broken = await db.listing.findMany({
                where: { type: { not: 'ZAPRAVKA' }, category: { objectType: 'ZAPRAVKA' } },
                include: { category: true },
              });
              console.log('BROKEN_FOUND:', JSON.stringify(broken.map(l => ({ id: l.id, name: l.name, type: l.type, category: l.category?.name }))));
              for (const l of broken) {
                const updated = await db.listing.update({ where: { id: l.id }, data: { type: 'ZAPRAVKA' } });
                console.log('FIXED:', updated.id, updated.name, updated.type);
              }
              await db.\$disconnect();
            })().catch(e => { console.error('FIX_ERROR:', e); process.exit(1); });
            "
