name: Test Zapravka + Lokatsiya button (one-off)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Full pipeline test via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 3m
          script: |
            echo "=== Full Zapravka + Lokatsiya button test (real prod DB) ==="
            docker exec -w /app/apps/bot kimbor_bot node -e "
              const { db } = require('@kimbor/db');
              const { searchListings } = require('@kimbor/core');
              const { buildResultKeyboard } = require('/app/apps/bot/dist/utils/listingReply.js');
              (async () => {
                const city = await db.city.findFirst();
                const landmark = await db.landmark.findFirst({ where: { cityId: city.id } });

                const cat = await db.category.upsert({
                  where: { name: '__TEST_ZAPRAVKA_CAT__' },
                  update: {},
                  create: { name: '__TEST_ZAPRAVKA_CAT__', objectType: 'ZAPRAVKA', synonyms: ['test zapravka'] },
                });

                const listing = await db.listing.create({
                  data: {
                    cityId: city.id,
                    categoryId: cat.id,
                    primaryLandmarkId: landmark.id,
                    type: 'ZAPRAVKA',
                    name: '__TEST_ZAPRAVKA_LISTING__',
                    phone: '+998900000000',
                    badges: ['Metan', 'Propan'],
                    mapUrl: 'https://yandex.uz/maps/?pt=69.6,41.0&z=16&l=map',
                    jargonSynonyms: ['test zapravka kerak'],
                  },
                });
                console.log('out: created test listing id=' + listing.id);

                const result = await searchListings({ cityId: city.id, categoryName: '__TEST_ZAPRAVKA_CAT__', rawMessage: 'test zapravka kerak' });
                console.log('out: searchResult found=' + !!result);
                if (result) {
                  console.log('out: formattedText=' + JSON.stringify(result.formattedText));
                  console.log('out: listing.mapUrl=' + result.listing.mapUrl);

                  const keyboard = await buildResultKeyboard(0, result.listingId, result.listing.mapUrl);
                  console.log('out: keyboard=' + JSON.stringify(keyboard.inline_keyboard));
                  const hasLocationButton = keyboard.inline_keyboard.some(row => row.some(btn => btn.text === '📍 Lokatsiya' && btn.url === result.listing.mapUrl));
                  console.log('out: hasGreenLocationButtonWithCorrectUrl=' + hasLocationButton);
                }

                // cleanup
                await db.listing.delete({ where: { id: listing.id } });
                await db.category.delete({ where: { id: cat.id } });
                console.log('out: cleanup done');
              })().catch(e => { console.error('err:', e.message, e.stack); process.exit(1); }).then(() => process.exit(0));
            "
