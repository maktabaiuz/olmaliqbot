name: One-off - Check fresh bot logs for Yana button error

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            echo "=== Full recent bot logs (last 300 lines) ==="
            docker logs --tail 300 kimbor_bot 2>&1
