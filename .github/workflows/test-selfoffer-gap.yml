name: One-off - Test isSelfOffer gap for bare phone-number ads

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Run via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            docker exec kimbor_bot node -e "
              const core = require('/app/packages/core/dist/index.js');
              const cases = [
                'Лабо хизмати 776880696',
                'Labo xizmati 776880696',
                'Taksi kerak 776880696',
                'Taksi kerak, 776880696 ga yozing',
                'Santexnik ustasi 998901234567',
                'Elektrik 901234567',
                'Kvartira 150000000 sotiladi',
                'Kvartira kerak, byudjet 150000000',
              ];
              for (const c of cases) {
                console.log(JSON.stringify({ msg: c, isSelfOffer: core.isSelfOffer(c) }));
              }
            "
