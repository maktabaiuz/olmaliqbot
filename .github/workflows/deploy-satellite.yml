name: One-off - Deploy satellite map layer
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 90s
          command_timeout: 15m
          script: |
            cd /root/kimbor
            git pull origin main || git pull origin master
            git log -1 --oneline
            docker compose -f docker-compose.prod.yml up -d --build
            sleep 20
            echo "--- verify satellite tile URL is reachable from the server itself ---"
            curl -sI "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/14/6522/6224" | head -3
