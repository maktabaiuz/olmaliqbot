name: One-off - verify EV-charging fix and full regression

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const core = require('/app/packages/core/dist/index.js');
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const { classifyQuery } = require('/app/apps/bot/dist/filter/aiClassifier.js');
            const db = new PrismaClient();
            (async () => {
              const g = await db.listing.findFirst({ where: { name: { contains: 'Gondra', mode: 'insensitive' } } });
              const cityId = g.cityId;
              let pass = 0; const failures = [];

              async function run(label, q, userId, expectFn) {
                const c = await classifyQuery(q, cityId, BigInt(userId));
                if (c.intent !== 'EMERGENCY' && (core.isSelfOffer(q) || core.isJobVacancy(q))) {
                  const ok0 = expectFn('NONE', []);
                  if (ok0) pass++; else failures.push(label + ' -> NONE (elon)');
                  console.log((ok0 ? 'PASS' : 'FAIL'), label, \"| E'LON | MATCHED: NONE\");
                  return;
                }
                const seek = c.intent !== 'NOT_RELEVANT';
                const sr = await core.searchListings({
                  cityId,
                  categoryName: seek ? c.category : null,
                  landmarkName: seek ? c.landmark : null,
                  rawMessage: q,
                  intent: c.intent,
                  name: seek ? c.name : null,
                });
                const m = sr ? sr.listing.name.trim() : 'NONE';
                const others = sr ? sr.otherMatches.length : 0;
                // Barcha nomzodlar (asosiy + boshqalari) nechta ekanini bilish uchun
                const allNames = sr ? [m] : [];
                const ok = expectFn(m, allNames);
                if (ok) pass++; else failures.push(label + ' -> ' + m + ' (+' + others + ' boshqa)');
                console.log((ok ? 'PASS' : 'FAIL'), label, '| cat:', JSON.stringify(c.category), '| MATCHED:', m, '| otherCount:', others);
              }
              const SILENT = (m) => m === 'NONE';
              const ANSWER = (m) => m !== 'NONE';
              const IS = (s) => (m) => m.toLowerCase().includes(s);

              console.log('=== 0. YANGI: ELEKTROMOBIL vs BENZIN ARALASHUVI ===');
              await run('EV_1', 'Elektra mabil zaprafka qata bor', 9700101, ANSWER);
              await run('EV_2', 'Elektromabil zaprafka', 9700102, ANSWER);
              await run('EV_3', 'Olmaliqda elektro mabil zaryadlash qata bor', 9700103, ANSWER);

              // Eng muhimi: nechta boshqa moslik bor - benzin zapravkalar sizib chiqmasligi kerak
              const c1 = await classifyQuery('Elektra mabil zaprafka qata bor', cityId, BigInt(9700104));
              const sr1 = await core.searchListings({
                cityId, categoryName: c1.category, landmarkName: c1.landmark,
                rawMessage: 'Elektra mabil zaprafka qata bor', intent: c1.intent, name: c1.name,
              });
              if (sr1) {
                const allTexts = [sr1.formattedText, ...sr1.otherMatches.map(o => o.formattedText)].join(' ');
                const hasGasStation = /gondra|carvon|deska/i.test(allTexts);
                const ok = !hasGasStation;
                if (ok) pass++; else failures.push('EV_NO_GAS_LEAK -> benzin zapravka topildi!');
                console.log((ok ? 'PASS' : 'FAIL'), 'EV_NO_GAS_LEAK | jami natijalar:', 1 + sr1.otherMatches.length, '| benzin_bor:', hasGasStation);
              } else {
                failures.push('EV_NO_GAS_LEAK -> natija umuman topilmadi');
                console.log('FAIL EV_NO_GAS_LEAK | natija yoq');
              }

              // ARENDA_CAR_CYR uchun AI intent BA'ZAN NOT_RELEVANT, ba'zan
              // SERVICE deb qaytaradi (beqaror) - shu sabab 8 marta qayta
              // ishga tushirib, HAR SAFAR to'g'ri (NONE) natija berishini
              // tekshiramiz - bitta o'tish yetarli emas.
              console.log('=== ARENDA_CAR_CYR BARQARORLIGI (8 marta) ===');
              let arendaOk = true;
              for (let i = 0; i < 8; i++) {
                const ci = await classifyQuery('арендага механика мошин керак', cityId, BigInt(9700200 + i));
                const seeki = ci.intent !== 'NOT_RELEVANT';
                const sri = await core.searchListings({
                  cityId,
                  categoryName: seeki ? ci.category : null,
                  landmarkName: seeki ? ci.landmark : null,
                  rawMessage: 'арендага механика мошин керак',
                  intent: ci.intent,
                  name: seeki ? ci.name : null,
                });
                const mi = sri ? sri.listing.name.trim() : 'NONE';
                console.log('  run', i, '| intent:', ci.intent, '| cat:', JSON.stringify(ci.category), '| MATCHED:', mi);
                if (mi !== 'NONE') arendaOk = false;
              }
              if (arendaOk) pass++; else failures.push('ARENDA_CAR_STABILITY -> ba\\'zan aloqasiz javob berdi');
              console.log((arendaOk ? 'PASS' : 'FAIL'), 'ARENDA_CAR_STABILITY');

              console.log('=== 1. REGRESSIYA ===');
              await run('GAZ_PLITA', 'Уйдаги газ плитани ремонт киладиган усталар номери кимда бор ёзиб юборинглар илтимос', 9999001, IS('sardor'));
              await run('SANTEXNIK_USTA', 'santexnik usta kerak edi shoshilinch', 9999002, IS('akrom'));
              await run('JOB_ORIGINAL', \"Shlakablok terishga podsobnik yordamchi kerak qanaqa ish bo'lsa yordam qilishi kerak 779758180\", 9900001, SILENT);
              await run('AD_MAKLER', \"Kimga maklersiz Olmaliqda uy kerak bo'lsa profilga o'ting\", 9910001, SILENT);
              await run('MIB', 'Olmaliq mib nechigacha ishlaydi', 9900030, SILENT);
              await run('LADA_SERVICE', 'sariq bola pizza oldida LADA magazin bor, u yerda shina bormi', 9900034, SILENT);
              await run('FORTUNA_1', 'akalar fartunani nomeri bormi', 9900036, SILENT);
              await run('BESHBIR_1', 'beshbirdagi zaprafka ochiqmi', 9900040, IS('carvon'));
              await run('BESHBIR_3', 'beshbir zaprafka nechigacha ishlaydi', 9900042, IS('carvon'));
              await run('GONDRA', 'gondra zaprafka ochiqmi', 9900043, IS('gondra'));
              await run('DESKA', 'deska zaprafka ishlayabdimi', 9900044, IS('deska'));
              await run('AVTOELEKTIRIK', 'avtoelektirik kerak', 9900046, ANSWER);
              await run('ARENDA_CAR_CYR', 'арендага механика мошин керак', 9900020, SILENT);
              await run('ARENDA_LESA', 'lesa arenda kerak', 9900022, IS('lesa'));
              await run('KVARTIRA', 'ijaraga 1 xonali kvartira kerak edi', 9900051, ANSWER);
              await run('BALON', 'balon kerak', 9900047, ANSWER);
              await run('TOY_TEPA', 'toy tepada balon kerak', 9900050, ANSWER);

              console.log('---');
              console.log('RESULT: PASS=' + pass + ' FAIL=' + failures.length);
              for (const f of failures) console.log('FAILED:', f);
              await db.\$disconnect();
              process.exit(failures.length > 0 ? 1 : 0);
            })().catch(e => { console.error('DEBUG_ERROR:', e); process.exit(1); });
            "
