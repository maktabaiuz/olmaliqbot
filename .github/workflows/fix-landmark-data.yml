name: One-off - Fix landmark spelling variants and seed missing real landmarks
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Fix via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 90s
          command_timeout: 10m
          script: |
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();

              async function addSynonyms(nameEquals, newSynonyms) {
                const lm = await db.landmark.findFirst({ where: { name: { equals: nameEquals, mode: 'insensitive' } } });
                if (!lm) { console.log('NOT FOUND for synonym-add:', nameEquals); return; }
                const merged = Array.from(new Set([...lm.synonyms, ...newSynonyms.map(s => s.toLowerCase())]));
                await db.landmark.update({ where: { id: lm.id }, data: { synonyms: merged } });
                console.log('SYNONYMS UPDATED:', nameEquals, '->', JSON.stringify(merged));
              }

              async function createIfMissing(cityId, name, synonyms) {
                const existing = await db.landmark.findFirst({ where: { cityId, name: { equals: name, mode: 'insensitive' } } });
                if (existing) { console.log('ALREADY EXISTS:', name); return; }
                const created = await db.landmark.create({
                  data: { cityId, name, synonyms: Array.from(new Set([name.toLowerCase(), ...synonyms.map(s => s.toLowerCase())])) },
                });
                console.log('CREATED:', JSON.stringify({ name: created.name, synonyms: created.synonyms }));
              }

              (async () => {
                const city = await db.city.findFirst();
                const cityId = city.id;
                console.log('CITY:', city.name, cityId);

                console.log('--- spelling & format variant fixes ---');
                await addSynonyms('qaroxtoy choyxona', ['qorahitoy', 'qoraxitoy', 'qorahitoy choyxona']);
                await addSynonyms('5/1', ['5.1', '51']);
                await addSynonyms('5/1 dahasi', ['5.1 dahasi']);
                await addSynonyms('5/2', ['5.2', '52']);
                await addSynonyms('5/2 Dahasi', ['5.2 dahasi']);
                await addSynonyms('5/3 dahasi', ['5.3 dahasi', '5/3', '5.3']);
                await addSynonyms('67 dahasi', ['67']);
                await addSynonyms('kosmos, upravleniya', ['kosmos']);

                console.log('--- seed missing real landmarks (from QueryLog mining) ---');
                await createIfMissing(cityId, 'Shanxay', ['shankhay', 'shanhay']);
                await createIfMissing(cityId, 'Telegraf', []);
                await createIfMissing(cityId, 'Katta bozor', ['katta bazar']);
                await createIfMissing(cityId, 'Fayz Baraka bozori', ['fayz baraka', 'fayz-baraka bozori']);
                await createIfMissing(cityId, \"Xo'jirohat\", ['rohat', 'xoz rohat', 'hoz rohat', 'xojirohat']);
                await createIfMissing(cityId, 'DSK', ['dsk', 'дск']);
                await createIfMissing(cityId, 'Yubileyniy', ['yubiley']);
                await createIfMissing(cityId, 'MRU', []);
                await createIfMissing(cityId, 'SRMZ', []);
                await createIfMissing(cityId, '20-maktab', ['20 maktab', 'yigirmanchi maktab']);
                await createIfMissing(cityId, \"Uzum bog'\", ['uzum bogi', 'uzumbog']);
                await createIfMissing(cityId, '1-liniya', ['1 liniya', 'birinchi liniya']);
                await createIfMissing(cityId, '6-liniya', ['6 liniya', 'oltinchi liniya']);
                await createIfMissing(cityId, '3-mavze', ['3 mavze', 'uchinchi mavze']);
                await createIfMissing(cityId, '5-mavze', ['5 mavze', 'beshinchi mavze']);

                console.log('--- final count ---');
                const total = await db.landmark.count({ where: { cityId } });
                console.log('TOTAL_LANDMARKS_NOW:', total);
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "
