name: One-off - End-to-end test of local dispatcher numbers feature

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Test via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            echo "=== 1) Confirm jargonWords column exists on emergency_numbers ==="
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();
              (async () => {
                const count = await db.emergencyNumber.count();
                console.log('emergencyNumber table reachable, count:', count);
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "

            echo ""
            echo "=== 2) Create a TEST local number via the real API (as SUPER_ADMIN) ==="
            docker exec kimbor_api node -e "
              const crypto = require('crypto');
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();
              function buildInitData(telegramId) {
                const botToken = process.env.BOT_TOKEN;
                const user = JSON.stringify({ id: telegramId, first_name: 'Test', last_name: 'Admin' });
                const params = { auth_date: Math.floor(Date.now()/1000).toString(), user };
                const paramsArray = Object.entries(params).sort((a,b)=>a[0].localeCompare(b[0]));
                const dataCheckString = paramsArray.map(([k,v])=>k+'='+v).join('\\n');
                const secretKey = crypto.createHmac('sha256','WebAppData').update(botToken).digest();
                const hash = crypto.createHmac('sha256', secretKey).update(dataCheckString).digest('hex');
                const usp = new URLSearchParams(params);
                usp.set('hash', hash);
                return usp.toString();
              }
              (async () => {
                const superAdmin = await db.user.findFirst({ where: { role: 'SUPER_ADMIN' } });
                const initData = buildInitData(superAdmin.telegramId.toString());
                const headers = { 'x-init-data': initData, 'Content-Type': 'application/json' };
                const res = await fetch('http://localhost:4000/api/admin/local-numbers', {
                  method: 'POST', headers,
                  body: JSON.stringify({ label: 'SINOV: Mahalla raisi', phoneNumber: '+998901112233', jargonWords: ['sinov mahalla raisi raqami'] }),
                });
                const data = await res.json();
                console.log('create status:', res.status, JSON.stringify(data));
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "

            echo ""
            echo "=== 3) Simulate a matching group message -> should get plain reply, no AI needed ==="
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const { findLocalDispatcherMatch } = require('/app/packages/core/dist/index.js');
              const db = new PrismaClient();
              const CITY = '23fdb721-7073-4fd3-bda5-b61bde593490';
              (async () => {
                const match = await findLocalDispatcherMatch('sinov mahalla raisi raqami bormi', CITY);
                console.log('Match result:', JSON.stringify(match));
                const noMatch = await findLocalDispatcherMatch('santexnik kerak', CITY);
                console.log('Unrelated message match (should be null):', JSON.stringify(noMatch));
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "

            echo ""
            echo "=== 4) Cleanup: delete the test entry ==="
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();
              (async () => {
                const del = await db.emergencyNumber.deleteMany({ where: { label: { contains: 'SINOV' } } });
                console.log('Deleted test entries:', del.count);
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "
