name: One-off - debug zapravka enum check

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e
            echo "--- ListingType enum inside kimbor_api container ---"
            docker exec kimbor_api node -e "const { ListingType } = require('@kimbor/db'); console.log(JSON.stringify(ListingType));"
            echo "--- ListingType enum inside kimbor_bot container ---"
            docker exec kimbor_bot node -e "const { ListingType } = require('@kimbor/db'); console.log(JSON.stringify(ListingType));"
            echo "--- postgres enum values ---"
            docker exec kimbor_postgres psql -U postgres -d kimbor_prod_db -c "SELECT unnest(enum_range(NULL::\"ListingType\"));" 2>&1 || docker exec kimbor_postgres psql -U kimbor -d kimbor_prod_db -c "SELECT unnest(enum_range(NULL::\"ListingType\"));" 2>&1 || true
