name: One-off - debug zapravka add failure 3

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const db = new PrismaClient();
            (async () => {
              const listings = await db.listing.findMany({ where: { name: { contains: 'Gondra', mode: 'insensitive' } }, include: { category: true, primaryLandmark: true } });
              console.log('GONDRA_LISTINGS:', JSON.stringify(listings.map(l => ({ id: l.id, name: l.name, type: l.type, phone: l.phone, mapUrl: l.mapUrl, category: l.category?.name, categoryObjectType: l.category?.objectType, landmark: l.primaryLandmark?.name, createdAt: l.createdAt })), null, 2));
              await db.\$disconnect();
            })().catch(e => { console.error('DEBUG_ERROR:', e); process.exit(1); });
            "
