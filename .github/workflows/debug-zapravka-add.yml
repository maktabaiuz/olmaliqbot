name: One-off - debug zapravka add failure 2

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e
            echo "--- req-d and req-13 full trace ---"
            docker logs --since 6h kimbor_api 2>&1 | grep -E '"reqId":"req-d"|"reqId":"req-13"'
            echo "--- all listings POST request completed lines (any reqId) ---"
            docker logs --since 6h kimbor_api 2>&1 | grep '"msg":"request completed"' | grep -E '"statusCode":(4|5)' | tail -40
