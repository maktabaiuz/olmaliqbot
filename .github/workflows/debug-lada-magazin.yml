name: One-off - reproduce LADA magazin wrong match

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 3m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const core = require('/app/packages/core/dist/index.js');
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const { classifyQuery } = require('/app/apps/bot/dist/filter/aiClassifier.js');
            const db = new PrismaClient();
            (async () => {
              const pizza = await db.listing.findFirst({ where: { name: { contains: 'Sariq Bola', mode: 'insensitive' } } });
              console.log('SARIQ_BOLA_PIZZA:', JSON.stringify(pizza ? { id: pizza.id, name: pizza.name, type: pizza.type, jargonSynonyms: pizza.jargonSynonyms, cityId: pizza.cityId } : 'NOT FOUND'));

              const cityId = pizza ? pizza.cityId : (await db.city.findFirst()).id;

              const lada = await db.listing.findMany({ where: { cityId, OR: [ { name: { contains: 'lada', mode: 'insensitive' } }, { jargonSynonyms: { hasSome: ['lada','lada magazin'] } } ] } });
              console.log('LADA_IN_DB:', JSON.stringify(lada.map(l => ({ name: l.name, type: l.type, jargonSynonyms: l.jargonSynonyms }))));

              const q = 'assalomualekum akalar 5/3 sariq bola pizza oldgai LADA magazin nomerini tashab berilar iltmos';
              const c = await classifyQuery(q, cityId, BigInt(9000001));
              console.log('CLASSIFICATION:', JSON.stringify(c));

              const isSeeking = c.intent !== 'NOT_RELEVANT';
              const sr = await core.searchListings({
                cityId,
                categoryName: isSeeking ? c.category : null,
                landmarkName: isSeeking ? c.landmark : null,
                rawMessage: q,
                intent: c.intent,
              });
              console.log('MATCHED:', sr ? sr.listing.name.trim() : 'NONE (jim)');

              await db.\$disconnect();
              process.exit(0);
            })().catch(e => { console.error('DEBUG_ERROR:', e); process.exit(1); });
            "
