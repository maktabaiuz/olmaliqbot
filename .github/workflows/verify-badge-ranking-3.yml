name: One-off - Verify badge ranking order change (real cases)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Test via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const { searchListings, extractRequestedBadges } = require('/app/packages/core/dist/index.js');
              const db = new PrismaClient();
              const CITY = '23fdb721-7073-4fd3-bda5-b61bde593490';
              (async () => {
                console.log('=== Test 1: Metan requested -> Deska ichidagi Zaprafka (only Metan) should rank ABOVE Gondra/CARVON ===');
                const msg1 = 'Metan quyadigan zapravka qayerda';
                const b1 = extractRequestedBadges(msg1);
                console.log('badges:', JSON.stringify(b1));
                const r1 = await searchListings({ cityId: CITY, categoryName: 'avtomobil zapravkasi', rawMessage: msg1, intent: 'SERVICE', requestedBadges: b1 });
                console.log('Top result:', r1 ? r1.listing.name : 'null', 'otherMatches:', r1 ? JSON.stringify(r1.otherMatches.map(m=>m.name)) : []);

                console.log('');
                console.log('=== Test 2: NO badge pref, same category -> baseline order (for comparison) ===');
                const r1b = await searchListings({ cityId: CITY, categoryName: 'avtomobil zapravkasi', rawMessage: 'zapravka qayerda', intent: 'SERVICE', requestedBadges: [] });
                console.log('Top result (no pref):', r1b ? r1b.listing.name : 'null');

                console.log('');
                console.log('=== Test 3: Zudlik requested in Taksi -> Muhridin (has Zudlik) should rank first ===');
                const msg3 = 'Taksi kerak zudlik bilan';
                const b3 = extractRequestedBadges(msg3);
                console.log('badges:', JSON.stringify(b3));
                const r3 = await searchListings({ cityId: CITY, categoryName: 'taksi', rawMessage: msg3, intent: 'SERVICE', requestedBadges: b3 });
                console.log('Top result:', r3 ? r3.listing.name : 'null');

                console.log('');
                console.log('=== Test 4: same Taksi category, NO badge pref -> baseline (for comparison) ===');
                const r3b = await searchListings({ cityId: CITY, categoryName: 'taksi', rawMessage: 'Taksi kerak', intent: 'SERVICE', requestedBadges: [] });
                console.log('Top result (no pref):', r3b ? r3b.listing.name : 'null');
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "
