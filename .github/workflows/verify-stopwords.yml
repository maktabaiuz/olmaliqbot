name: One-off - verify Uzbek stopwords dictionary against full session history

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 12m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const core = require('/app/packages/core/dist/index.js');
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const { classifyQuery } = require('/app/apps/bot/dist/filter/aiClassifier.js');
            const db = new PrismaClient();
            (async () => {
              const g = await db.listing.findFirst({ where: { name: { contains: 'Gondra', mode: 'insensitive' } } });
              const cityId = g.cityId;
              let pass = 0; const failures = [];

              async function run(label, q, userId, expectFn) {
                const c = await classifyQuery(q, cityId, BigInt(userId));
                if (c.intent !== 'EMERGENCY' && (core.isSelfOffer(q) || core.isJobVacancy(q) || core.isUtilityStatusQuestion(q))) {
                  const ok0 = expectFn('NONE');
                  if (ok0) pass++; else failures.push(label + ' -> NONE (deterministik)');
                  console.log((ok0 ? 'PASS' : 'FAIL'), label, '| DETERMINISTIK | MATCHED: NONE');
                  return;
                }
                const seek = c.intent !== 'NOT_RELEVANT';
                const sr = await core.searchListings({
                  cityId, categoryName: seek ? c.category : null, landmarkName: seek ? c.landmark : null,
                  rawMessage: q, intent: c.intent, name: seek ? c.name : null,
                });
                const m = sr ? sr.listing.name.trim() : 'NONE';
                const ok = expectFn(m);
                if (ok) pass++; else failures.push(label + ' -> ' + m);
                console.log((ok ? 'PASS' : 'FAIL'), label, '| intent:', c.intent, '| cat:', JSON.stringify(c.category), '| MATCHED:', m);
              }
              const SILENT = (m) => m === 'NONE';
              const ANSWER = (m) => m !== 'NONE';
              const IS = (s) => (m) => m.toLowerCase().includes(s);

              console.log('=== A. YANGI: SIZIB CHIQQAN SOZLAR -> JIM (barqarorlik, 5 martadan) ===');
              const stabilityCases = [
                ['MATIZ', 'Matiz 35talik propan bilan qancha yuradi'],
                ['PEREKRUTEL', 'Assalomu aleykum mashina ochib qolgan kimda perekrutel bor'],
                ['ARENDA_CAR', 'арендага механика мошин керак'],
              ];
              for (const [label, q] of stabilityCases) {
                let ok = true;
                for (let i = 0; i < 5; i++) {
                  const c = await classifyQuery(q, cityId, BigInt(Math.floor(Math.random()*1000000)+9900000));
                  const seek = c.intent !== 'NOT_RELEVANT';
                  const sr = await core.searchListings({
                    cityId, categoryName: seek ? c.category : null, landmarkName: seek ? c.landmark : null,
                    rawMessage: q, intent: c.intent, name: seek ? c.name : null,
                  });
                  const m = sr ? sr.listing.name.trim() : 'NONE';
                  if (m !== 'NONE') { ok = false; console.log('  ' + label + ' run', i, 'FAILED with', m); }
                }
                if (ok) pass++; else failures.push(label + '_STABILITY');
                console.log((ok ? 'PASS' : 'FAIL'), label + '_STABILITY (5x)');
              }

              console.log('=== A2. DESKA barqarorligi (5 marta, kategoriya-ichi ustuvorlik) ===');
              let deskaOk = true;
              for (let i = 0; i < 5; i++) {
                const c = await classifyQuery('deska zaprafka ishlayabdimi', cityId, BigInt(Math.floor(Math.random()*1000000)+9950000));
                const seek = c.intent !== 'NOT_RELEVANT';
                const sr = await core.searchListings({
                  cityId, categoryName: seek ? c.category : null, landmarkName: seek ? c.landmark : null,
                  rawMessage: 'deska zaprafka ishlayabdimi', intent: c.intent, name: seek ? c.name : null,
                });
                const m = sr ? sr.listing.name.trim() : 'NONE';
                console.log('  DESKA run', i, '| MATCHED:', m);
                if (!m.toLowerCase().includes('deska')) deskaOk = false;
              }
              if (deskaOk) pass++; else failures.push('DESKA_STABILITY');
              console.log((deskaOk ? 'PASS' : 'FAIL'), 'DESKA_STABILITY (5x)');

              console.log('=== B. HAQIQIY SOROVLAR HALI HAM ISHLASHI SHART ===');
              await run('SARIQ_BOLA_DIRECT', 'sariq bola pizza nomeri bormi', 9500001, IS('sariq bola'));
              await run('QULF_REAL', 'mashinamni qulfi buzilgan, kimda qulf ustasi bor', 9500002, IS('jamshid'));
              await run('AVTOMEXANIK_REAL', 'mashinam ishlamayapti avtomexanik kerak', 9500003, ANSWER);
              await run('MOYXONA_REAL', 'moshina moyi almashtirish kerak', 9500004, IS('dilshod'));
              await run('GAZAVIK_REAL', 'gazavik kerak, uyda gaz hidi yoq lekin plita ishlamayapti', 9500005, ANSWER);
              await run('SANTEXNIK_USTA', 'santexnik usta kerak edi shoshilinch', 9500006, IS('akrom'));
              await run('GAZ_PLITA', 'Уйдаги газ плитани ремонт киладиган усталар номери кимда бор ёзиб юборинглар илтимос', 9500007, IS('sardor'));
              await run('ARENDA_REAL_1', 'ijaraga kvartira kerak edi oylik tolab turaman', 9500008, ANSWER);
              await run('ARENDA_LESA', 'lesa arenda kerak', 9500010, IS('lesa'));
              await run('KVARTIRA', 'ijaraga 1 xonali kvartira kerak edi', 9500011, ANSWER);
              await run('BESHBIR_1', 'beshbirdagi zaprafka ochiqmi', 9500012, IS('carvon'));
              await run('BESHBIR_3', 'beshbir zaprafka nechigacha ishlaydi', 9500013, IS('carvon'));
              await run('GONDRA', 'gondra zaprafka ochiqmi', 9500014, IS('gondra'));
              await run('DESKA', 'deska zaprafka ishlayabdimi', 9500015, IS('deska'));
              await run('AVTOELEKTIRIK', 'avtoelektirik kerak', 9500016, ANSWER);
              await run('BALON', 'balon kerak', 9500017, ANSWER);
              await run('LABO', 'labo kerak edi yuk tashish uchun', 9500018, ANSWER);
              await run('TOY_TEPA', 'toy tepada balon kerak', 9500019, ANSWER);
              await run('YAQIN_ATROF', 'yaqin atrofda zapravka bormi', 9500020, ANSWER);
              await run('EV_1', 'Elektra mabil zaprafka qata bor', 9500021, ANSWER);
              await run('REAL_KAFEL', 'kafel teradigan usta kerak', 9500023, IS('ismoil'));
              await run('REAL_SANTEX', 'santexnik kerak', 9500024, ANSWER);
              await run('MAHALA_REAL', 'deska mahala kamiteti nomeri kerak', 9500025, IS('jahongir'));

              console.log('=== C. BIZDA YOQ NOM -> JIM ===');
              await run('MIB', 'Olmaliq mib nechigacha ishlaydi', 9500030, SILENT);
              await run('LADA_SERVICE', 'sariq bola pizza oldida LADA magazin bor, u yerda shina bormi', 9500034, SILENT);
              await run('FORTUNA_1', 'akalar fartunani nomeri bormi', 9500035, SILENT);

              console.log('=== D. ELON/ISH/KOMMUNAL -> JIM ===');
              await run('JOB_ORIGINAL', \"Shlakablok terishga podsobnik yordamchi kerak qanaqa ish bo'lsa yordam qilishi kerak 779758180\", 9500040, SILENT);
              await run('AD_MAKLER', \"Kimga maklersiz Olmaliqda uy kerak bo'lsa profilga o'ting\", 9500042, SILENT);
              await run('GAS_NEWS', 'Акалар газ качон беришидан хабарилар борми?', 9500044, SILENT);

              console.log('---');
              console.log('RESULT: PASS=' + pass + ' FAIL=' + failures.length);
              for (const f of failures) console.log('FAILED:', f);
              await db.\$disconnect();
              process.exit(failures.length > 0 ? 1 : 0);
            })().catch(e => { console.error('DEBUG_ERROR:', e); process.exit(1); });
            "
