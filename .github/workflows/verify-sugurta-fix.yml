name: One-off - Verify sugurta fix plus full regression

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Run via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            docker exec kimbor_api node -e "
              const { searchListings } = require('/app/packages/core/dist/index.js');
              const CITY = '23fdb721-7073-4fd3-bda5-b61bde593490';
              (async () => {
                console.log('=== A sugurta fix cases ===');
                const cases = [
                  { cat: \"sug'urta\", msg: \"Assalomu alaykum akalar sug'urta qancha bo'lyapti kim biladi aytvorilar oldindan rahmat\" },
                  { cat: null, msg: \"Assalomu alaykum akalar sug'urta qancha bo'lyapti kim biladi aytvorilar oldindan rahmat\" },
                  { cat: \"sug'urta\", msg: \"Sug'urta kerak\" },
                  { cat: \"sug'urta\", msg: \"Assalomu aleykum sug'urta to'lovi qancha bolayabti bilganlar aytvorilar iltimos\" },
                  { cat: \"sugurta\", msg: \"Sug'urta qilishga ochiq joy bormi\" },
                ];
                for (const c of cases) {
                  const r = await searchListings({ cityId: CITY, categoryName: c.cat, rawMessage: c.msg, intent: 'SERVICE' });
                  console.log(JSON.stringify({ cat: c.cat, msg: c.msg, found: !!r, listing: r && r.listing ? r.listing.name : null }));
                }

                console.log('');
                console.log('=== B regression: karzinka taksi (transport+landmark) ===');
                const r1 = await searchListings({ cityId: CITY, categoryName: 'taksi', landmarkName: 'karzinka', rawMessage: 'taksi kerak edi karzinka tomonda', intent: 'SERVICE' });
                console.log('taksi+karzinka:', !!r1, r1 && r1.listing ? r1.listing.name : null);

                console.log('');
                console.log('=== C regression: oldida (genuine landmark postposition still works) ===');
                const r2 = await searchListings({ cityId: CITY, rawMessage: 'karzinka oldida taksi kerak', intent: 'SERVICE' });
                console.log('karzinka oldida:', !!r2, r2 && r2.listing ? r2.listing.name : null);

                console.log('');
                console.log('=== D regression: balon / other categories still resolve ===');
                const r3 = await searchListings({ cityId: CITY, categoryName: 'kafelchi', rawMessage: 'kafelchi kerak', intent: 'SERVICE' });
                console.log('kafelchi:', !!r3, r3 && r3.listing ? r3.listing.name : null);
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "
