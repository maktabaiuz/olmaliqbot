name: One-off - clean junk categories then run full precision suite

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup + verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const core = require('/app/packages/core/dist/index.js');
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const { classifyQuery } = require('/app/apps/bot/dist/filter/aiClassifier.js');
            const db = new PrismaClient();
            (async () => {
              const g = await db.listing.findFirst({ where: { name: { contains: 'Gondra', mode: 'insensitive' } } });
              const cityId = g.cityId;

              let pass = 0; const failures = [];
              async function run(label, q, userId, expectFn) {
                const c = await classifyQuery(q, cityId, BigInt(userId));
                // groupHandler bilan BIR XIL tartib: e'lon/ish e'loni bo'lsa
                // bot umuman qidirmaydi.
                if (c.intent !== 'EMERGENCY' && (core.isSelfOffer(q) || core.isJobVacancy(q))) {
                  const ok0 = expectFn('NONE');
                  if (ok0) pass++; else failures.push(label + ' -> NONE (elon deb toxtatildi)');
                  console.log((ok0 ? 'PASS' : 'FAIL'), label, '| E\'LON deb to\'xtatildi | MATCHED: NONE');
                  return;
                }
                const seek = c.intent !== 'NOT_RELEVANT';
                const sr = await core.searchListings({
                  cityId,
                  categoryName: seek ? c.category : null,
                  landmarkName: seek ? c.landmark : null,
                  rawMessage: q,
                  intent: c.intent,
                  name: seek ? c.name : null,
                });
                const m = sr ? sr.listing.name.trim() : 'NONE';
                const ok = expectFn(m);
                if (ok) pass++; else failures.push(label + ' -> ' + m);
                console.log((ok ? 'PASS' : 'FAIL'), label, '| intent:', c.intent, '| cat:', JSON.stringify(c.category), '| name:', JSON.stringify(c.name), '| MATCHED:', m);
              }
              const SILENT = (m) => m === 'NONE';
              const ANSWER = (m) => m !== 'NONE';
              const IS = (s) => (m) => m.toLowerCase().includes(s);

              console.log('=== 1. ISH ELONLARI -> JIM ===');
              await run('JOB_ORIGINAL', \"Shlakablok terishga podsobnik yordamchi kerak qanaqa ish bo'lsa yordam qilishi kerak 779758180\", 9900001, SILENT);
              await run('JOB_NOPHONE', \"Shlakablok terishga podsobnik yordamchi kerak qanaqa ish bo'lsa yordam qilishi kerak\", 9900002, SILENT);
              await run('JOB_ISHCHI', 'qurilishga ishchi kerak kunlik ish 900 ming 901234567', 9900003, SILENT);
              await run('JOB_YORDAMCHI', 'yordamchi kerak ishga oylik yaxshi', 9900004, SILENT);
              await run('JOB_SOTUVCHI', 'dokonga sotuvchi qiz kerak smena 12 soat', 9900005, SILENT);

              console.log('=== 1b. REKLAMA ELONLARI -> JIM ===');
              await run('AD_MAKLER', \"Kimga maklersiz Olmaliqda uy kerak bo'lsa profilga o'ting\", 9910001, SILENT);
              await run('AD_PROFIL', \"uy kerak bo'lsa profilimga o'ting arzon\", 9910002, SILENT);
              await run('CITY_NAME_ONLY', \"Olmaliqda yaxshi joy bormi\", 9910003, SILENT);

              console.log('=== 2. KASB SO_ROVLARI -> JAVOB SHART ===');
              await run('REAL_KAFEL', 'kafel teradigan usta kerak', 9900010, IS('ismoil'));
              await run('REAL_KAFELCHI', 'kafelchi kerak', 9900011, IS('ismoil'));
              await run('REAL_SANTEX', 'santexnik kerak', 9900012, ANSWER);

              console.log('=== 3. ARENDA ===');
              await run('ARENDA_CAR_CYR', 'арендага механика мошин керак', 9900020, SILENT);
              await run('ARENDA_CAR_LAT', 'arendaga mexanika moshin kerak', 9900021, SILENT);
              await run('ARENDA_LESA', 'lesa arenda kerak', 9900022, IS('lesa'));

              console.log('=== 4. BIZDA YO_Q NOM -> JIM ===');
              await run('MIB', 'Olmaliq mib nechigacha ishlaydi', 9900030, SILENT);
              await run('HOKIMIYAT', 'hokimiyat nechigacha ishlaydi', 9900031, SILENT);
              await run('MRU', 'bugun mru ishlaydimi nomer olishga', 9900032, SILENT);
              await run('LADA_CONTACT', 'assalomualekum akalar 5/3 sariq bola pizza oldgai LADA magazin nomerini tashab berilar iltmos', 9900033, SILENT);
              await run('LADA_SERVICE', 'sariq bola pizza oldida LADA magazin bor, u yerda shina bormi', 9900034, SILENT);
              await run('LADA_PRICE', 'sariq bola pizza oldidagi LADA magazinda narxlar qancha', 9900035, SILENT);
              await run('FORTUNA_1', 'akalar fartunani nomeri bormi', 9900036, SILENT);
              await run('FORTUNA_2', 'fartuna kafeni raqami bormi', 9900037, SILENT);
              await run('FORTUNA_5', 'fartuna nemeri kerak edi', 9900038, SILENT);

              console.log('=== 5. HAQIQIY SO_ROVLAR -> JAVOB SHART ===');
              await run('BESHBIR_1', 'beshbirdagi zaprafka ochiqmi', 9900040, IS('carvon'));
              await run('BESHBIR_2', 'beshbirdagi zaprafka ishlayaptimi hozir', 9900041, IS('carvon'));
              await run('BESHBIR_3', 'beshbir zaprafka nechigacha ishlaydi', 9900042, IS('carvon'));
              await run('GONDRA', 'gondra zaprafka ochiqmi', 9900043, IS('gondra'));
              await run('DESKA', 'deska zaprafka ishlayabdimi', 9900044, IS('deska'));
              await run('SARIQ_BOLA', 'sariq bola pizza nomeri bormi', 9900045, IS('sariq bola'));
              await run('AVTOELEKTIRIK', 'avtoelektirik kerak', 9900046, ANSWER);
              await run('BALON', 'balon kerak', 9900047, ANSWER);
              await run('LABO', 'labo kerak edi yuk tashish uchun', 9900048, ANSWER);
              await run('YAQIN_ATROF', 'yaqin atrofda zapravka bormi', 9900049, ANSWER);
              await run('TOY_TEPA', 'toy tepada balon kerak', 9900050, ANSWER);
              await run('KVARTIRA', 'ijaraga 1 xonali kvartira kerak edi', 9900051, ANSWER);

              console.log('---');
              console.log('RESULT: PASS=' + pass + ' FAIL=' + failures.length);
              for (const f of failures) console.log('FAILED:', f);
              await db.\$disconnect();
              process.exit(failures.length > 0 ? 1 : 0);
            })().catch(e => { console.error('DEBUG_ERROR:', e); process.exit(1); });
            "
