name: Test AI synonym suggestion (one-off)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Run AI synonym suggestion test via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 3m
          script: |
            echo "=== AI synonym suggestion test (real prod DB + real Gemini call) ==="
            docker exec -w /app/apps/api kimbor_api node -e "
              const { db } = require('@kimbor/db');
              (async () => {
                const landmark = await db.landmark.findFirst({ where: { name: { not: '' } }, orderBy: { name: 'asc' } });
                if (!landmark) throw new Error('No landmark found');
                console.log('out: using landmark: ' + landmark.name + ' (existing synonyms: ' + landmark.synonyms.join(', ') + ')');

                const geminiKey = process.env.GEMINI_API_KEY;
                if (!geminiKey) throw new Error('No GEMINI_API_KEY in container env');

                const start = Date.now();
                const prompt = 'Sen O\'zbekistondagi bir shahar (Olmaliq)dagi mahalliy joy nomlarini yaxshi bilasan. \"' + landmark.name + '\" degan manzil/mo\'ljal uchun odamlar KUNDALIK SO\'ZLASHUVDA, JARGON tilida qanday nomlar bilan chaqirishi mumkinligini o\'yla. Faqat 3-5 ta variantni kichik harflarda taklif qil. Faqat JSON massiv qaytar, boshqa hech qanday matn yozma.';
                const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent', {
                  method: 'POST',
                  headers: { 'x-goog-api-key': geminiKey, 'content-type': 'application/json' },
                  body: JSON.stringify({
                    contents: [{ role: 'user', parts: [{ text: prompt }] }],
                    generationConfig: { responseMimeType: 'application/json', responseSchema: { type: 'ARRAY', items: { type: 'STRING' } }, maxOutputTokens: 200 },
                  }),
                });
                console.log('out: HTTP status=' + res.status + ', ms=' + (Date.now()-start));
                if (!res.ok) {
                  const t = await res.text();
                  throw new Error('Gemini HTTP ' + res.status + ': ' + t.slice(0,300));
                }
                const json = await res.json();
                const rawText = json.candidates?.[0]?.content?.parts?.[0]?.text;
                console.log('out: raw AI text=' + rawText);
                const parsed = JSON.parse(rawText);
                console.log('out: parsed suggestions=' + JSON.stringify(parsed));
              })().catch(e => { console.error('err:', e.message); process.exit(1); }).then(() => process.exit(0));
            "
