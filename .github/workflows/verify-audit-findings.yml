name: One-off - Verify audit findings against live production

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            echo "=== 1) Is GEMINI_API_KEY actually set (not placeholder)? ==="
            docker exec kimbor_api node -e "
              const k = process.env.GEMINI_API_KEY || '';
              console.log('GEMINI_API_KEY set:', k.length > 0, '| looks like placeholder:', /placeholder|your_key|xxx/i.test(k));
            "

            echo ""
            echo "=== 2) Are there any real admin users with role != SUPER_ADMIN? ==="
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();
              (async () => {
                const roles = await db.user.groupBy({ by: ['role'], _count: true });
                console.log('Role distribution:', JSON.stringify(roles));
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "

            echo ""
            echo "=== 3) Is the broadcast queue worker actually running? ==="
            docker exec kimbor_bot sh -c "ps aux | grep -i node | head -5" || true
            docker logs kimbor_bot --since 2h 2>&1 | grep -i "broadcast" | tail -10 || echo "no broadcast log lines in last 2h"

            echo ""
            echo "=== 4) Category schema - confirm passThroughWords truly does not exist ==="
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();
              (async () => {
                const cat = await db.category.findFirst();
                console.log('Sample category keys:', Object.keys(cat));
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "
