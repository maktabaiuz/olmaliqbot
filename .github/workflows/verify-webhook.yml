name: One-off - verify webhook alive after deploy
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 90s
          command_timeout: 5m
          script: |
            docker exec kimbor_bot node -e "
              (async () => {
                const r = await fetch('https://api.telegram.org/bot' + process.env.BOT_TOKEN + '/getWebhookInfo');
                console.log('WEBHOOK:', JSON.stringify(await r.json()));
              })();
            "
            docker logs --tail 20 kimbor_bot 2>&1
