name: One-off - final zapravka verification

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const { classifyQuery } = require('/app/apps/bot/dist/filter/aiClassifier.js');
            const core = require('/app/packages/core/dist/index.js');
            const db = new PrismaClient();
            (async () => {
              const cityId = '23fdb721-7073-4fd3-bda5-b61bde593490';
              const categoryId = 'd4364137-3bd1-462c-900c-92c4b753f6ce';

              const testListing = await db.listing.create({
                data: {
                  city: { connect: { id: cityId } },
                  category: { connect: { id: categoryId } },
                  type: 'ZAPRAVKA',
                  name: 'TEST-vaqtinchalik-zapravka',
                  phone: '+998901234567',
                  status: 'ACTIVE',
                  workFrom: '08:00',
                  workTo: '22:00',
                  mapUrl: 'https://yandex.uz/maps/-/test',
                  consentGiven: true,
                  badges: [],
                },
              });
              console.log('TEST_LISTING_CREATED:', testListing.id);

              const queries = ['guruhda zapravka bor eken kimda', 'benzin kerak edi', 'yaqin atrofda avtomobil zapravkasi bormi', 'metan quyadigan joy kerak'];
              for (const q of queries) {
                const classification = await classifyQuery(q, cityId, BigInt(999999));
                const isSeeking = classification.intent !== 'NOT_RELEVANT';
                const searchResult = await core.searchListings({
                  cityId,
                  categoryName: isSeeking ? classification.category : null,
                  landmarkName: isSeeking ? classification.landmark : null,
                  rawMessage: q,
                });
                console.log('QUERY:', JSON.stringify(q));
                console.log('CLASSIFICATION:', JSON.stringify(classification));
                console.log('FOUND:', !!searchResult);
                if (searchResult) console.log('TEXT_SNIPPET:', (searchResult.text || '').slice(0, 300));
                console.log('---');
              }

              await db.listing.delete({ where: { id: testListing.id } });
              const check = await db.listing.findUnique({ where: { id: testListing.id } });
              console.log('TEST_LISTING_DELETED_CONFIRMED:', check === null);

              await db.\$disconnect();
            })().catch(async (e) => {
              console.error('VERIFY_ERROR:', e);
              process.exit(1);
            });
            "
