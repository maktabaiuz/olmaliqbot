name: One-off - check listing existence

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const db = new PrismaClient();
            (async () => {
              const allZap = await db.listing.findMany({ where: { type: 'ZAPRAVKA' } });
              console.log('ALL_ZAPRAVKA_LISTINGS_COUNT:', allZap.length);
              console.log('ALL_ZAPRAVKA_LISTINGS:', JSON.stringify(allZap.map(l => ({ id: l.id, name: l.name, status: l.status, categoryId: l.categoryId }))));

              const anyGondra = await db.listing.findMany({ where: { name: { contains: 'Gon' } } });
              console.log('ANY_GONDRA_LIKE:', JSON.stringify(anyGondra.map(l => ({id: l.id, name: l.name, status: l.status, type: l.type}))));

              const recentAudit = await db.auditLog.findMany({ where: { action: { in: ['DELETE_LISTING', 'CREATE_LISTING'] } }, orderBy: { createdAt: 'desc' }, take: 10 });
              console.log('RECENT_AUDIT:', JSON.stringify(recentAudit.map(a => ({ action: a.action, details: a.details, createdAt: a.createdAt }))));

              await db.\$disconnect();
            })().catch(e => { console.error('CHECK_ERROR:', e); process.exit(1); });
            "
