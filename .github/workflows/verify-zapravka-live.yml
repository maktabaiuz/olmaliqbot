name: One-off - diagnose zapravka search failure

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const db = new PrismaClient();
            (async () => {
              const city = await db.city.findFirst({ where: { name: { contains: 'Olmaliq', mode: 'insensitive' } } });

              const gondra = await db.listing.findMany({ where: { name: { contains: 'Gondra', mode: 'insensitive' } } });
              console.log('GONDRA_STATE:', JSON.stringify(gondra.map(l => ({ id: l.id, type: l.type, status: l.status, categoryId: l.categoryId, cityId: l.cityId }))));

              const catNames = ['zapravka', 'benzin', 'metan zapravka'];
              for (const cleanCat of catNames) {
                const exact = await db.category.findMany({ where: { OR: [ { name: { contains: cleanCat, mode: 'insensitive' } }, { synonyms: { has: cleanCat } } ] } });
                console.log('CATEGORYNAME:', JSON.stringify(cleanCat), 'EXACT_MATCH_COUNT:', exact.length, 'NAMES:', JSON.stringify(exact.map(c => c.name)));
              }

              // Zapravka kategoriyasi haqiqatan ham to'g'ri sinonimlarga egami?
              const zapCat = await db.category.findFirst({ where: { name: 'Avtomobil zapravkasi' } });
              console.log('ZAP_CATEGORY:', JSON.stringify(zapCat));

              await db.\$disconnect();
            })().catch(e => { console.error('DIAG_ERROR:', e); process.exit(1); });
            "
