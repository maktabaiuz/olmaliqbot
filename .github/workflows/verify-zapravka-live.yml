name: One-off - verify zapravka search live 3

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e
            echo "--- apps/bot dist layout ---"
            docker exec kimbor_bot sh -c "find /app/apps/bot/dist -maxdepth 2 -type d 2>/dev/null; echo ---; find /app/apps/bot/dist -maxdepth 2 -iname '*classif*' 2>/dev/null"
