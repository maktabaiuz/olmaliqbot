name: One-off - restore Telegram webhook
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Restore webhook via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 90s
          command_timeout: 5m
          script: |
            echo "=== before ==="
            docker exec kimbor_bot node -e "
              (async () => {
                const r = await fetch('https://api.telegram.org/bot' + process.env.BOT_TOKEN + '/getWebhookInfo');
                console.log('BEFORE:', JSON.stringify(await r.json()));
              })();
            "
            echo "=== re-registering (dropping stale backlog) ==="
            docker exec kimbor_bot node -e "
              (async () => {
                const token = process.env.BOT_TOKEN;
                const url = 'https://' + (process.env.DOMAIN || 'olmaliq.online') + '/webhook';
                const r = await fetch('https://api.telegram.org/bot' + token + '/setWebhook', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    url,
                    allowed_updates: ['message', 'edited_message', 'channel_post', 'edited_channel_post', 'callback_query', 'my_chat_member'],
                    drop_pending_updates: true,
                  }),
                });
                console.log('SET_RESULT:', JSON.stringify(await r.json()));
              })();
            "
            echo "=== after ==="
            docker exec kimbor_bot node -e "
              (async () => {
                const r = await fetch('https://api.telegram.org/bot' + process.env.BOT_TOKEN + '/getWebhookInfo');
                console.log('AFTER:', JSON.stringify(await r.json()));
              })();
            "
