name: One-off - diagnose arenda (car vs tool rental) bug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const core = require('/app/packages/core/dist/index.js');
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const { classifyQuery } = require('/app/apps/bot/dist/filter/aiClassifier.js');
            const db = new PrismaClient();
            (async () => {
              const g = await db.listing.findFirst({ where: { name: { contains: 'Gondra', mode: 'insensitive' } } });
              const cityId = g.cityId;
              const N = core.normalizeText;

              // 1. 'Arenda Lesa' yozuvi
              const lesa = await db.listing.findFirst({
                where: { cityId, name: { contains: 'Lesa', mode: 'insensitive' } },
                include: { category: true },
              });
              console.log('LESA:', JSON.stringify({
                name: lesa && lesa.name, cat: lesa && lesa.category && lesa.category.name,
                jargon: lesa && lesa.jargonSynonyms,
              }));

              // 2. 'arenda' bilan bogliq BARCHA kategoriyalar
              const cats = await db.category.findMany({ select: { name: true, synonyms: true } });
              const arendaCats = cats.filter(c => (c.name + ' ' + c.synonyms.join(' ')).toLowerCase().includes('arenda'));
              console.log('ARENDA_CATS:', JSON.stringify(arendaCats));

              // 3. Mashina/avtomobil arendasi kategoriyasida yozuv bormi?
              const carCats = cats.filter(c => /mashina|avtomobil|moshin|transport/i.test(c.name + ' ' + c.synonyms.join(' ')));
              console.log('CAR_CATS:', JSON.stringify(carCats.map(c => c.name)));
              for (const cc of carCats) {
                const full = await db.category.findFirst({ where: { name: cc.name } });
                const cnt = await db.listing.count({ where: { cityId, status: 'ACTIVE', categoryId: full.id } });
                console.log('  CAT_COUNT:', cc.name, '=', cnt);
              }

              // 4. XABAR SO'ZLARI vs LESA JARGONI - qaysi so'z orqali mos keldi?
              const msg = 'арендага механика мошин керак';
              console.log('NORMALIZED_MSG:', JSON.stringify(N(msg)));
              const msgWords = N(msg).split(/\\s+/).filter(w => w.length >= 5);
              console.log('MSG_WORDS(>=5):', JSON.stringify(msgWords));
              if (lesa) {
                for (const j of lesa.jargonSynonyms) {
                  const jw = N(j).split(/\\s+/).filter(w => w.length >= 5);
                  const hits = [];
                  for (const m of msgWords) for (const t of jw) {
                    const sh = m.length <= t.length ? m : t, lo = m.length <= t.length ? t : m;
                    if (m === t) hits.push(m + '==' + t);
                    else if (sh.length >= 5 && lo.startsWith(sh)) hits.push(m + ' ~prefiks~ ' + t);
                  }
                  if (hits.length) console.log('  JARGON_HIT:', JSON.stringify(j), '->', JSON.stringify(hits));
                }
              }

              async function run(label, q, userId) {
                const c = await classifyQuery(q, cityId, BigInt(userId));
                const seek = c.intent !== 'NOT_RELEVANT';
                const sr = await core.searchListings({
                  cityId,
                  categoryName: seek ? c.category : null,
                  landmarkName: seek ? c.landmark : null,
                  rawMessage: q,
                  intent: c.intent,
                  name: seek ? c.name : null,
                });
                console.log(label, '| intent:', c.intent, '| cat:', JSON.stringify(c.category), '| name:', JSON.stringify(c.name), '| MATCHED:', sr ? sr.listing.name.trim() : 'NONE');
              }

              console.log('=== SO_ROVLAR ===');
              await run('ORIG_CYRILLIC', 'арендага механика мошин керак', 9600001);
              await run('LATIN_SAME', 'arendaga mexanika moshin kerak', 9600002);
              await run('MASHINA_ARENDA', 'mashina arendaga kerak edi 2 kunga', 9600003);
              await run('LESA_REAL', 'lesa arenda kerak', 9600004);
              await run('BOLGARKA', 'bolgarka arendaga kerak', 9600005);

              await db.\$disconnect();
              process.exit(0);
            })().catch(e => { console.error('DEBUG_ERROR:', e); process.exit(1); });
            "
