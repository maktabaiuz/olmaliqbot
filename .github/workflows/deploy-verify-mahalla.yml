name: One-off - Deploy mahalla boundary system, seed initial boundaries, verify
on:
  workflow_dispatch:
jobs:
  deploy_seed_verify:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy, seed, verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 90s
          command_timeout: 15m
          script: |
            cd /root/kimbor
            git pull origin main || git pull origin master
            git log -1 --oneline
            docker compose -f docker-compose.prod.yml up -d --build
            sleep 30
            docker exec kimbor_api pnpm --filter @kimbor/db exec prisma db push --schema=./prisma/schema.prisma --accept-data-loss
            echo "--- seed initial approximate mahalla boundaries ---"
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();

              function generateCirclePolygon(centerLat, centerLng, radiusMeters, sides) {
                const points = [];
                const latOffset = radiusMeters / 111200;
                const lngOffset = radiusMeters / (111200 * Math.cos(centerLat * Math.PI / 180));
                for (let i = 0; i < sides; i++) {
                  const angle = (i / sides) * 2 * Math.PI;
                  points.push([
                    Math.round((centerLat + latOffset * Math.sin(angle)) * 1e6) / 1e6,
                    Math.round((centerLng + lngOffset * Math.cos(angle)) * 1e6) / 1e6,
                  ]);
                }
                return points;
              }

              const REAL_MAHALLAS = [
                { name: \"Bo'ston mahallasi\", lat: 40.883767, lng: 69.575043, radius: 500, aliases: ['bo\'ston', 'boston', 'bo\'ston mfy'] },
                { name: \"Do'stlik mahallasi\", lat: 40.834485, lng: 69.579914, radius: 450, aliases: ['do\'stlik', 'dostlik'] },
                { name: \"O'zbekiston mahallasi\", lat: 40.841385, lng: 69.585991, radius: 450, aliases: ['o\'zbekiston mahallasi', 'ozbekiston mahallasi'] },
                { name: 'Namuna mahallasi', lat: 40.849049, lng: 69.570349, radius: 450, aliases: ['namuna'] },
                { name: 'Yulduz mahallasi', lat: 40.834552, lng: 69.612832, radius: 450, aliases: ['yulduz'] },
                { name: 'DSK', lat: 40.890714, lng: 69.574947, radius: 500, aliases: ['dsk', '7/1 mikrorayon', '7/1 kichik nohiya'] },
              ];

              (async () => {
                const city = await db.city.findFirst();
                const cityId = city.id;
                const allLandmarks = await db.landmark.findMany({ where: { cityId } });

                for (const m of REAL_MAHALLAS) {
                  const boundary = generateCirclePolygon(m.lat, m.lng, m.radius, 14);
                  const normalizedAliases = m.aliases.map(a => a.toLowerCase());

                  let existing = allLandmarks.find(l =>
                    normalizedAliases.includes(l.name.toLowerCase()) ||
                    l.synonyms.some(s => normalizedAliases.includes(s.toLowerCase()))
                  );

                  if (existing) {
                    const mergedSynonyms = Array.from(new Set([...existing.synonyms, ...normalizedAliases]));
                    await db.landmark.update({ where: { id: existing.id }, data: { boundary, synonyms: mergedSynonyms } });
                    console.log('UPDATED (boundary added):', existing.name, '- matched real mahalla:', m.name);
                  } else {
                    const created = await db.landmark.create({
                      data: { cityId, name: m.name, synonyms: normalizedAliases, latitude: m.lat, longitude: m.lng, boundary },
                    });
                    console.log('CREATED:', created.name);
                  }
                }

                console.log('');
                console.log('--- final: landmarks with boundary ---');
                const withBoundary = await db.landmark.findMany({ where: { cityId, boundary: { not: null } }, select: { name: true } });
                console.log('COUNT:', withBoundary.length, JSON.stringify(withBoundary.map(l => l.name)));
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "
