name: One-off - cleanup check for TEST- listings

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 2m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const db = new PrismaClient();
            (async () => {
              const leftover = await db.listing.findMany({ where: { name: { startsWith: 'TEST-' } } });
              console.log('LEFTOVER_TEST_LISTINGS:', JSON.stringify(leftover.map(l => ({ id: l.id, name: l.name }))));
              for (const l of leftover) {
                await db.listing.delete({ where: { id: l.id } });
                console.log('CLEANED_UP:', l.id, l.name);
              }
              await db.\$disconnect();
              process.exit(0);
            })().catch(e => { console.error('ERROR:', e); process.exit(1); });
            "
