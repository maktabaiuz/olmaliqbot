name: One-off - Check Mubina2026 web-login status

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const crypto = require('crypto');
              const db = new PrismaClient();
              function hashPassword(password) {
                const salt = process.env.PASSWORD_SALT || 'kimbor_hyperlocal_secure_salt_2026';
                return crypto.pbkdf2Sync(password, salt, 10000, 64, 'sha512').toString('hex');
              }
              (async () => {
                const clean = 'mubina2026';
                const user = await db.user.findUnique({ where: { loginUsername: clean } });
                if (!user) {
                  console.log('RESULT: no user has this loginUsername set at all');
                } else {
                  console.log('RESULT: user found', JSON.stringify({
                    role: user.role,
                    isSuspended: user.isSuspended,
                    hasPasswordHash: !!user.passwordHash,
                    passwordMatchesGivenValue: user.passwordHash ? (hashPassword('Mubina2026') === user.passwordHash) : null,
                  }));
                }
              })().catch(e=>{console.error(e); process.exit(1)}).finally(()=>db.\$disconnect());
            "
