name: One-off - Deploy city-name false-positive fix and verify
on:
  workflow_dispatch:
jobs:
  deploy_and_verify:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy and verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 90s
          command_timeout: 15m
          script: |
            cd /app
            git pull
            docker compose up -d --build
            sleep 20
            docker exec kimbor_api node -e "
              const { findLocalDispatcherMatch } = require('/app/packages/core/dist/index.js');
              const CITY = '23fdb721-7073-4fd3-bda5-b61bde593490';
              (async () => {
                console.log('=== A) REGRESSION FIX: taxi request mentioning Olmaliqqa must NOT match electric dispatcher ===');
                const a1 = await findLocalDispatcherMatch(\"Assalom aleykum taxi kerak Toshkent navoi ko'chadan Olmaliqqa 1 kishi bor soat 18:00 da 50 ming beradi. +998950917877\", CITY);
                console.log('taxi to Olmaliq (expect null):', JSON.stringify(a1));

                console.log('');
                console.log('=== B) Previously-fixed cases must STILL work ===');
                const b1 = await findLocalDispatcherMatch('Горсетни номери борми', CITY);
                console.log('Gorset cyrillic (expect match):', JSON.stringify(b1));
                const b2 = await findLocalDispatcherMatch('gorset raqamini bering', CITY);
                console.log('gorset variation (expect match):', JSON.stringify(b2));
                const b3 = await findLocalDispatcherMatch('svet ochilib qoldi kimga qongiroq qilaman', CITY);
                console.log('svet stem (expect match):', JSON.stringify(b3));
                const b4 = await findLocalDispatcherMatch('elektrenergiya raqami kimda bor', CITY);
                console.log('elektrenergiya phrase exact (expect match):', JSON.stringify(b4));

                console.log('');
                console.log('=== C) Other generic address/city mentions must NOT false-positive ===');
                const c1 = await findLocalDispatcherMatch('Olmaliqda kvartira sotiladi 3 xonali', CITY);
                console.log('Olmaliqda kvartira (expect null):', JSON.stringify(c1));
                const c2 = await findLocalDispatcherMatch('Olmaliq shahrida ish kerak', CITY);
                console.log('Olmaliq shahrida ish (expect null):', JSON.stringify(c2));
                const c3 = await findLocalDispatcherMatch('santexnik kerak suv tomayabdi', CITY);
                console.log('santexnik (expect null):', JSON.stringify(c3));
                const c4 = await findLocalDispatcherMatch('taksi kerak zudlik bilan', CITY);
                console.log('taksi kerak (expect null):', JSON.stringify(c4));
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "
