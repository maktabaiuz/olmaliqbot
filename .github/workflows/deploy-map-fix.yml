name: One-off - Deploy Leaflet sizing fix
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 90s
          command_timeout: 15m
          script: |
            cd /root/kimbor
            git pull origin main || git pull origin master
            git log -1 --oneline
            docker compose -f docker-compose.prod.yml up -d --build
            sleep 20
            docker ps --format '{{.Names}}: {{.Status}}' | grep kimbor
