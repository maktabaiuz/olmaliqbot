name: One-off - Test core emergency number jargon end-to-end

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Test via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            docker exec kimbor_api node -e "
              const crypto = require('crypto');
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();
              function buildInitData(telegramId) {
                const botToken = process.env.BOT_TOKEN;
                const user = JSON.stringify({ id: telegramId, first_name: 'Test', last_name: 'Admin' });
                const params = { auth_date: Math.floor(Date.now()/1000).toString(), user };
                const paramsArray = Object.entries(params).sort((a,b)=>a[0].localeCompare(b[0]));
                const dataCheckString = paramsArray.map(([k,v])=>k+'='+v).join('\\n');
                const secretKey = crypto.createHmac('sha256','WebAppData').update(botToken).digest();
                const hash = crypto.createHmac('sha256', secretKey).update(dataCheckString).digest('hex');
                const usp = new URLSearchParams(params);
                usp.set('hash', hash);
                return usp.toString();
              }
              (async () => {
                const superAdmin = await db.user.findFirst({ where: { role: 'SUPER_ADMIN' } });
                const initData = buildInitData(superAdmin.telegramId.toString());
                const headers = { 'x-init-data': initData, 'Content-Type': 'application/json' };

                console.log('=== 1) GET core numbers (should be 5 stubs) ===');
                const getRes = await fetch('http://localhost:4000/api/admin/local-numbers/core', { headers });
                const getData = await getRes.json();
                console.log('status:', getRes.status, 'count:', getData.numbers?.length);
                console.log(JSON.stringify(getData.numbers?.map(n => n.key)));

                console.log('');
                console.log('=== 2) SAVE gas_office with a real-ish phone + jargon (as the admin UI would) ===');
                const putRes = await fetch('http://localhost:4000/api/admin/local-numbers/by-key/gas_office', {
                  method: 'PUT', headers,
                  body: JSON.stringify({ phoneNumber: '+998701234567', jargonWords: ['gaz idorasi raqami', 'gaz avariya xizmati'] }),
                });
                const putData = await putRes.json();
                console.log('save status:', putRes.status, JSON.stringify(putData));

                console.log('');
                console.log('=== 3) Confirm GET reflects the LIVE saved value ===');
                const getRes2 = await fetch('http://localhost:4000/api/admin/local-numbers/core', { headers });
                const getData2 = await getRes2.json();
                const gasEntry = getData2.numbers?.find(n => n.key === 'gas_office');
                console.log('gas_office now:', JSON.stringify(gasEntry));

                console.log('');
                console.log('=== 4) Bot-side: informational lookup should now match directly ===');
                const { findLocalDispatcherMatch, renderEmergencyTemplate, getCoreEmergencyNumbers } = require('/app/packages/core/dist/index.js');
                const CITY = '23fdb721-7073-4fd3-bda5-b61bde593490';
                const infoMatch = await findLocalDispatcherMatch('gaz idorasi raqami bormi', CITY);
                console.log('Informational lookup match:', JSON.stringify(infoMatch));

                console.log('');
                console.log('=== 5) Bot-side: GENUINE emergency still gets the FULL dramatic template with the number inserted ===');
                const coreNums = await getCoreEmergencyNumbers(CITY);
                console.log('coreNums for template:', JSON.stringify(coreNums));
                const template = await renderEmergencyTemplate('gas_leak', 'lotin', coreNums);
                console.log('Full gas_leak template includes number:', template && template.includes('+998701234567'));
                console.log('Full template (first 200 chars):', template ? template.slice(0, 200) : 'null');

                console.log('');
                console.log('=== 6) Cleanup: reset gas_office to empty (restore original state) ===');
                const cleanupRes = await fetch('http://localhost:4000/api/admin/local-numbers/by-key/gas_office', {
                  method: 'PUT', headers,
                  body: JSON.stringify({ phoneNumber: '', jargonWords: [] }),
                });
                console.log('cleanup status:', cleanupRes.status);
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "
