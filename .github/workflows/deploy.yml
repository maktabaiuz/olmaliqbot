name: Deploy to production

# Faqat qo'lda ishga tushiriladi (workflow_dispatch) — har push'da avtomatik
# deploy qilinmaydi, chunki har bir o'zgarish avval mahalliy tekshirilib,
# ataylab shu workflow orqali ishga tushiriladi. GitHub'ning o'z runner'lari
# orqali ishlaydi — bu SSH orqali serverga ulanadi, muallif kompyuteridagi/
# muhitidagi tarmoq cheklovlariga bog'liq emas.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          USER_BOT_TOKEN: ${{ secrets.USER_BOT_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 20m
          envs: USER_BOT_TOKEN
          script: |
            set -e
            # Avval kodni yangilaymiz (deploy.sh o'zi ham "git pull" qiladi,
            # lekin bash o'zi bajarayotgan faylni o'zi o'zgartirib qo'yishi
            # (self-modifying script) xato-moyil — shu sabab yangilanishni
            # ALDINDAN, deploy.sh chaqirilishidan OLDIN bajaramiz, shunda
            # bash har doim faylning TO'LIQ YANGI versiyasini o'qib boshlaydi.
            cd /root/kimbor && git pull origin main
            # Foydalanuvchi ilovasi boti tokeni — GitHub secret'dan .env'ga
            # (kodda saqlanmaydi). Mavjud qator yangilanadi, yo'q bo'lsa qo'shiladi.
            if [ -n "$USER_BOT_TOKEN" ]; then
              touch .env
              grep -v '^USER_BOT_TOKEN=' .env > .env.tmp || true
              echo "USER_BOT_TOKEN=$USER_BOT_TOKEN" >> .env.tmp && mv .env.tmp .env
            fi
            bash /root/kimbor/scripts/deploy.sh
            # Caddyfile alohida fayl sifatida ulangan — git pull yangi fayl
            # yaratgani uchun konteyner eskisini ko'rib qoladi. Farq bo'lsa,
            # faqat caddy qayta yaratiladi (bir necha soniya).
            docker exec kimbor_caddy cat /etc/caddy/Caddyfile | cmp -s - Caddyfile || docker compose -f docker-compose.prod.yml up -d --force-recreate caddy
            echo "--- bot logs ---"
            docker logs --tail 30 kimbor_bot
            echo "--- api logs ---"
            docker logs --tail 15 kimbor_api
            echo "--- container status ---"
            docker ps --format '{{.Names}}: {{.Status}}' | grep kimbor
