name: One-off - diagnose MIB wrong-answer bug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const core = require('/app/packages/core/dist/index.js');
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const { classifyQuery } = require('/app/apps/bot/dist/filter/aiClassifier.js');
            const db = new PrismaClient();
            (async () => {
              const gondra = await db.listing.findFirst({ where: { name: { contains: 'Gondra', mode: 'insensitive' } } });
              const cityId = gondra.cityId;

              // 1. 'Dilfuza' yozuvini ko'rish - nega mos keldi?
              const dil = await db.listing.findFirst({
                where: { cityId, name: { contains: 'Dilfuza', mode: 'insensitive' } },
                include: { category: true },
              });
              console.log('DILFUZA_LISTING:', dil ? JSON.stringify({
                name: dil.name,
                category: dil.category ? dil.category.name : null,
                jargon: dil.jargonSynonyms,
                landmark: dil.landmark,
              }) : 'TOPILMADI');

              // 2. Bazada 'mib' so'zi umuman bormi?
              const mibListings = await db.listing.findMany({
                where: { cityId, status: 'ACTIVE', OR: [
                  { name: { contains: 'mib', mode: 'insensitive' } },
                  { jargonSynonyms: { has: 'mib' } },
                ] },
                select: { name: true, jargonSynonyms: true },
              });
              console.log('MIB_IN_DB:', JSON.stringify(mibListings));

              async function run(label, q, userId) {
                const c = await classifyQuery(q, cityId, BigInt(userId));
                const isSeeking = c.intent !== 'NOT_RELEVANT';
                const sr = await core.searchListings({
                  cityId,
                  categoryName: isSeeking ? c.category : null,
                  landmarkName: isSeeking ? c.landmark : null,
                  rawMessage: q,
                  intent: c.intent,
                  name: isSeeking ? c.name : null,
                });
                console.log(label, '| intent:', c.intent, '| cat:', JSON.stringify(c.category), '| name:', JSON.stringify(c.name), '| landmark:', JSON.stringify(c.landmark), '| conf:', c.confidence, '| MATCHED:', sr ? sr.listing.name.trim() : 'NONE');
              }

              // 3. ASOSIY XATO
              await run('MIB_BUG', 'Olmaliq mib nechigacha ishlaydi', 9400001);

              // 4. MUHIM: umumiy toifa-qidiruvlarda AI 'name' bo'sh qoldiradimi?
              //    (agar bo'sh bo'lsa - himoyani 'name'ga bog'lash XAVFSIZ)
              await run('GEN_SANTEXNIK', 'santexnik kerak', 9400002);
              await run('GEN_BALON', 'balon kerak', 9400003);
              await run('GEN_ZAPRAVKA', 'yaqin atrofda zapravka bormi', 9400004);
              await run('GEN_LABO', 'labo kerak edi yuk tashish uchun', 9400005);
              await run('GEN_AVTOELEKTRIK', 'avtoelektirik kerak', 9400006);
              await run('GEN_TOYTEPA', 'toy tepada balon kerak', 9400007);
              await run('GEN_BESHBIR', 'beshbirdagi zaprafka ochiqmi', 9400008);
              await run('GEN_GONDRA', 'gondra zaprafka ochiqmi', 9400009);
              await run('GEN_DESKA', 'deska zaprafka ishlayabdimi', 9400010);

              // 5. Boshqa ro'yxatdan o'tmagan muassasalar ham shu xatoni beradimi?
              await run('HOKIMIYAT', 'hokimiyat nechigacha ishlaydi', 9400011);
              await run('MRU_TEST', 'bugun mru ishlaydimi', 9400012);
              await run('BANK_TEST', 'ipoteka bank nechida ochiladi', 9400013);

              await db.\$disconnect();
              process.exit(0);
            })().catch(e => { console.error('DEBUG_ERROR:', e); process.exit(1); });
            "
