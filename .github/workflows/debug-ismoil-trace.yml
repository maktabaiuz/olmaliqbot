name: One-off - trace exact word causing Ismoil false match

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 3m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const core = require('/app/packages/core/dist/index.js');
            const q = 'Fartunaning nomerini biladiganlar bormi akalar';
            const msgWords = core.normalizeText(q).split(/\s+/).filter(w => w.length >= 5);
            console.log('MSG_WORDS:', JSON.stringify(msgWords));

            const ismoilJargon = ['kafelchi','kafel teradiganlar bormi','kafelchi kerak','kafel usta','kafel remont qiladigan nomeri','kafel terish kerak','kafel ustasi kerak'];
            for (const phrase of ismoilJargon) {
              const jargonWords = core.normalizeText(phrase).split(/\s+/).filter(w => w.length >= 5);
              for (const jw of jargonWords) {
                for (const mw of msgWords) {
                  const dist = core.levenshteinDistance(jw, mw);
                  if (dist <= 3) {
                    console.log('CANDIDATE_PAIR:', JSON.stringify({jargonWord: jw, msgWord: mw, distance: dist, jargonWordLen: jw.length, msgWordLen: mw.length}));
                  }
                }
              }
            }
            " 2>&1
