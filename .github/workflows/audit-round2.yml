name: One-off - second-round audit for new bug patterns
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 90s
          command_timeout: 10m
          script: |
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();
              const j = (o) => JSON.stringify(o, (k,v) => typeof v === 'bigint' ? v.toString() : v);
              (async () => {
                // 1) Past ishonchli (0.5-0.78) holda ham JAVOB BERILGAN so'rovlar —
                //    borderline holatlar, xato ehtimoli yuqoriroq.
                const lowConf = await db.queryLog.findMany({
                  where: { isResolved: true, confidence: { gte: 0.5, lte: 0.78 } },
                  select: { rawMessage: true, categoryName: true, landmarkName: true, confidence: true, resolvedListingId: true, createdAt: true },
                  orderBy: { createdAt: 'desc' }, take: 20,
                });
                console.log('out:LOW_CONF_COUNT=' + lowConf.length);
                lowConf.forEach(r => console.log('out:LOWCONF ' + j(r)));

                // 2) Inkor so'zlari BOR-U, baribir JAVOB BERILGAN so'rovlar
                const negated = await db.queryLog.findMany({
                  where: {
                    isResolved: true,
                    OR: [
                      { rawMessage: { contains: ' emas', mode: 'insensitive' } },
                      { rawMessage: { contains: 'kerakmas', mode: 'insensitive' } },
                      { rawMessage: { contains: 'yoq ', mode: 'insensitive' } },
                    ],
                  },
                  select: { rawMessage: true, categoryName: true, resolvedListingId: true, createdAt: true },
                  orderBy: { createdAt: 'desc' }, take: 20,
                });
                console.log('out:NEGATED_COUNT=' + negated.length);
                negated.forEach(r => console.log('out:NEGATED ' + j(r)));

                // 3) 'yoki' (yoki/or) so'zi bilan JAVOB BERILGAN so'rovlar —
                //    ikkita variant so'ralgan bo'lishi mumkin
                const orQueries = await db.queryLog.findMany({
                  where: { isResolved: true, rawMessage: { contains: ' yoki ', mode: 'insensitive' } },
                  select: { rawMessage: true, categoryName: true, resolvedListingId: true, createdAt: true },
                  orderBy: { createdAt: 'desc' }, take: 15,
                });
                console.log('out:OR_COUNT=' + orQueries.length);
                orQueries.forEach(r => console.log('out:OR ' + j(r)));

                // 4) Bir xil (yoki juda o'xshash) NOMDAGI yozuvlar — nom
                //    to'qnashuvi xavfi (ikki xil biznes bir xil/o'xshash nom)
                const allListings = await db.listing.findMany({ where: { status: 'ACTIVE' }, select: { id: true, name: true, categoryId: true } });
                const byNorm = new Map();
                for (const l of allListings) {
                  const key = l.name.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
                  if (!key) continue;
                  if (!byNorm.has(key)) byNorm.set(key, []);
                  byNorm.get(key).push(l);
                }
                const dupNames = [...byNorm.entries()].filter(([,arr]) => arr.length > 1);
                console.log('out:DUP_NAME_COUNT=' + dupNames.length);
                dupNames.slice(0, 15).forEach(([k, arr]) => console.log('out:DUPNAME ' + k + ' -> ' + j(arr)));

                // 5) Uzun (150+ belgili) xabarlar, JAVOB BERILGAN — ko'p mavzuli
                //    bo'lishi, bitta intentga noto'g'ri siqilgan bo'lishi mumkin
                const longMsgs = await db.queryLog.findMany({
                  where: { isResolved: true },
                  select: { rawMessage: true, categoryName: true, resolvedListingId: true, createdAt: true },
                  orderBy: { createdAt: 'desc' }, take: 500,
                });
                const long = longMsgs.filter(r => r.rawMessage.length >= 150).slice(0, 12);
                console.log('out:LONG_COUNT=' + long.length);
                long.forEach(r => console.log('out:LONG ' + j({...r, rawMessage: r.rawMessage.slice(0,200)})));

                await db.\$disconnect();
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "
