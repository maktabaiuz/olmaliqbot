name: One-off - Verify fuel-type silence fix + full regression

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const { searchListings, extractRequestedBadges } = require('/app/packages/core/dist/index.js');
              const db = new PrismaClient();
              const CITY = '23fdb721-7073-4fd3-bda5-b61bde593490';
              (async () => {
                console.log('=== 1) Propan (nobody has it) -> bot should now STAY SILENT (null) ===');
                const msg1 = 'Propan qayerda ishlayabdi akalar';
                const r1 = await searchListings({ cityId: CITY, categoryName: 'avtomobil zapravkasi', rawMessage: msg1, intent: 'SERVICE', requestedBadges: extractRequestedBadges(msg1) });
                console.log('Result:', r1 ? r1.listing.name : 'null (SILENT - correct!)');

                console.log('');
                console.log('=== 2) Metan (Deska HAS it) -> should still find Deska normally ===');
                const msg2 = 'Metan quyadigan zapravka qayerda';
                const r2 = await searchListings({ cityId: CITY, categoryName: 'avtomobil zapravkasi', rawMessage: msg2, intent: 'SERVICE', requestedBadges: extractRequestedBadges(msg2) });
                console.log('Result:', r2 ? r2.listing.name : 'null', '(expect Deska ichidagi Zaprafka)');

                console.log('');
                console.log('=== 3) AI-92 (Gondra/CARVON have it) -> should find one of them ===');
                const msg3 = 'AI-92 bor zapravka qayerda';
                const r3 = await searchListings({ cityId: CITY, categoryName: 'avtomobil zapravkasi', rawMessage: msg3, intent: 'SERVICE', requestedBadges: extractRequestedBadges(msg3) });
                console.log('Result:', r3 ? r3.listing.name : 'null', '(expect Gondra or CARVON)');

                console.log('');
                console.log('=== 4) Plain zapravka query, NO fuel type requested -> should still work normally ===');
                const r4 = await searchListings({ cityId: CITY, categoryName: 'avtomobil zapravkasi', rawMessage: 'Zapravka qayerda ishlayabdi', intent: 'SERVICE', requestedBadges: [] });
                console.log('Result:', r4 ? r4.listing.name : 'null', '(any zapravka is fine, must NOT be null)');

                console.log('');
                console.log('=== 5) Soft badge (Kafolat, nobody in Taksi has it for this test) -> should STILL show a result (soft rule unchanged) ===');
                const msg5 = 'Taksi kerak kafolat bilan';
                const r5 = await searchListings({ cityId: CITY, categoryName: 'taksi', rawMessage: msg5, intent: 'SERVICE', requestedBadges: extractRequestedBadges(msg5) });
                console.log('Result:', r5 ? r5.listing.name : 'null', '(soft badge - must NOT be null even if no exact match)');

                console.log('');
                console.log('=== 6) Prior regressions: Taksi+Zudlik, self-offer, betonchi/quy ===');
                const { isSelfOffer } = require('/app/packages/core/dist/index.js');
                const r6 = await searchListings({ cityId: CITY, categoryName: 'taksi', rawMessage: 'Taksi kerak zudlik bilan', intent: 'SERVICE', requestedBadges: extractRequestedBadges('Taksi kerak zudlik bilan') });
                console.log('Taksi+Zudlik top:', r6 ? r6.listing.name : 'null', '(expect Muhridin)');
                console.log('isSelfOffer labo+phone:', isSelfOffer('Лабо хизмати 776880696'));
                const r7 = await searchListings({ cityId: CITY, categoryName: 'betonchi', rawMessage: 'Fundament quyadigan usta kerak', intent: 'SERVICE', requestedBadges: [] });
                console.log('Betonchi/quy-fix top:', r7 ? r7.listing.name : 'null', '(expect Biton quyuvchi)');
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "
