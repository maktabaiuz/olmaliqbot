name: One-off - diagnose taxi query silence regression

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const core = require('/app/packages/core/dist/index.js');
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const { classifyQuery } = require('/app/apps/bot/dist/filter/aiClassifier.js');
            const db = new PrismaClient();
            (async () => {
              const g = await db.listing.findFirst({ where: { name: { contains: 'Gondra', mode: 'insensitive' } } });
              const cityId = g.cityId;
              const N = core.normalizeText;

              console.log('=== TAKSI KATEGORIYASI HOLATI ===');
              const taksiCat = await db.category.findFirst({ where: { name: { equals: 'Taksi', mode: 'insensitive' } } });
              console.log('Taksi kategoriya:', JSON.stringify(taksiCat));
              const taksiListings = await db.listing.findMany({ where: { categoryId: taksiCat.id, status: 'ACTIVE' }, select: { name: true, jargonSynonyms: true } });
              console.log('Taksi yozuvlari:', JSON.stringify(taksiListings));

              async function run(label, q, userId) {
                const c = await classifyQuery(q, cityId, BigInt(userId));
                console.log(label, '| AI:', JSON.stringify({ intent: c.intent, category: c.category, name: c.name, landmark: c.landmark, confidence: c.confidence }));
                const seek = c.intent !== 'NOT_RELEVANT';
                const sr = await core.searchListings({
                  cityId, categoryName: seek ? c.category : null, landmarkName: seek ? c.landmark : null,
                  rawMessage: q, intent: c.intent, name: seek ? c.name : null,
                });
                console.log('  MATCHED:', sr ? sr.listing.name.trim() : 'NONE');
              }

              console.log('=== REAL SHIKOYAT SOROVLARI ===');
              await run('TAKSI_1', 'Assalomu alekum bochkadan olmaliqqa ketadigan taxilar bormi', 9700001);
              await run('TAKSI_2', 'Olmaliqdan Samarqand Ishtihonga taksi kk', 9700002);
              await run('TAKSI_3', 'toshkentga taksi kerak', 9700003);
              await run('TAKSI_4', 'taksi kerak', 9700004);

              console.log('=== SOZ-DARAJASIDA TEKSHIRISH (taksi kategoriyasi so_zlari umumiy royxatda bormi) ===');
              for (const w of ['taksi', 'taxi', 'olmaliqqa', 'ketadigan', 'toshkentga', 'bochkadan']) {
                // isGenericFillerWord ochiq eksport qilinmagan bolsa, UZBEK_STOPWORDS orqali tekshiramiz
                console.log('  ', w, '-> stopword:', core.UZBEK_STOPWORDS ? core.UZBEK_STOPWORDS.has(N(w)) : 'export yoq');
              }

              await db.\$disconnect();
              process.exit(0);
            })().catch(e => { console.error('DEBUG_ERROR:', e); process.exit(1); });
            "
