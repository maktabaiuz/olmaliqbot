name: One-off - Verify rankedListCache canEdit logic

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Run via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            docker exec kimbor_bot node -e "
              const { setRankedList, revealNextRankedItem } = require('/app/apps/bot/dist/cache/rankedListCache.js');
              (async () => {
                const id = 'test-listing-' + Date.now();
                // Scenario: first result TEXT-ONLY, then items: [text, photo, text]
                await setRankedList(id, [
                  { formattedText: 'item1 text', photoUrls: [], mapUrl: null },
                  { formattedText: 'item2 photo', photoUrls: ['http://x/1.jpg'], mapUrl: null },
                  { formattedText: 'item3 text', photoUrls: [], mapUrl: null },
                ], false); // firstResultHadPhoto = false

                const r1 = await revealNextRankedItem(id);
                console.log('reveal1 (expect canEdit=true, text->text):', JSON.stringify(r1));

                const r2 = await revealNextRankedItem(id);
                console.log('reveal2 (expect canEdit=true, text->photo... wait current=text(item1 was text), next=photo -> canEdit should be false since NEXT has photo):', JSON.stringify(r2));

                const r3 = await revealNextRankedItem(id);
                console.log('reveal3 (expect canEdit=false, current=photo(item2), next=text -> false since CURRENT has photo):', JSON.stringify(r3));

                const r4 = await revealNextRankedItem(id);
                console.log('reveal4 (expect null, exhausted):', JSON.stringify(r4));
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "
