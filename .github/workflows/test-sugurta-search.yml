name: One-off - Test sugurta search resolution

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Run via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const { searchListings } = require('/app/packages/core/dist/index.js');
              const db = new PrismaClient();
              const CITY = '23fdb721-7073-4fd3-bda5-b61bde593490';
              (async () => {
                console.log('=== A) Raw apostrophe byte check ===');
                const cats = await db.category.findMany({
                  where: { name: { contains: 'ug', mode: 'insensitive' } },
                  select: { id: true, name: true },
                });
                for (const c of cats) {
                  const codes = [...c.name].map(ch => ch.codePointAt(0).toString(16)).join(' ');
                  console.log(JSON.stringify({ name: c.name, id: c.id, codepoints: codes }));
                }

                console.log('');
                console.log('=== B) searchListings with categoryName + rawMessage (real historical query) ===');
                const r1 = await searchListings({
                  cityId: CITY,
                  categoryName: \"sug'urta\",
                  rawMessage: \"Assalomu alaykum akalar sug'urta qancha bo'lyapti kim biladi aytvorilar oldindan rahmat\",
                  intent: 'SERVICE',
                });
                console.log('RESULT_B:', r1 ? JSON.stringify({ name: r1.name, categoryId: r1.categoryId }) : 'null (topilmadi)');

                console.log('');
                console.log('=== C) same rawMessage, NO categoryName (jargon-only path) ===');
                const r2 = await searchListings({
                  cityId: CITY,
                  rawMessage: \"Assalomu alaykum akalar sug'urta qancha bo'lyapti kim biladi aytvorilar oldindan rahmat\",
                  intent: 'SERVICE',
                });
                console.log('RESULT_C:', r2 ? JSON.stringify({ name: r2.name, categoryId: r2.categoryId }) : 'null (topilmadi)');

                console.log('');
                console.log('=== D) simple direct query: Sug'"'"'urta kerak ===');
                const r3 = await searchListings({
                  cityId: CITY,
                  categoryName: \"sug'urta\",
                  rawMessage: \"Sug'urta kerak\",
                  intent: 'SERVICE',
                });
                console.log('RESULT_D:', r3 ? JSON.stringify({ name: r3.name, categoryId: r3.categoryId }) : 'null (topilmadi)');
              })().catch(e=>{console.error('ERR', e); process.exit(1)}).finally(()=>db.\$disconnect());
            "
