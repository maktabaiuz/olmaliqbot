name: One-off - Scan QueryLog for past self-offer-with-phone false positives

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Query via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const core = require('/app/packages/core/dist/index.js');
              const db = new PrismaClient();
              (async () => {
                const logs = await db.queryLog.findMany({
                  where: { isResolved: true },
                  orderBy: { createdAt: 'desc' },
                  take: 500,
                  select: { rawMessage: true, categoryName: true, createdAt: true },
                });
                let found = 0;
                for (const l of logs) {
                  if (/\b(?:998)?\d{9}\b/.test(core.normalizeText(l.rawMessage))) {
                    const wasSelfOffer = core.isSelfOffer(l.rawMessage);
                    console.log(JSON.stringify({ msg: l.rawMessage, category: l.categoryName, date: l.createdAt, nowDetectedAsSelfOffer: wasSelfOffer }));
                    found++;
                  }
                }
                console.log('TOTAL_RESOLVED_WITH_PHONE_NUMBER:', found, '/ scanned', logs.length);
              })().catch(e=>{console.error(e); process.exit(1)}).finally(()=>db.\$disconnect());
            "
