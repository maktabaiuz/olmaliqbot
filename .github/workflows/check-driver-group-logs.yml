name: One-off - Check QueryLog coverage for driver groups
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 90s
          command_timeout: 10m
          script: |
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();
              (async () => {
                for (const chatId of ['-1003196202156', '-1001647665739']) {
                  const count = await db.queryLog.count({ where: { chatId: BigInt(chatId) } });
                  console.log('CHAT', chatId, 'LOG COUNT:', count);
                  const samples = await db.queryLog.findMany({ where: { chatId: BigInt(chatId) }, select: { rawMessage: true, landmarkName: true, createdAt: true }, orderBy: { createdAt: 'desc' }, take: 15 });
                  for (const s of samples) console.log('  ', JSON.stringify(s));
                }
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "
