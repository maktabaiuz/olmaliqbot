name: One-off - check moderation config for main group

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 3m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const db = new PrismaClient();
            (async () => {
              const cityGroup = await db.cityGroup.findFirst({ where: { chatId: BigInt('-1001647665739') } });
              console.log('CITY_GROUP:', JSON.stringify(cityGroup && { id: cityGroup.id, chatId: cityGroup.chatId.toString(), title: cityGroup.title, cityId: cityGroup.cityId }));
              const toggles = cityGroup ? await db.groupFeatureToggle.findMany({ where: { cityGroupId: cityGroup.id } }) : [];
              console.log('GROUP_FEATURE_TOGGLES:', JSON.stringify(toggles.map(t => ({ featureKey: t.featureKey, isEnabled: t.isEnabled }))));

              const modLogs = await db.moderationLog.findMany({ where: { chatId: BigInt('-1001647665739') }, orderBy: { createdAt: 'desc' }, take: 5 });
              console.log('RECENT_MODERATION_LOGS:', JSON.stringify(modLogs.map(m => ({ category: m.category, messageText: m.messageText, createdAt: m.createdAt }))));

              await db.\$disconnect();
              process.exit(0);
            })().catch(e => { console.error('DEBUG_ERROR:', e); process.exit(1); });
            "
            echo "--- recent bot container logs ---"
            docker logs --since 2h kimbor_bot 2>&1 | tail -100
