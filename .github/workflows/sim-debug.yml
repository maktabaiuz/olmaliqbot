name: One-off - simulate wrong-match cases
on:
  workflow_dispatch:
jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - name: Simulate via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 90s
          command_timeout: 10m
          script: |
            docker exec kimbor_api node -e "
              const crypto = require('crypto');
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();
              function buildInitData(telegramId) {
                const botToken = process.env.BOT_TOKEN;
                const user = JSON.stringify({ id: telegramId, first_name: 'Test', last_name: 'Admin' });
                const params = { auth_date: Math.floor(Date.now()/1000).toString(), user };
                const paramsArray = Object.entries(params).sort((a,b)=>a[0].localeCompare(b[0]));
                const dataCheckString = paramsArray.map(([k,v])=>k+'='+v).join('\\n');
                const secretKey = crypto.createHmac('sha256','WebAppData').update(botToken).digest();
                const hash = crypto.createHmac('sha256', secretKey).update(dataCheckString).digest('hex');
                const usp = new URLSearchParams(params);
                usp.set('hash', hash);
                return usp.toString();
              }
              (async () => {
                const superAdmin = await db.user.findFirst({ where: { role: 'SUPER_ADMIN' } });
                const headers = { 'x-init-data': buildInitData(superAdmin.telegramId.toString()), 'Content-Type': 'application/json' };
                const messages = [
                  'Уйдаги газ плитани ремонт киладиган усталар номери кимда бор ёзиб юборинглар илтимос',
                  'Assalomu alaykum akalar qayerda kompyuter noutbook remont qiladigan usta bor',
                  'Assalomu alaykum akalar yaxshimisizlar sunnat qiladigan yaxshi duxtir bormi',
                  'Fartunani nomeri bormi',
                  'Beshbirdagi zaprafka ochiqmi',
                  'beshbir zaprafka nechigacha ishlaydi',
                  'deska zaprafka ishlayabdimi',
                  'moshina moyi almashtirish kerak',
                  'арендага механика мошин керак',
                  'Taksi kerak zudlik bilan',
                  'Metan quyadigan zapravka qayerda',
                  'Olmaliq mib nechigacha ishlaydi',
                  'stol stul arendaga beradigan odamni nomeri kimda bor',
                  'Propan qayerda ishlayabdi akalar',
                  'kafel yotqizadigan usta kerak',
                  'mashina ochib qolgan, kimda perekrutel bor',
                  'moshina eshigini remont qiladigan usta qayerda ishlaydi',
                  'santexnik kerak suv tomayabdi',
                  'sartarosh kerak',
                  'kvartira arendaga kerak',
                  'elektrik kerak svet ochdi',
                  'gazavik bormi',
                  'balon kerak',
                  'kompyuter ustasi bormi',
                  'noutbook remont qiladigan usta kerak',
                  'Oydinda nima bor?',
                ];
                const run = async (msg) => {
                  const r = await fetch('http://localhost:4000/api/admin/simulate', { method: 'POST', headers, body: JSON.stringify({ message: msg }) });
                  const d = await r.json();
                  const top = d.scoreBreakdown && d.scoreBreakdown[0];
                  return 'out:' + JSON.stringify({ m: msg.slice(0, 70), ai: d.steps && d.steps.aiClassification && d.steps.aiClassification.category, found: d.finalResult && d.finalResult.found, who: d.finalResult && d.finalResult.listingName, cat: d.finalResult && d.finalResult.categoryName, str: top && top.jargonStrength, ph: top && top.matchedJargonPhrase });
                };
                for (let i = 0; i < messages.length; i += 5) {
                  const outs = await Promise.all(messages.slice(i, i + 5).map(run));
                  outs.forEach(o => console.log(o));
                }
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "
