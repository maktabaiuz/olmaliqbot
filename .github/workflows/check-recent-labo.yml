name: One-off - Check most recent labo query timing

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();
              (async () => {
                const logs = await db.queryLog.findMany({
                  where: { rawMessage: { contains: 'або', mode: 'insensitive' } },
                  orderBy: { createdAt: 'desc' },
                  take: 5,
                  select: { rawMessage: true, categoryName: true, isResolved: true, confidence: true, createdAt: true },
                });
                console.log('NOW:', new Date().toISOString());
                console.log(JSON.stringify(logs, null, 2));
              })().catch(e=>{console.error(e); process.exit(1)}).finally(()=>db.\$disconnect());
            "
