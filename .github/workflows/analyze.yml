name: Analyze production usage (data-driven insights)
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            echo "--- HOST SPECS ---"
            nproc
            free -h
            df -h / 2>/dev/null | head -3
            echo "--- DOCKER STATS (joriy resurs ishlatilishi) ---"
            docker stats --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}"
            echo "--- POSTGRES max_connections ---"
            docker exec kimbor_postgres psql -U kimbor -d kimbor_db -c "SHOW max_connections;" 2>&1
            docker exec kimbor_postgres psql -U kimbor -d kimbor_db -c "SELECT count(*) as active_connections FROM pg_stat_activity;" 2>&1
            echo "--- DB TABLE SIZES (eng kattasi) ---"
            docker exec kimbor_postgres psql -U kimbor -d kimbor_db -c "SELECT relname, n_live_tup FROM pg_stat_user_tables ORDER BY n_live_tup DESC LIMIT 10;" 2>&1
            echo "--- PM2/Node process count & uptime ---"
            docker exec kimbor_bot node -e "console.log('uptime(s):', process.uptime()); console.log('mem:', process.memoryUsage());"
