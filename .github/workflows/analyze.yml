name: Analyze production usage (data-driven insights)
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Run analysis via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 90s
          command_timeout: 10m
          script: |
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const core = require('/app/packages/core/dist/index.js');
              const db = new PrismaClient();
              (async () => {
                const city = await db.city.findFirst();
                const lv = await core.getLandmarkVocabulary(city.id);
                for (const w of ['karzinka','korzinka','eski','bozor','radugada','raduga','most','oldida']) {
                  console.log('out:WORD ' + w + ' landmark=' + lv.has(w));
                }
                const lms = await db.landmark.findMany({ where: { cityId: city.id, OR: [{ name: { contains: 'orzin', mode: 'insensitive' } }, { name: { contains: 'arzin', mode: 'insensitive' } }, { name: { contains: 'bozor', mode: 'insensitive' } }, { name: { contains: 'radug', mode: 'insensitive' } }] }, select: { name: true, synonyms: true } });
                console.log('out:LMS ' + JSON.stringify(lms));
                await db.\$disconnect();
              })().catch(e=>{console.error('ERR', e.stack); process.exit(1)});
            "
