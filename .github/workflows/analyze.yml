name: Analyze production usage (data-driven insights)
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            docker exec kimbor_postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT date_trunc('"'"'hour'"'"', \"createdAt\") h, count(*) FROM query_logs WHERE \"createdAt\" > now() - interval '"'"'14 days'"'"' GROUP BY 1 ORDER BY 2 DESC LIMIT 3;" -c "SELECT date_trunc('"'"'minute'"'"', \"createdAt\") m, count(*) FROM query_logs WHERE \"createdAt\" > now() - interval '"'"'14 days'"'"' GROUP BY 1 ORDER BY 2 DESC LIMIT 3;" -c "SELECT round(percentile_cont(0.5) WITHIN GROUP (ORDER BY \"responseTimeMs\")) p50, round(percentile_cont(0.95) WITHIN GROUP (ORDER BY \"responseTimeMs\")) p95, count(*) n FROM query_logs WHERE \"responseTimeMs\" IS NOT NULL;"'
