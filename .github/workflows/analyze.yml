name: Analyze production usage (data-driven insights)
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 30m
          script: |
            docker exec kimbor_api node -e "
              const { db } = require('/app/packages/db/dist/index.js');
              const core = require('/app/packages/core/dist/index.js');
              (async () => {
                const city = await db.city.findFirst();
                const t0 = Date.now();
                const r = await core.auditListings(city.id, { dynamic: true });
                console.log('out:LISTINGS=' + r.listings + ' PHRASES=' + r.phrases + ' ISSUES=' + r.issues.length + ' sec=' + Math.round((Date.now()-t0)/1000));
                const by = {}; for (const i of r.issues) by[i.kind] = (by[i.kind]||0)+1;
                console.log('out:BYKIND=' + JSON.stringify(by));
                for (const i of r.issues) console.log('out:I|' + i.kind + '|' + i.category + '|' + i.listing + '|' + i.phrase + '|' + i.detail);
                process.exit(0);
              })().catch(e => { console.error('ERR', e.stack); process.exit(1); });
            "
