name: Analyze production usage (data-driven insights)
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            docker exec kimbor_bot node -e "
              const https = require('https');
              const token = process.env.BOT_TOKEN;
              function call(method, params) {
                return new Promise((resolve) => {
                  const data = JSON.stringify(params);
                  const req = https.request({
                    hostname: 'api.telegram.org',
                    path: '/bot' + token + '/' + method,
                    method: 'POST',
                    headers: { 'content-type': 'application/json', 'content-length': Buffer.byteLength(data) },
                  }, (res) => {
                    let body = '';
                    res.on('data', (c) => body += c);
                    res.on('end', () => resolve(JSON.parse(body)));
                  });
                  req.write(data);
                  req.end();
                });
              }
              (async () => {
                // Haqiqatan a'zo bo'lmagan tasodifiy foydalanuvchi ID
                const r1 = await call('getChatMember', { chat_id: '@Olmaliqlik', user_id: 123456789 });
                console.log('out:NON_MEMBER=' + JSON.stringify(r1));
                // Admin (b7can) - a'zo bo'lishi kerak
                const r2 = await call('getChatMember', { chat_id: '@Olmaliqlik', user_id: 358795989 });
                console.log('out:KNOWN_ADMIN=' + JSON.stringify(r2.ok ? r2.result.status : r2));
              })();
            "
            echo '--- redis sub_ok cache (eskirgan bo lishi mumkin) ---'
            docker exec kimbor_redis redis-cli KEYS 'kimbor:sub_ok:*'
