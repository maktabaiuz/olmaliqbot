name: Analyze production usage (data-driven insights)
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            docker exec kimbor_api node -e "
              const { db } = require('/app/packages/db/dist/index.js');
              const core = require('/app/packages/core/dist/index.js');
              (async () => {
                const rows = await db.queryLog.findMany({
                  where: { intent: { not: 'NOT_RELEVANT' }, categoryName: { not: null }, confidence: { gte: 0.85 } },
                  orderBy: { createdAt: 'desc' }, take: 300, select: { rawMessage: true, categoryName: true },
                });
                let same = 0, diff = 0, none = 0, cyr = 0, cyrSame = 0;
                for (const r of rows) {
                  const fb = core.fallbackRuleClassification(core.normalizeText(r.rawMessage), r.rawMessage);
                  const isCyr = /[а-яёўқғҳ]/i.test(r.rawMessage);
                  if (isCyr) cyr++;
                  const a = (fb.category || '').toLowerCase(), b = (r.categoryName || '').toLowerCase();
                  if (!a) none++;
                  else if (a === b || a.includes(b) || b.includes(a)) { same++; if (isCyr) cyrSame++; }
                  else diff++;
                }
                console.log('out:' + JSON.stringify({ sample: rows.length, fallbackAgrees: same, fallbackWrong: diff, fallbackNoAnswer: none, cyrillic: cyr, cyrillicAgrees: cyrSame }));
                const all = await db.queryLog.count({ where: { intent: { not: 'NOT_RELEVANT' } } });
                const ok = await db.queryLog.count({ where: { intent: { not: 'NOT_RELEVANT' }, isResolved: true } });
                const lowConf = await db.queryLog.count({ where: { intent: { not: 'NOT_RELEVANT' }, confidence: { lt: 0.6 } } });
                console.log('out:' + JSON.stringify({ seekingTotal: all, resolved: ok, lowConfidence: lowConf }));
                process.exit(0);
              })().catch(e => { console.error('ERR', e.message); process.exit(1); });
            "
