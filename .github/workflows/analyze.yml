name: Analyze production usage (data-driven insights)
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            docker exec kimbor_api node -e "
              const { db } = require('/app/packages/db/dist/index.js');
              (async () => {
                const city = await db.city.findFirst({ where: { slug: 'olmaliq' } });
                const names = ['santexnik','kamerachi','kafelchi','kalonka ustasi','fayz choyxona','natijnoy patalok','gilam yuvish hizmati'];
                let target = await db.landmark.findFirst({ where: { cityId: city.id, name: { equals: 'Olmaliq', mode: 'insensitive' } } });
                if (!target) target = await db.landmark.findFirst({ where: { cityId: city.id, name: 'Olmaliq (butun shahar)' } });
                if (!target) target = await db.landmark.create({ data: { cityId: city.id, name: 'Olmaliq (butun shahar)', synonyms: [] } });
                console.log('out:TARGET=' + target.name);
                const lms = await db.landmark.findMany({ where: { cityId: city.id, name: { in: names, mode: 'insensitive' } }, select: { id: true, name: true, synonyms: true, primaryListings: { select: { id: true, name: true } } } });
                for (const l of lms) {
                  await db.listing.updateMany({ where: { primaryLandmarkId: l.id }, data: { primaryLandmarkId: target.id } });
                  await db.candidate.updateMany({ where: { primaryLandmarkId: l.id }, data: { primaryLandmarkId: null } });
                  await db.landmark.delete({ where: { id: l.id } });
                  await db.auditLog.create({ data: { cityId: city.id, action: 'CLEANUP_JUNK_LANDMARK', details: { deletedLandmark: l.name, synonyms: l.synonyms, movedListings: l.primaryListings.map(x => ({ id: x.id, name: x.name })), movedTo: target.name } } });
                  console.log('out:FIXED|' + l.name + ' -> ' + target.name + ' | ' + l.primaryListings.map(x => x.name).join(','));
                }
                process.exit(0);
              })().catch(e => { console.error('ERR', e.stack); process.exit(1); });
            "
