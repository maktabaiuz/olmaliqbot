name: Analyze production usage (data-driven insights)
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            echo "--- node resolve path ---"
            docker exec kimbor_bot node -e "console.log(require.resolve('grammy'))"
            echo "--- verify requiredChannels.js has the fix ---"
            docker exec kimbor_bot sh -c "grep -o 'PARTICIPANT_ID_INVALID' /app/apps/bot/dist/subscription/requiredChannels.js"
