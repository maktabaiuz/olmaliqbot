name: Analyze production usage (data-driven insights)
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            docker exec kimbor_api node -e "
              const { db } = require('/app/packages/db/dist/index.js');
              (async () => {
                const rows = await db.listing.findMany({ where: { source: 'webapp', status: 'PAUSED', NOT: { ownerTelegramId: 999000111n } }, select: { id: true, name: true } });
                for (const r of rows) await db.listing.update({ where: { id: r.id }, data: { status: 'ACTIVE' } });
                console.log('out:ACTIVATED=' + JSON.stringify(rows));
                process.exit(0);
              })().catch(e => { console.error('ERR', e.stack); process.exit(1); });
            "
