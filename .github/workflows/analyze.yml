name: Analyze production usage (data-driven insights)
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            docker exec kimbor_api node -e "
              const { db } = require('/app/packages/db/dist/index.js');
              const core = require('/app/packages/core/dist/index.js');
              (async () => {
                const city = await db.city.findFirst();
                const m = 'Assalom aleykum akalar toy tepa pavarodi ochiqmikan othanlar bormi';
                const c = await core.classifyQuery(m, city.id, undefined, process.env.GEMINI_API_KEY);
                console.log('out:CLASSIFY=' + JSON.stringify(c));
                const fb = core.fallbackRuleClassification(core.normalizeText(m), m);
                console.log('out:FALLBACK=' + JSON.stringify(fb));
                const isSeeking = c.intent !== 'NOT_RELEVANT';
                const r = await core.searchListings({ cityId: city.id, categoryName: isSeeking ? c.category : null, landmarkName: isSeeking ? c.landmark : null, rawMessage: m, intent: c.intent, name: isSeeking ? c.name : null, requestedBadges: [], rentalFilters: null, objectType: isSeeking ? c.object_type : null, debug: true });
                console.log('out:RESULT=' + JSON.stringify(r ? { name: r.listing?.name, breakdown: r.scoreBreakdown } : null));
                const q = await db.queryLog.findFirst({ where: { rawMessage: { contains: 'pavarodi' } }, orderBy: { createdAt: 'desc' }, select: { intent: true, categoryName: true, landmarkName: true, confidence: true, isResolved: true, createdAt: true } });
                console.log('out:LOGGED=' + JSON.stringify(q));
                const lav = await db.listing.findFirst({ where: { name: { contains: 'Oqtepa' } }, select: { name: true, jargonSynonyms: true, primaryLandmark: { select: { name: true } } } });
                console.log('out:LISTING=' + JSON.stringify(lav));
                const lm = await db.landmark.findMany({ where: { OR: [{ name: { contains: 'tepa', mode: 'insensitive' } }, { synonyms: { hasSome: ['toytepa','toy tepa'] } }] }, select: { name: true, synonyms: true } });
                console.log('out:LANDMARKS=' + JSON.stringify(lm));
                process.exit(0);
              })().catch(e => { console.error('ERR', e.stack); process.exit(1); });
            "
