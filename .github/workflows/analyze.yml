name: Analyze production usage (data-driven insights)
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            docker exec kimbor_api node -e "
              const { db } = require('/app/packages/db/dist/index.js');
              (async () => {
                const group = await db.cityGroup.findFirst();
                console.log('out:GROUP=' + group.id + ' ' + group.title);
                // Admin API'ning O'ZI qiladigan amalni to'g'ridan-to'g'ri (HTTP'siz) sinaymiz
                const result = await db.groupFeatureToggle.upsert({
                  where: { cityGroupId_featureKey: { cityGroupId: group.id, featureKey: 'MANDATORY_INVITE' } },
                  update: { isEnabled: true, requiredCount: 7 },
                  create: { cityGroupId: group.id, featureKey: 'MANDATORY_INVITE', isEnabled: true, requiredCount: 7 },
                });
                console.log('out:SAVED=' + JSON.stringify(result));
                const readBack = await db.groupFeatureToggle.findUnique({ where: { cityGroupId_featureKey: { cityGroupId: group.id, featureKey: 'MANDATORY_INVITE' } } });
                console.log('out:READBACK=' + JSON.stringify(readBack));
                // Tozalab qo'yamiz — bu faqat tekshiruv, real yoqish emas
                await db.groupFeatureToggle.update({ where: { id: result.id }, data: { isEnabled: false } });
                await db.\$disconnect();
              })().catch(e => { console.error('ERR', e.message); process.exit(1); });
            "
