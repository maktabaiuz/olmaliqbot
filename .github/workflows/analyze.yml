name: Analyze production usage (data-driven insights)
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Run analysis via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 90s
          command_timeout: 10m
          script: |
            docker exec kimbor_api node -e "
              const { db } = require('/app/packages/db/dist/index.js');
              (async () => {
                const city = await db.city.findFirst();
                const since30 = new Date(Date.now() - 30*24*60*60*1000);
                const since7 = new Date(Date.now() - 7*24*60*60*1000);

                console.log('=== UMUMIY HAJM ===');
                console.log(JSON.stringify({
                  totalUsers: await db.user.count(),
                  totalListings: await db.listing.count({ where: { status: 'ACTIVE' } }),
                  totalGroups: await db.cityGroup.count(),
                  totalQueries30d: await db.queryLog.count({ where: { createdAt: { gte: since30 } } }),
                  totalQueries7d: await db.queryLog.count({ where: { createdAt: { gte: since7 } } }),
                  resolvedRate30d: await db.queryLog.count({ where: { createdAt: { gte: since30 }, isResolved: true } }),
                  newUsers7d: await db.user.count({ where: { createdAt: { gte: since7 } } }),
                  pendingCandidates: await db.candidate.count({ where: { status: 'PENDING' } }),
                  totalCategories: await db.category.count(),
                }));

                console.log('');
                console.log('=== GURUHLAR QAMROVI (eng oxirgi snapshot a\'zolar soni) ===');
                const groups = await db.cityGroup.findMany({ select: { id: true, title: true } });
                const groupInfo = [];
                for (const g of groups) {
                  const snap = await db.groupMemberSnapshot.findFirst({ where: { cityGroupId: g.id }, orderBy: { date: 'desc' } });
                  groupInfo.push({ title: g.title, memberCount: snap ? snap.memberCount : null });
                }
                const totalReach = groupInfo.reduce((s,g) => s + (g.memberCount||0), 0);
                console.log(JSON.stringify({ groupCount: groups.length, totalReach, groups: groupInfo.sort((a,b)=>(b.memberCount||0)-(a.memberCount||0)) }));

                console.log('');
                console.log('=== HAL QILINMAGAN SO\'ROVLAR — ENG KO\'P TAKRORLANGAN KATEGORIYA (30 kun, bazada bo\'shliq) ===');
                const unresolved = await db.queryLog.findMany({
                  where: { createdAt: { gte: since30 }, isResolved: false, intent: { not: 'NOT_RELEVANT' } },
                  select: { categoryName: true },
                });
                const counts = {};
                for (const u of unresolved) {
                  const k = (u.categoryName || '(nomsiz)').toLowerCase().trim();
                  counts[k] = (counts[k]||0)+1;
                }
                console.log(JSON.stringify(Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,20)));

                console.log('');
                console.log('=== KATEGORIYA BO\'YICHA YOZUVLAR SONI (eng kam/0 ta, lekin so\'ralgan) ===');
                const listingCounts = await db.listing.groupBy({ by: ['categoryId'], where: { status: 'ACTIVE' }, _count: { categoryId: true } });
                const catIdToCount = {}; for (const l of listingCounts) catIdToCount[l.categoryId] = l._count.categoryId;
                const allCats = await db.category.findMany({ select: { id: true, name: true } });
                const zeroOrLow = allCats.map(c => ({ name: c.name, count: catIdToCount[c.id]||0 })).filter(c => c.count <= 1).sort((a,b)=>a.count-b.count);
                console.log(JSON.stringify(zeroOrLow.slice(0, 25)));

                console.log('');
                console.log('=== ENG KO\'P SO\'RALGAN KATEGORIYALAR (30 kun, hal qilingan) — talab reytingi ===');
                const resolved = await db.queryLog.findMany({ where: { createdAt: { gte: since30 }, isResolved: true }, select: { categoryName: true } });
                const rc = {}; for (const r of resolved) { const k=(r.categoryName||'?').toLowerCase().trim(); rc[k]=(rc[k]||0)+1; }
                console.log(JSON.stringify(Object.entries(rc).sort((a,b)=>b[1]-a[1]).slice(0,15)));

                console.log('');
                console.log('=== BIR XIL KATEGORIYADA KO\'P YOZUV BOR SOHALAR (raqobat — \"top joylashuv\" potensiali) ===');
                const competitive = allCats.map(c => ({ name: c.name, count: catIdToCount[c.id]||0 })).filter(c => c.count >= 3).sort((a,b)=>b.count-a.count);
                console.log(JSON.stringify(competitive.slice(0, 15)));

                console.log('');
                console.log('=== VERIFIED vs COMMUNITY_UNVERIFIED nisbati ===');
                console.log(JSON.stringify({
                  verified: await db.listing.count({ where: { status: 'ACTIVE', verification: 'VERIFIED' } }),
                  unverified: await db.listing.count({ where: { status: 'ACTIVE', verification: 'COMMUNITY_UNVERIFIED' } }),
                }));

                console.log('');
                console.log('=== REVIEW/BAHO FAOLLIGI ===');
                console.log(JSON.stringify({ totalReviews: await db.review.count(), positive: await db.review.count({ where: { isPositive: true } }) }));

                console.log('');
                console.log('=== BROADCAST TARIXI (reklama yuborish imkoniyati sinalganmi) ===');
                console.log(JSON.stringify({ broadcastCount: await db.broadcastMessage.count() }));

                console.log('');
                console.log('=== SHAHARLAR SONI (ko\'p shaharlilik qancha ishlatilgan) ===');
                console.log(JSON.stringify(await db.city.findMany({ select: { name: true, isActive: true, planType: true, createdAt: true } })));

                console.log('');
                console.log('=== EMERGENCY SO\'ROVLAR (30 kun) ===');
                console.log(JSON.stringify({ count: await db.queryLog.count({ where: { createdAt: { gte: since30 }, intent: 'EMERGENCY' } }) }));

                process.exit(0);
              })().catch(e => { console.error('ERR', e.message); process.exit(1); });
            "
