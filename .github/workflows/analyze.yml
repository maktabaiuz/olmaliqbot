name: Analyze production usage (data-driven insights)
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            cd /root/kimbor
            for k in POSTGRES_PASSWORD ADMIN_PASSWORD SESSION_SECRET JWT_SECRET; do if grep -q "^$k=." .env; then v=$(grep "^$k=" .env | cut -d= -f2-); [ "$v" = "kimbor_sec_pass_2026" ] && echo "out:ENV $k=DEFAULT!" || echo "out:ENV $k=set(len ${#v})"; else echo "out:ENV $k=MISSING"; fi; done
            echo "out:PORTS"; ss -tlnp | awk 'NR>1{print "out:  "$4" "$6}' | grep -v 127.0.0 | head -20
            echo "out:UFW $(ufw status 2>/dev/null | head -1)"
            echo "out:CRON"; crontab -l 2>/dev/null | sed 's/^/out:  /'
            echo "out:BACKUPS"; ls -la /root/kimbor/backups 2>/dev/null | tail -5 | sed 's/^/out:  /'; ls -la /root/backups 2>/dev/null | tail -3 | sed 's/^/out:  /'
            echo "out:SSH $(grep -E '^(PasswordAuthentication|PermitRootLogin)' /etc/ssh/sshd_config | tr '\n' ' ')"
            grep -n "sessionSecret\|SESSION_SECRET" apps/api/src/index.ts | head -3 | sed 's/^/out:CODE /'
