name: Analyze production usage (data-driven insights)
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            docker exec -w /app/apps/bot kimbor_bot node -e "
              const { Bot } = require('grammy');
              const sub = require('./dist/subscription/requiredChannels.js');
              const bot = new Bot(process.env.BOT_TOKEN);
              (async () => {
                await bot.init();
                const missing1 = await sub.getMissingChannels(bot.api, 123456789);
                console.log('out:NON_MEMBER_missing=' + JSON.stringify(missing1.map(c => c.title)));
                const missing2 = await sub.getMissingChannels(bot.api, 358795989);
                console.log('out:ADMIN_USER_missing=' + JSON.stringify(missing2.map(c => c.title)));
              })();
            "
