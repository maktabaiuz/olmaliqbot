name: Analyze production usage (data-driven insights)
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Run analysis via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 90s
          command_timeout: 10m
          script: |
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const core = require('/app/packages/core/dist/index.js');
              const db = new PrismaClient();
              const cases = [
                ['SILENCE', 'Radugada korzinkani yonida TELEFON.UZB'],
                ['SILENCE', 'Akala Alisa aqlli kalonka qayerda sotadi bilmislami'],
                ['SILENCE', 'Assalomu aleykum akalar 29 linya kanechnik tomondan qanaqa choyxona bor'],
                ['ANSWER', 'kalonka ustasi kerak'],
                ['ANSWER', 'gaz kolonka ustasi kerak'],
                ['ANSWER', 'balon kerak'],
                ['ANSWER', 'toy tepada balon kerak'],
                ['ANSWER', 'beshbirdagi zaprafka ochiqmi'],
                ['ANSWER', 'Gagarin tomondagi choyxona nomeri kerak'],
                ['ANSWER', 'santexnik kerak'],
                ['ANSWER', 'malyar kerak'],
                ['ANSWER', 'televizor ustasi kerak'],
              ];
              (async () => {
                const city = await db.city.findFirst();
                for (const [expect, m] of cases) {
                  const c = await core.classifyQuery(m, city.id, undefined, process.env.GEMINI_API_KEY);
                  const isSeeking = c.intent !== 'NOT_RELEVANT';
                  const r = await core.searchListings({
                    cityId: city.id,
                    categoryName: isSeeking ? c.category : null,
                    landmarkName: isSeeking ? c.landmark : null,
                    rawMessage: m,
                    intent: c.intent,
                    name: isSeeking ? c.name : null,
                    requestedBadges: core.extractRequestedBadges ? core.extractRequestedBadges(m) : [],
                    rentalFilters: null,
                    isReplyToPhoto: false,
                    objectType: isSeeking ? c.object_type : null,
                  });
                  const got = r ? 'ANSWER:' + r.listing?.name + ' (+' + (r.totalMatches - 1) + ')' : 'SILENCE';
                  const ok = (expect === 'SILENCE') === !r;
                  console.log('out:' + (ok ? 'PASS' : 'FAIL') + ' | expect=' + expect + ' | got=' + got + ' | ' + c.intent + '/' + c.object_type + '/' + c.category + ' | ' + m);
                }
                await db.\$disconnect();
              })().catch(e=>{console.error('ERR', e.stack); process.exit(1)});
            "
