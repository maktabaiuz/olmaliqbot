name: Analyze production usage (data-driven insights)
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            docker exec kimbor_bot node -e "
              const https = require('https');
              const token = process.env.BOT_TOKEN;
              function call(method, params) {
                return new Promise((resolve) => {
                  const data = JSON.stringify(params);
                  const req = https.request({
                    hostname: 'api.telegram.org',
                    path: '/bot' + token + '/' + method,
                    method: 'POST',
                    headers: { 'content-type': 'application/json', 'content-length': Buffer.byteLength(data) },
                  }, (res) => {
                    let body = '';
                    res.on('data', (c) => body += c);
                    res.on('end', () => resolve(JSON.parse(body)));
                  });
                  req.write(data);
                  req.end();
                });
              }
              (async () => {
                const me = await call('getMe', {});
                const admins = await call('getChatAdministrators', { chat_id: '@Olmaliqlik' });
                console.log('out:ADMINS=' + JSON.stringify(admins.ok ? admins.result.map(a => ({ status: a.status, username: a.user.username })) : admins));
              })();
            "
            echo '--- required_channels row ---'
            docker exec kimbor_api node -e "
              const { db } = require('/app/packages/db/dist/index.js');
              (async () => {
                const rows = await db.requiredChannel.findMany();
                console.log('out:CHANNELS=' + JSON.stringify(rows));
                await db.\$disconnect();
              })();
            "
            echo '--- bot code check ---'
            docker exec kimbor_bot sh -c "find /app/apps/bot/dist -name index.js | xargs grep -o 'passesSubscriptionGate' | head -1 || echo NOT_FOUND"
            echo '--- redis sub_ok cache keys ---'
            docker exec kimbor_redis redis-cli KEYS 'kimbor:sub_ok:*'
