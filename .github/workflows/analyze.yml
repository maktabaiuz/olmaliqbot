name: Analyze production usage (data-driven insights)
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            curl -s -o /dev/null -w 'out:PUBLIC_NOAUTH=%{http_code}\n' https://olmaliq.online/api/public/home
            docker exec kimbor_api node -e "
              const { db } = require('/app/packages/db/dist/index.js');
              (async () => {
                const names = ['santexnik','kamerachi','kafelchi','kalonka ustasi','fayz choyxona','natijnoy patalok','gilam yuvish hizmati'];
                const lms = await db.landmark.findMany({ where: { name: { in: names, mode: 'insensitive' } }, select: { id: true, name: true, latitude: true, primaryListings: { select: { name: true, category: { select: { name: true } } } }, serviceAreaListings: { select: { name: true } } } });
                for (const l of lms) console.log('out:LM|' + l.name + '|lat=' + l.latitude + '|primary=' + l.primaryListings.map(x => x.name + '(' + x.category.name + ')').join(',') + '|areas=' + l.serviceAreaListings.length);
                const gen = await db.landmark.findMany({ where: { OR: [{ name: { contains: 'markaz', mode: 'insensitive' } }, { name: { contains: 'olmaliq', mode: 'insensitive' } }, { name: { contains: 'shahar', mode: 'insensitive' } }] }, select: { name: true } });
                console.log('out:GENERIC=' + gen.map(g => g.name).join(','));
                process.exit(0);
              })().catch(e => { console.error('ERR', e.stack); process.exit(1); });
            "
