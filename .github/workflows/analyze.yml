name: Analyze production usage (data-driven insights)
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            cd /root/kimbor
            # Sessiya kalitini almashtirish (oshkor bo'lgan bo'lishi mumkin) — .env'ga doimiy SESSION_SECRET
            NEW=$(openssl rand -hex 32)
            grep -v '^SESSION_SECRET=' .env > .env.tmp; echo "SESSION_SECRET=$NEW" >> .env.tmp; mv .env.tmp .env
            grep -q 'SESSION_SECRET' docker-compose.prod.yml && echo "out:compose has SESSION_SECRET" || echo "out:compose MISSING SESSION_SECRET"
            docker exec kimbor_api node -e "const {db}=require('/app/packages/db/dist/index.js');db.appSetting.deleteMany({where:{key:'session_secret'}}).then(r=>{console.log('out:old secret removed',r.count);process.exit(0)})"
            # Zaxira skriptini sinab ko'rish
            bash scripts/kimbor-backup.sh 2>&1 | tail -3 | sed 's/^/out:BK /'
            ls -la backups/*.sql.gz 2>/dev/null | tail -2 | sed 's/^/out:  /'
