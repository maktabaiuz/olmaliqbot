name: Analyze production usage (data-driven insights)
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            cd /root/kimbor
            bash scripts/kimbor-backup.sh 2>&1 | grep -E "yaratildi|yaroqsiz" | sed 's/^/out:BK /'
            ls backups/*.sql.gz | tail -1 | grep -q sql.gz || { echo "out:NO BACKUP — ABORT"; exit 1; }
            cat > /tmp/mfy.json <<'JSON'
[{"name": "So‘fi Olloyor MFY", "synonyms": ["so'fi olloyor", "so'fi olloyor mahalla", "so'fi olloyor mahallasi", "sofi olloyor", "sofi olloyor mfy"]}, {"name": "Oltin MFY", "synonyms": ["oltin", "oltin mahalla", "oltin mahallasi", "oltin mfy"]}, {"name": "O‘zbekiston MFY", "synonyms": ["o'zbekiston", "o'zbekiston mahalla", "o'zbekiston mahallasi", "ozbekiston", "ozbekiston mfy"]}, {"name": "Alisher Navoiy MFY", "synonyms": ["alisher navoiy", "alisher navoiy mahalla", "alisher navoiy mahallasi", "alisher navoiy mfy"]}, {"name": "Olmaliqsoy MFY", "synonyms": ["olmaliqsoy", "olmaliqsoy mahalla", "olmaliqsoy mahallasi", "olmaliqsoy mfy"]}, {"name": "Yulduz MFY", "synonyms": ["yulduz", "yulduz mahalla", "yulduz mahallasi", "yulduz mfy"]}, {"name": "Koinot MFY", "synonyms": ["koinot", "koinot mahalla", "koinot mahallasi", "koinot mfy"]}, {"name": "Mahmudxo‘ja Behbudiy MFY", "synonyms": ["mahmudxo'ja behbudiy", "mahmudxo'ja behbudiy mahalla", "mahmudxo'ja behbudiy mahallasi", "mahmudxoja behbudiy", "mahmudxoja behbudiy mfy"]}, {"name": "Mustaqillik MFY", "synonyms": ["mustaqillik", "mustaqillik mahalla", "mustaqillik mahallasi", "mustaqillik mfy"]}, {"name": "Birdamlik MFY", "synonyms": ["birdamlik", "birdamlik mahalla", "birdamlik mahallasi", "birdamlik mfy"]}, {"name": "Mirzo Ulug‘bek MFY", "synonyms": ["mirzo ulug'bek", "mirzo ulug'bek mahalla", "mirzo ulug'bek mahallasi", "mirzo ulugbek", "mirzo ulugbek mfy"]}, {"name": "Saxovat MFY", "synonyms": ["saxovat", "saxovat mahalla", "saxovat mahallasi", "saxovat mfy"]}, {"name": "Kimyogar MFY", "synonyms": ["kimyogar", "kimyogar mahalla", "kimyogar mahallasi", "kimyogar mfy"]}, {"name": "Bo‘ston MFY", "synonyms": ["bo'ston", "bo'ston mahalla", "bo'ston mahallasi", "boston", "boston mfy"]}, {"name": "Oydin MFY", "synonyms": ["oydin", "oydin mahalla", "oydin mahallasi", "oydin mfy"]}, {"name": "Uvaysiy MFY", "synonyms": ["uvaysiy", "uvaysiy mahalla", "uvaysiy mahallasi", "uvaysiy mfy"]}, {"name": "Cho‘lpon MFY", "synonyms": ["cho'lpon", "cho'lpon mahalla", "cho'lpon mahallasi", "cholpon", "cholpon mfy"]}, {"name": "Ko‘rpasoy MFY", "synonyms": ["ko'rpasoy", "ko'rpasoy mahalla", "ko'rpasoy mahallasi", "korpasoy", "korpasoy mfy"]}, {"name": "Metallurg MFY", "synonyms": ["metallurg", "metallurg mahalla", "metallurg mahallasi", "metallurg mfy"]}, {"name": "Shosh-Iloq MFY", "synonyms": ["shosh-iloq", "shosh-iloq mahalla", "shosh-iloq mahallasi", "shosh-iloq mfy"]}, {"name": "Temur Malik MFY", "synonyms": ["temur malik", "temur malik mahalla", "temur malik mahallasi", "temur malik mfy"]}, {"name": "Hilol MFY", "synonyms": ["hilol", "hilol mahalla", "hilol mahallasi", "hilol mfy"]}, {"name": "G‘ofur G‘ulom MFY", "synonyms": ["g'ofur g'ulom", "g'ofur g'ulom mahalla", "g'ofur g'ulom mahallasi", "gofur gulom", "gofur gulom mfy"]}, {"name": "Olmaliqovul MFY", "synonyms": ["olmaliqovul", "olmaliqovul mahalla", "olmaliqovul mahallasi", "olmaliqovul mfy"]}, {"name": "Toshkent MFY", "synonyms": ["toshkent", "toshkent mahalla", "toshkent mahallasi", "toshkent mfy"]}, {"name": "Abdulla Qahhor MFY", "synonyms": ["abdulla qahhor", "abdulla qahhor mahalla", "abdulla qahhor mahallasi", "abdulla qahhor mfy"]}, {"name": "Yangi Hayot MFY", "synonyms": ["yangi hayot", "yangi hayot mahalla", "yangi hayot mahallasi", "yangi hayot mfy"]}, {"name": "Usmon Nosir MFY", "synonyms": ["usmon nosir", "usmon nosir mahalla", "usmon nosir mahallasi", "usmon nosir mfy"]}, {"name": "Abdulla Qodiriy MFY", "synonyms": ["abdulla qodiriy", "abdulla qodiriy mahalla", "abdulla qodiriy mahallasi", "abdulla qodiriy mfy"]}, {"name": "Namuna MFY", "synonyms": ["namuna", "namuna mahalla", "namuna mahallasi", "namuna mfy"]}, {"name": "Hamza MFY", "synonyms": ["hamza", "hamza mahalla", "hamza mahallasi", "hamza mfy"]}, {"name": "Abdulla Avloniy MFY", "synonyms": ["abdulla avloniy", "abdulla avloniy mahalla", "abdulla avloniy mahallasi", "abdulla avloniy mfy"]}, {"name": "Ibn Sino MFY", "synonyms": ["ibn sino", "ibn sino mahalla", "ibn sino mahallasi", "ibn sino mfy"]}, {"name": "Islom Karimov MFY", "synonyms": ["islom karimov", "islom karimov mahalla", "islom karimov mahallasi", "islom karimov mfy"]}, {"name": "Terakli MFY", "synonyms": ["terakli", "terakli mahalla", "terakli mahallasi", "terakli mfy"]}, {"name": "Muso Jalil MFY", "synonyms": ["muso jalil", "muso jalil mahalla", "muso jalil mahallasi", "muso jalil mfy"]}, {"name": "Ahmad Yassaviy MFY", "synonyms": ["ahmad yassaviy", "ahmad yassaviy mahalla", "ahmad yassaviy mahallasi", "ahmad yassaviy mfy"]}, {"name": "Furqat MFY", "synonyms": ["furqat", "furqat mahalla", "furqat mahallasi", "furqat mfy"]}, {"name": "Chambil MFY", "synonyms": ["chambil", "chambil mahalla", "chambil mahallasi", "chambil mfy"]}, {"name": "Tinchlik MFY", "synonyms": ["tinchlik", "tinchlik mahalla", "tinchlik mahallasi", "tinchlik mfy"]}, {"name": "Navro‘z MFY", "synonyms": ["navro'z", "navro'z mahalla", "navro'z mahallasi", "navroz", "navroz mfy"]}, {"name": "Zarbuloq MFY", "synonyms": ["zarbuloq", "zarbuloq mahalla", "zarbuloq mahallasi", "zarbuloq mfy"]}]
