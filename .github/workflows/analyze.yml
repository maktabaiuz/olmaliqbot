name: Analyze production usage (data-driven insights)
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            docker exec kimbor_bot node -e "
              const https = require('https');
              const token = process.env.BOT_TOKEN;
              function call(method, params) {
                return new Promise((resolve) => {
                  const data = JSON.stringify(params);
                  const req = https.request({ hostname: 'api.telegram.org', path: '/bot' + token + '/' + method, method: 'POST', headers: { 'content-type': 'application/json', 'content-length': Buffer.byteLength(data) } }, (res) => {
                    let body = ''; res.on('data', c => body += c); res.on('end', () => resolve(JSON.parse(body)));
                  });
                  req.write(data); req.end();
                });
              }
              (async () => {
                const me = await call('getMe', {});
                const groupIds = ['-1003196202156','-1002421893642','-1004480934800','-1001450628134','-1001647665739'];
                for (const gid of groupIds) {
                  const m = await call('getChatMember', { chat_id: gid, user_id: me.result.id });
                  console.log('out:' + gid + '=' + JSON.stringify(m.ok ? { status: m.result.status } : m));
                }
              })();
            "
