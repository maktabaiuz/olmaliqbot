name: Analyze production usage (data-driven insights)
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 30m
          script: |
            docker exec kimbor_api node -e "
              const { db } = require('/app/packages/db/dist/index.js');
              const core = require('/app/packages/core/dist/index.js');
              (async () => {
                const city = await db.city.findFirst();
                const r = await core.cleanupRiskyTerms(city.id, false); console.log('out:PROF=' + JSON.stringify(r.professionNamedLandmarks)); for (const c of r.changes) console.log('out:C|' + c.kind + '|' + c.target + '|' + c.removed.join(' ; '));
                process.exit(0);
              })().catch(e => { console.error('ERR', e.stack); process.exit(1); });
            "
