name: Analyze production usage (data-driven insights)
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            echo "--- webhook allowed_updates ---"
            docker exec kimbor_bot node -e "
              const https = require('https');
              const token = process.env.BOT_TOKEN;
              https.get('https://api.telegram.org/bot' + token + '/getWebhookInfo', (res) => {
                let body=''; res.on('data', c=>body+=c); res.on('end', () => console.log('out:WEBHOOK=' + body));
              });
            "
            sleep 2
            echo "--- new tables + USEFUL_BOTS ---"
            docker exec kimbor_api node -e "
              const { db } = require('/app/packages/db/dist/index.js');
              const core = require('/app/packages/core/dist/index.js');
              (async () => {
                const linkCount = await db.groupInviteLink.count();
                const progressCount = await db.groupInviteProgress.count();
                console.log('out:TABLES=' + JSON.stringify({ linkCount, progressCount }));
                const keys = core.USEFUL_BOTS.map(b => b.key);
                console.log('out:USEFUL_BOTS_KEYS=' + JSON.stringify(keys));
                await db.\$disconnect();
              })();
            "
