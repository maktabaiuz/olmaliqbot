            docker cp /tmp/mfy.json kimbor_api:/tmp/mfy.json
            docker exec kimbor_api node -e "
              const { db } = require('/app/packages/db/dist/index.js');
              const mfy = require('/tmp/mfy.json');
              (async () => {
                const city = await db.city.findFirst({ where: { slug: 'olmaliq' } });
                const before = await db.landmark.count({ where: { cityId: city.id } });
                await db.\$transaction(async (tx) => {
                  const keep = await tx.landmark.create({ data: { cityId: city.id, name: 'MFY tanlanmagan', synonyms: [] } });
                  const created = [];
                  for (const m of mfy) created.push((await tx.landmark.create({ data: { cityId: city.id, name: m.name, synonyms: m.synonyms } })).id);
                  const newIds = [keep.id, ...created];
                  await tx.listing.updateMany({ where: { cityId: city.id }, data: { primaryLandmarkId: keep.id } });
                  const ls = await tx.listing.findMany({ where: { cityId: city.id }, select: { id: true } });
                  for (const l of ls) await tx.listing.update({ where: { id: l.id }, data: { serviceAreaLandmarks: { set: [] } } });
                  await tx.candidate.updateMany({ where: { cityId: city.id }, data: { primaryLandmarkId: null } });
                  const del = await tx.landmark.deleteMany({ where: { cityId: city.id, id: { notIn: newIds } } });
                  console.log('out:deleted old=' + del.count + ' created=' + created.length + ' listings moved=' + ls.length);
                }, { timeout: 60000 });
                await db.auditLog.create({ data: { cityId: city.id, action: 'LANDMARKS_REPLACED_WITH_MFY', details: { before, mfy: mfy.length } } });
                console.log('out:now=' + await db.landmark.count({ where: { cityId: city.id } }));
                process.exit(0);
              })().catch(e => { console.error('ERR', e.message); process.exit(1); });
            "
