name: Analyze production usage (data-driven insights)
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            docker exec kimbor_api node -e "
              const { db } = require('/app/packages/db/dist/index.js');
              const core = require('/app/packages/core/dist/index.js');
              (async () => {
                const city = await db.city.findFirst();
                const m = 'Assalom aleykum akalar toy tepa pavarodi ochiqmikan othanlar bormi';
                const c = await core.classifyQuery(m, city.id);
                console.log('out:CLS=' + JSON.stringify(c));
                const r = await core.searchListings({ cityId: city.id, categoryName: c.category, landmarkName: c.landmark, rawMessage: m, intent: c.intent, name: c.name, requestedBadges: [], rentalFilters: null, objectType: c.object_type, debug: true });
                console.log('out:RES=' + JSON.stringify(r ? { name: r.listing.name, verifiedBy: r.verifiedBy, b: r.scoreBreakdown.map(x => ({ n: x.name, phrase: x.matchedJargonPhrase, st: x.jargonStrength, jb: x.jargonBonus, djb: x.directJargonBonus })) } : null));
                await new Promise(r => setTimeout(r, 6000));
                const t0 = Date.now();
                const v = await core.verifyAnswerRelevance({ message: m, listingName: 'Oqtepa lavash', categoryName: 'Fast Food', matchedPhrase: 'oq tepa' });
                console.log('out:VERIFY=' + v + ' ms=' + (Date.now() - t0));
                process.exit(0);
              })().catch(e => { console.error('ERR', e.stack); process.exit(1); });
            "
