name: Analyze production usage (data-driven insights)
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            docker exec kimbor_api sh -c "grep -o 'broadcast-instant' /app/apps/api/dist/routes/adminRoutes.js | head -1 || echo NOT_FOUND"
            echo '--- direct DB check (bypassing HTTP auth) ---'
            docker exec kimbor_api node -e "
              const { db } = require('/app/packages/db/dist/index.js');
              (async () => {
                const city = await db.city.findFirst();
                const userCount = await db.user.count({ where: { cityId: city.id } });
                const groupCount = await db.cityGroup.count({ where: { cityId: city.id } });
                console.log('out:AUDIENCE=' + JSON.stringify({ userCount, groupCount }));
                await db.\$disconnect();
              })();
            "
