name: Analyze production usage (data-driven insights)
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            docker exec kimbor_api node -e "
              const { db } = require('/app/packages/db/dist/index.js');
              const core = require('/app/packages/core/dist/index.js');
              const cases = [
                ['SILENCE', 'Assalom aleykum akalar toy tepa pavarodi ochiqmikan othanlar bormi'],
                ['SILENCE', 'qiziltepa tomonga yol ochiqmi'],
                ['Oqtepa', 'oqtepa lavash nomeri kerak'],
                ['Oqtepa', 'oq tepa lavashni nomeri kerak'],
                ['Oqtepa', 'oqtepadagi lavash ochiqmi'],
                ['N1', 'n1 choyxona nomeri kerak'],
                ['Gagarin', 'Gagarin choyxona nomeri bormi'],
                ['ANY', 'santexnik kerak'],
                ['ANY', 'beshbirdagi zaprafka ochiqmi'],
                ['ANY', 'balon kerak'],
              ];
              (async () => {
                const city = await db.city.findFirst();
                for (const [exp, m] of cases) {
                  const c = await core.classifyQuery(m, city.id, undefined, process.env.GEMINI_API_KEY);
                  const s = c.intent !== 'NOT_RELEVANT';
                  const r = await core.searchListings({ cityId: city.id, categoryName: s ? c.category : null, landmarkName: s ? c.landmark : null, rawMessage: m, intent: c.intent, name: s ? c.name : null, requestedBadges: [], rentalFilters: null, objectType: s ? c.object_type : null });
                  const got = r ? r.listing?.name : 'SILENCE';
                  const ok = exp === 'ANY' ? !!r : exp === 'SILENCE' ? !r : !!r && got.toLowerCase().includes(exp.toLowerCase());
                  console.log('out:' + (ok ? 'PASS' : 'FAIL') + ' | expect=' + exp + ' | got=' + got + ' | ' + m);
                }
                process.exit(0);
              })().catch(e => { console.error('ERR', e.stack); process.exit(1); });
            "
