name: Analyze production usage (data-driven insights)
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Run analysis via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 90s
          command_timeout: 10m
          script: |
            docker exec kimbor_api node -e "
              const { db } = require('/app/packages/db/dist/index.js');
              (async () => {
                const rows = await db.emergencyNumber.findMany({ select: { key: true, label: true, jargonWords: true } });
                console.log('out:DISPATCHER=' + JSON.stringify(rows));
                process.exit(0);
              })().catch(e => { console.error('ERR', e.message); process.exit(1); });
            "
