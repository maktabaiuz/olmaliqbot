name: Analyze production usage (data-driven insights)
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            docker ps --format '{{.Names}}: {{.Status}}' | grep kimbor | sed 's/^/out:PS /'
            docker logs --since 6h kimbor_bot 2>&1 | grep -iE "error|fail|❌" | tail -8 | sed 's/^/out:LOG /'
            docker exec kimbor_api node -e "
              const { db } = require('/app/packages/db/dist/index.js');
              const core = require('/app/packages/core/dist/index.js');
              (async () => {
                const city = await db.city.findFirst({ where: { slug: 'olmaliq' } });
                const ls = await db.listing.findMany({ where: { OR: [{ name: { contains: 'avto', mode: 'insensitive' } }, { name: { contains: 'maktab', mode: 'insensitive' } }, { category: { name: { contains: 'maktab', mode: 'insensitive' } } }, { category: { name: { contains: 'avto', mode: 'insensitive' } } }] }, select: { name: true, status: true, cityId: true, jargonSynonyms: true, createdAt: true, category: { select: { name: true, synonyms: true, objectType: true } } }, orderBy: { createdAt: 'desc' }, take: 8 });
                console.log('out:LIST=' + JSON.stringify(ls.map(l => ({ ...l, sameCity: l.cityId === city.id, cityId: undefined }))));
                for (const m of ['avto maktab kerak', 'avtomaktab bormi', 'haydovchilik guvohnomasi olish uchun avtomaktab', 'prava olish kerak']) {
                  const c = await core.classifyQuery(m, city.id, undefined, undefined, { noCache: true });
                  const r = await core.searchListings({ ...core.buildSearchParams(city.id, m, c), debug: true });
                  console.log('out:Q|' + m + '|cls=' + JSON.stringify({ i: c.intent, cat: c.category, ot: c.object_type, src: c.source }) + '|res=' + (r ? r.listing.name + ' v=' + r.verifiedBy : 'NULL'));
                  await new Promise(x => setTimeout(x, 5000));
                }
                const wh = await fetch('https://api.telegram.org/bot' + process.env.BOT_TOKEN + '/getWebhookInfo').then(r => r.json());
                console.log('out:WH=' + JSON.stringify({ url: !!wh.result.url, pending: wh.result.pending_update_count, err: wh.result.last_error_message || null }));
                process.exit(0);
              })().catch(e => { console.error('ERR', e.stack); process.exit(1); });
            "
