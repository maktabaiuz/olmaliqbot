name: Analyze production usage (data-driven insights)
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            docker exec kimbor_api node -e "
              const { db } = require('/app/packages/db/dist/index.js');
              (async () => {
                const t = await db.groupFeatureToggle.findMany({ where: { featureKey: 'MANDATORY_INVITE' }, select: { isEnabled: true, requiredCount: true, linkLabel: true, linkButtonStyle: true, cityGroup: { select: { title: true } } } });
                console.log('out:TOGGLES=' + JSON.stringify(t));
                const l = await db.groupInviteLink.findMany({ select: { inviteLink: true, createdAt: true } });
                console.log('out:LINKS=' + JSON.stringify(l.map(x => ({ prefix: x.inviteLink.slice(0, 22), createdAt: x.createdAt }))));
                process.exit(0);
              })();
            "
            docker logs --since 6h kimbor_bot 2>&1 | grep -i "taklif\|invite" | tail -10
