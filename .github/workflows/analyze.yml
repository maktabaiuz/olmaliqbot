name: Analyze production usage (data-driven insights)
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            echo "--- webapp bundle check ---"
            docker exec kimbor_webapp sh -c "grep -l 'Majburiy obuna' /usr/share/nginx/html/assets/*.js 2>/dev/null || echo NOT_FOUND" || true
            echo "--- required channels in DB ---"
            docker exec kimbor_api node -e "
              const { db } = require('/app/packages/db/dist/index.js');
              (async () => {
                const rows = await db.requiredChannel.findMany();
                console.log('out:CHANNELS=' + JSON.stringify(rows));
                await db.\$disconnect();
              })();
            "
            echo "--- bot container has subscription code ---"
            docker exec kimbor_bot sh -c "grep -o 'passesSubscriptionGate' dist/index.js | head -1 || echo NOT_FOUND"
