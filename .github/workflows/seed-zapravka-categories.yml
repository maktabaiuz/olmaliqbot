name: One-off - seed zapravka categories

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Seed via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const db = new PrismaClient();
            (async () => {
              const existing = await db.category.findMany({ where: { objectType: 'ZAPRAVKA' } });
              console.log('EXISTING_BEFORE:', JSON.stringify(existing.map(c => c.name)));

              const cats = [
                {
                  name: 'Avtomobil zapravkasi',
                  synonyms: ['zapravka', 'benzin quyish', 'yoqilgi quyish shoxobchasi', 'azs', 'gaz quyish', 'metan quyish', 'propan quyish', 'zapravochnaya', 'yonilgi quyish', 'benzokolonka', 'заправка', 'азс', 'бензоколонка'],
                  objectType: 'ZAPRAVKA',
                  group: 'Avtomobil xizmatlari',
                  emoji: '⛽',
                },
                {
                  name: 'Elektr zaryadlash shoxobchasi',
                  synonyms: ['zaryadlash stansiyasi', 'elektromobil zaryadlash', 'zaryadka', 'elektro zapravka', 'zaryad stansiyasi', 'elektromobil zaryadkasi', 'зарядная станция', 'зарядка электромобиля'],
                  objectType: 'ZAPRAVKA',
                  group: 'Avtomobil xizmatlari',
                  emoji: '🔌',
                },
              ];

              for (const c of cats) {
                const r = await db.category.upsert({
                  where: { name: c.name },
                  update: { synonyms: c.synonyms, objectType: c.objectType, group: c.group, emoji: c.emoji },
                  create: c,
                });
                console.log('UPSERTED:', r.name, r.objectType, r.id);
              }

              const after = await db.category.findMany({ where: { objectType: 'ZAPRAVKA' } });
              console.log('EXISTING_AFTER:', JSON.stringify(after.map(c => c.name)));
              await db.\$disconnect();
            })().catch(e => { console.error('SEED_ERROR:', e); process.exit(1); });
            "
