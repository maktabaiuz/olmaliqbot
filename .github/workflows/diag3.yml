name: One-off - investigate unresolved queries pattern
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Investigate via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 90s
          command_timeout: 10m
          script: |
            docker exec kimbor_api node -e "
              const crypto = require('crypto');
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();
              const j = (o) => JSON.stringify(o, (k,v) => typeof v === 'bigint' ? v.toString() : v);
              function buildInitData(telegramId) {
                const botToken = process.env.BOT_TOKEN;
                const user = JSON.stringify({ id: telegramId, first_name: 'Test', last_name: 'Admin' });
                const params = { auth_date: Math.floor(Date.now()/1000).toString(), user };
                const paramsArray = Object.entries(params).sort((a,b)=>a[0].localeCompare(b[0]));
                const dataCheckString = paramsArray.map(([k,v])=>k+'='+v).join('\\n');
                const secretKey = crypto.createHmac('sha256','WebAppData').update(botToken).digest();
                const hash = crypto.createHmac('sha256', secretKey).update(dataCheckString).digest('hex');
                const usp = new URLSearchParams(params);
                usp.set('hash', hash);
                return usp.toString();
              }
              (async () => {
                // 1) akkumulyator/Delcor bazada bormi?
                const accCats = await db.category.findMany({ where: { OR: [ { name: { contains: 'akkum', mode: 'insensitive' } }, { synonyms: { has: 'akkumulyator' } } ] }, select: { name: true, synonyms: true } });
                console.log('out:ACC_CATEGORIES ' + j(accCats));
                const delcorListings = await db.listing.findMany({ where: { OR: [ { name: { contains: 'delcor', mode: 'insensitive' } }, { jargonSynonyms: { has: 'delcor' } }, { specificServices: { contains: 'delcor', mode: 'insensitive' } } ] }, select: { name: true, jargonSynonyms: true, category: { select: { name: true } } } });
                console.log('out:DELCOR_LISTINGS ' + j(delcorListings));

                // 2) shu guruhdagi so'nggi 48 soatlik UNRESOLVED so'rovlar (haqiqiy so'rov ko'rinishidagilar)
                const since = new Date(Date.now() - 48*60*60*1000);
                const group = await db.cityGroup.findFirst({ orderBy: { createdAt: 'asc' } });
                const unresolved = await db.queryLog.findMany({
                  where: { chatId: group.chatId, createdAt: { gte: since }, isResolved: false, intent: { not: 'NOT_RELEVANT' } },
                  orderBy: { createdAt: 'desc' }, take: 30,
                  select: { rawMessage: true, intent: true, categoryName: true, landmarkName: true, confidence: true, createdAt: true }
                });
                console.log('out:UNRESOLVED_REAL_COUNT=' + unresolved.length);
                for (const u of unresolved) console.log('out:UNRESOLVED ' + j(u));

                // 3) shu guruh uchun umumiy hisob (48 soat)
                const totalReal = await db.queryLog.count({ where: { chatId: group.chatId, createdAt: { gte: since }, intent: { not: 'NOT_RELEVANT' } } });
                const resolvedReal = await db.queryLog.count({ where: { chatId: group.chatId, createdAt: { gte: since }, intent: { not: 'NOT_RELEVANT' }, isResolved: true } });
                console.log('out:TOTAL_REAL_48H=' + totalReal + ' RESOLVED_REAL_48H=' + resolvedReal);

                // 4) Simulyator orqali aynan shu real xabarni qayta sinaymiz
                const superAdmin = await db.user.findFirst({ where: { role: 'SUPER_ADMIN' } });
                const headers = { 'x-init-data': buildInitData(superAdmin.telegramId.toString()), 'Content-Type': 'application/json' };
                const testMsg = 'Delcor akkumulyatorlar narxi qancha bolyapti xabari borlar bormi';
                const r = await fetch('http://localhost:4000/api/admin/simulate', { method: 'POST', headers, body: JSON.stringify({ message: testMsg }) });
                const d = await r.json();
                console.log('out:SIM ' + j(d));

                await db.\$disconnect();
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "
