name: One-off - Deploy negation + mashina-synonym fix and verify
on:
  workflow_dispatch:
jobs:
  deploy_and_verify:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy and verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 90s
          command_timeout: 15m
          script: |
            cd /root/kimbor
            git pull origin main || git pull origin master
            git log -1 --oneline
            docker compose -f docker-compose.prod.yml up -d --build
            sleep 20
            docker exec kimbor_api grep -c "containsAffirmedWholeWord" /app/packages/core/dist/dictionary/dictionary.js
            docker exec kimbor_api node -e "
              const { matchCategoryFromText } = require('/app/packages/core/dist/dictionary/dictionary.js');
              const { normalizeText } = require('/app/packages/core/dist/transliteration/index.js');

              function test(label, msg) {
                const r = matchCategoryFromText(normalizeText(msg));
                console.log(label + ':', JSON.stringify(r));
              }

              console.log('=== A) THE REAL BUG MESSAGE: rental request with taxi negation ===');
              test('rental-not-taxi', \"Асалому алайкум арендага йенгил мошина керак еди узок муддатга узим агмкадан ишлиман мошинага акуратний караб йураман босиб такси килишга емас кимда боса айтворила илтимос\");

              console.log('');
              console.log('=== B) Genuine taxi requests must STILL work ===');
              test('genuine-taxi-1', 'taksi kerak zudlik bilan');
              test('genuine-taxi-2', 'такси керак шошилинч');
              test('genuine-taxi-3', \"yo'lovchi tashish kerak Toshkentgacha\");

              console.log('');
              console.log('=== C) Genuine car-rental requests must resolve correctly (not to Taksi) ===');
              test('rental-1', 'mashina arendaga kerak uzoq muddatga');
              test('rental-2', 'avtomobil ijarasi bormi');

              console.log('');
              console.log('=== D) Bare car mention alone (sale/repair context) must NOT force Taksi anymore ===');
              test('bare-car-sale', 'mashina sotiladi yaxshi holatda');
            "
