name: One-off - check passwordHash format for legacy plaintext values

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 3m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const db = new PrismaClient();
            (async () => {
              const users = await db.user.findMany({
                where: { passwordHash: { not: null } },
                select: { id: true, role: true, passwordHash: true, isPasswordSet: true },
              });
              console.log('TOTAL_WITH_HASH:', users.length);
              for (const u of users) {
                const isPbkdf2Format = /^[0-9a-f]{128}$/.test(u.passwordHash || '');
                console.log(JSON.stringify({ id: u.id, role: u.role, isPasswordSet: u.isPasswordSet, hashLength: (u.passwordHash || '').length, looksLikePbkdf2: isPbkdf2Format }));
              }
              await db.\$disconnect();
              process.exit(0);
            })().catch(e => { console.error('AUDIT_ERROR:', e); process.exit(1); });
            "
