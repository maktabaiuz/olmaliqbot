name: One-off - verify fartuna fix + full regression

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 3m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const core = require('/app/packages/core/dist/index.js');
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const { classifyQuery } = require('/app/apps/bot/dist/filter/aiClassifier.js');
            const db = new PrismaClient();
            (async () => {
              const gondra = await db.listing.findFirst({ where: { name: { contains: 'Gondra', mode: 'insensitive' } } });
              const cityId = gondra.cityId;

              async function run(label, q, userId) {
                const c = await classifyQuery(q, cityId, BigInt(userId));
                const isSeeking = c.intent !== 'NOT_RELEVANT';
                const sr = await core.searchListings({
                  cityId,
                  categoryName: isSeeking ? c.category : null,
                  landmarkName: isSeeking ? c.landmark : null,
                  rawMessage: q,
                });
                console.log(label, '| category:', c.category, '| MATCHED:', sr ? sr.listing.name.trim() : 'NONE (jim)');
              }

              console.log('--- YANGI TUZATISH: fartuna 5 marta, hech qachon aloqasiz yozuv chiqmasligi kerak ---');
              for (let i = 0; i < 5; i++) {
                await run('FARTUNA_' + i, 'Akalar fartunani nomeri bormi ' + i, 8000000 + i);
              }

              console.log('--- REGRESSIYA: haqiqiy yozilish xatosi hali togri tuzatilishi kerak ---');
              await run('AVTOELEKTIRIK_TYPO', 'avtoelektirik kerak', 8000010);

              console.log('--- REGRESSIYA: avvalgi tuzatishlar hali togri ishlashi kerak ---');
              await run('TOY_TEPA', 'toy tepa pavarot zaprafka ishlayaptimi', 8000011);
              await run('YAQIN_ATROF', 'yaqin atrofda zaprafka bormi', 8000012);
              await run('BESHBIR', 'Beshbirdagi zaprafka ochiqmi', 8000013);
              await run('DESKA', 'deska zaprafka ochiqmi', 8000014);
              await run('GONDRA', 'gondra zaprafka ochiqmi', 8000015);
              await run('BALON', 'balon kerak qata bor', 8000016);

              await db.\$disconnect();
              process.exit(0);
            })().catch(e => { console.error('VERIFY_ERROR:', e); process.exit(1); });
            "
