name: One-off - count groups
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Count via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 90s
          command_timeout: 5m
          script: |
            docker exec kimbor_bot node -e "
              const { db } = require('/app/packages/db/dist/index.js');
              (async () => {
                const n = await db.cityGroup.count();
                console.log('GROUP_COUNT=' + n);
                await db.\$disconnect();
              })();
            "
