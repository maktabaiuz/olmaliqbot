name: One-off - Verify /admin/users telegramId search fix

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();
              (async () => {
                const search = '8431499717';
                const whereClause = { OR: [
                  { firstName: { contains: search, mode: 'insensitive' } },
                  { lastName: { contains: search, mode: 'insensitive' } },
                  { username: { contains: search, mode: 'insensitive' } },
                  { phoneNumber: { contains: search, mode: 'insensitive' } },
                ]};
                if (/^\\d+\$/.test(search)) {
                  try { whereClause.OR.push({ telegramId: BigInt(search) }); } catch {}
                }
                const found = await db.user.findMany({ where: whereClause, select: { telegramId: true, firstName: true, createdAt: true } });
                console.log('Search result count:', found.length, JSON.stringify(found.map(u => ({ telegramId: u.telegramId.toString(), firstName: u.firstName, createdAt: u.createdAt }))));
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "
