name: One-off - verify deep Guruhlar analytics
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 90s
          command_timeout: 5m
          script: |
            echo "=== container status ==="
            docker ps -a --format '{{.Names}}: {{.Status}}' | grep kimbor
            echo "=== bot logs tail (checking for crash) ==="
            docker logs --tail 40 kimbor_bot 2>&1
            echo "=== api logs tail (checking for crash) ==="
            docker logs --tail 20 kimbor_api 2>&1
            echo "=== db push confirms new tables ==="
            docker exec kimbor_api node -e "
              const crypto = require('crypto');
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();
              function buildInitData(telegramId) {
                const botToken = process.env.BOT_TOKEN;
                const user = JSON.stringify({ id: telegramId, first_name: 'Test', last_name: 'Admin' });
                const params = { auth_date: Math.floor(Date.now()/1000).toString(), user };
                const paramsArray = Object.entries(params).sort((a,b)=>a[0].localeCompare(b[0]));
                const dataCheckString = paramsArray.map(([k,v])=>k+'='+v).join('\\n');
                const secretKey = crypto.createHmac('sha256','WebAppData').update(botToken).digest();
                const hash = crypto.createHmac('sha256', secretKey).update(dataCheckString).digest('hex');
                const usp = new URLSearchParams(params);
                usp.set('hash', hash);
                return usp.toString();
              }
              (async () => {
                const evCount = await db.groupMessageEvent.count();
                console.log('out:GROUP_MESSAGE_EVENT_COUNT=' + evCount);
                const snapCount = await db.groupMemberSnapshot.count();
                console.log('out:MEMBER_SNAPSHOT_COUNT=' + snapCount);

                const superAdmin = await db.user.findFirst({ where: { role: 'SUPER_ADMIN' } });
                const headers = { 'x-init-data': buildInitData(superAdmin.telegramId.toString()), 'Content-Type': 'application/json' };
                const groups = await (await fetch('http://localhost:4000/api/admin/groups', { headers })).json();
                console.log('out:GROUPS ' + JSON.stringify(groups.map(g => ({title: g.title, todayQueries: g.todayQueries}))));
                if (groups.length > 0) {
                  const r = await fetch('http://localhost:4000/api/admin/groups/' + groups[0].id + '?days=7', { headers });
                  const status = r.status;
                  const detail = await r.json();
                  console.log('out:STATUS=' + status);
                  console.log('out:HEALTH_SCORE=' + detail.healthScore);
                  console.log('out:ACTIVITY ' + JSON.stringify(detail.activity));
                  console.log('out:TOP_ACTIVE_USERS ' + JSON.stringify(detail.topActiveUsers));
                  console.log('out:MEMBER_TREND ' + JSON.stringify(detail.memberTrend));
                  console.log('out:CATEGORY_DEMAND ' + JSON.stringify(detail.categoryDemand));
                  console.log('out:LANDMARK_DIST ' + JSON.stringify(detail.landmarkDistribution));
                  console.log('out:BENCHMARK ' + JSON.stringify(detail.benchmark));
                  console.log('out:LOYAL_USERS ' + JSON.stringify(detail.loyalUsers));
                  console.log('out:LANGUAGE ' + JSON.stringify(detail.languageDistribution));
                  console.log('out:JOIN_CONVERSION ' + JSON.stringify(detail.joinConversion));
                  console.log('out:RESPONSE_TIME ' + JSON.stringify(detail.responseTime));
                  console.log('out:TOP_MISSING_NAMED ' + JSON.stringify(detail.topMissingNamed));
                }
                await db.\$disconnect();
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "
