name: One-off - verify word-level jargon fix

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 3m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const core = require('/app/packages/core/dist/index.js');
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const { classifyQuery } = require('/app/apps/bot/dist/filter/aiClassifier.js');
            const db = new PrismaClient();
            (async () => {
              const gondra = await db.listing.findFirst({ where: { name: { contains: 'Gondra', mode: 'insensitive' } } });
              const cityId = gondra.cityId;

              console.log('--- Beshbirdagi zaprafka ochiqmi (10 marta, barqarorlikni tekshirish) ---');
              const results = [];
              for (let i = 0; i < 10; i++) {
                const q = 'Beshbirdagi zaprafka ochiqmi';
                const c = await classifyQuery(q + ' ' + i, cityId, BigInt(2000000 + i));
                const isSeeking = c.intent !== 'NOT_RELEVANT';
                const sr = await core.searchListings({
                  cityId,
                  categoryName: isSeeking ? c.category : null,
                  landmarkName: isSeeking ? c.landmark : null,
                  rawMessage: q,
                });
                const name = sr ? sr.listing.name.trim() : 'NONE';
                results.push(name);
                console.log('RUN', i, 'landmark:', c.landmark, '-> MATCHED:', name);
              }
              const allCarvon = results.every(r => r === 'CARVON');
              console.log('ALL_10_MATCHED_CARVON:', allCarvon);

              console.log('--- boshqa zaprafkalar hali togri ishlaydimi ---');
              const sanityQueries = ['deska zaprafka ochiqmi', 'gondra zaprafka ochiqmi'];
              for (const q of sanityQueries) {
                const c = await classifyQuery(q, cityId, BigInt(3000000));
                const isSeeking = c.intent !== 'NOT_RELEVANT';
                const sr = await core.searchListings({
                  cityId,
                  categoryName: isSeeking ? c.category : null,
                  landmarkName: isSeeking ? c.landmark : null,
                  rawMessage: q,
                });
                console.log('QUERY:', JSON.stringify(q), '-> MATCHED:', sr ? sr.listing.name.trim() : 'NONE');
              }

              await db.\$disconnect();
              process.exit(0);
            })().catch(e => { console.error('VERIFY_ERROR:', e); process.exit(1); });
            "
