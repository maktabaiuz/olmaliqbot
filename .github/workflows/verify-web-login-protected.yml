name: One-off - Verify web-login against a write-protected endpoint

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Setup test user via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const crypto = require('crypto');
              const db = new PrismaClient();
              function hashPassword(password) {
                const salt = process.env.PASSWORD_SALT || 'kimbor_hyperlocal_secure_salt_2026';
                return crypto.pbkdf2Sync(password, salt, 10000, 64, 'sha512').toString('hex');
              }
              (async () => {
                const city = await db.city.findFirst();
                const testTelegramId = BigInt('999999999901');
                await db.user.upsert({
                  where: { telegramId: testTelegramId },
                  update: { role: 'CITY_ADMIN', isSuspended: false, cityId: city.id, passwordHash: hashPassword('TestWebLogin123'), isPasswordSet: true, loginUsername: 'weblogintest' },
                  create: { telegramId: testTelegramId, firstName: 'WebLoginTest', role: 'CITY_ADMIN', cityId: city.id, passwordHash: hashPassword('TestWebLogin123'), isPasswordSet: true, loginUsername: 'weblogintest' },
                });
                console.log('TEST_USER_READY');
              })().catch(e=>{console.error(e); process.exit(1)}).finally(()=>db.\$disconnect());
            "

      - name: Test against write-protected endpoint
        run: |
          echo "=== A) POST /admin/categories WITHOUT auth (expect 401) ==="
          curl -s -X POST https://olmaliq.online/api/admin/categories \
            -H "Content-Type: application/json" \
            -d '{"name":"ShouldNotBeCreated"}' -w "\nHTTP:%{http_code}\n"

          echo ""
          echo "=== B) Login via web-login ==="
          curl -s -c /tmp/cookies.txt -X POST https://olmaliq.online/api/auth/web-login \
            -H "Content-Type: application/json" \
            -d '{"loginUsername":"weblogintest","password":"TestWebLogin123"}' -w "\nHTTP:%{http_code}\n"

          echo ""
          echo "=== C) POST /admin/categories WITH cookie only (no x-init-data) — should succeed and create a real (test) row ==="
          curl -s -b /tmp/cookies.txt -X POST https://olmaliq.online/api/admin/categories \
            -H "Content-Type: application/json" \
            -d '{"name":"ZZZ_TEST_WEBLOGIN_VERIFY","objectType":"USTA"}' -w "\nHTTP:%{http_code}\n"

      - name: Restore setting + cleanup via SSH
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();
              (async () => {
                const deletedCat = await db.category.deleteMany({ where: { name: 'ZZZ_TEST_WEBLOGIN_VERIFY' } });
                console.log('Deleted test categories:', deletedCat.count);
                await db.loginAttempt.deleteMany({ where: { telegramId: BigInt('999999999901') } });
                await db.user.deleteMany({ where: { telegramId: BigInt('999999999901') } });
                console.log('TEST_USER_CLEANED');
              })().catch(e=>{console.error(e); process.exit(1)}).finally(()=>db.\$disconnect());
            "
