name: One-off - Investigate Qoraxitoy and Gorset missing bot replies

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Investigate via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 90s
          command_timeout: 10m
          script: |
            echo '=== 1) Search for Qoraxitoy/Qaroqtoy choyxona in listings ==='
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();
              (async () => {
                const listings = await db.listing.findMany({
                  where: { OR: [
                    { name: { contains: 'oyxona', mode: 'insensitive' } },
                    { name: { contains: 'oraxitoy', mode: 'insensitive' } },
                    { name: { contains: 'aroqtoy', mode: 'insensitive' } },
                  ] },
                  select: { id: true, name: true, phone: true, jargonSynonyms: true, status: true, category: { select: { name: true } } },
                });
                console.log(JSON.stringify(listings, null, 2));
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "

            echo ''
            echo '=== 2) Current EmergencyNumber entries (core + custom) with jargon ==='
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();
              (async () => {
                const rows = await db.emergencyNumber.findMany({ select: { key: true, label: true, phoneNumber: true, jargonWords: true } });
                console.log(JSON.stringify(rows, null, 2));
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "

            echo ''
            echo '=== 3) Test findLocalDispatcherMatch with the EXACT real messages ==='
            docker exec kimbor_api node -e "
              const { findLocalDispatcherMatch } = require('/app/packages/core/dist/index.js');
              const CITY = '23fdb721-7073-4fd3-bda5-b61bde593490';
              (async () => {
                const m1 = await findLocalDispatcherMatch('Горсетни номери борми', CITY);
                console.log('Gorset match:', JSON.stringify(m1));
                const m2 = await findLocalDispatcherMatch('Assalom aleykum Qoraxitoy choyxona nomeri bormi', CITY);
                console.log('Qoraxitoy local-dispatcher match (expect null, this is a normal listing not emergency number):', JSON.stringify(m2));
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "

            echo ''
            echo '=== 4) Full bot simulator run for BOTH real messages ==='
            docker exec kimbor_api node -e "
              const crypto = require('crypto');
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();
              function buildInitData(telegramId) {
                const botToken = process.env.BOT_TOKEN;
                const user = JSON.stringify({ id: telegramId, first_name: 'Test', last_name: 'Admin' });
                const params = { auth_date: Math.floor(Date.now()/1000).toString(), user };
                const paramsArray = Object.entries(params).sort((a,b)=>a[0].localeCompare(b[0]));
                const dataCheckString = paramsArray.map(([k,v])=>k+'='+v).join('\\n');
                const secretKey = crypto.createHmac('sha256','WebAppData').update(botToken).digest();
                const hash = crypto.createHmac('sha256', secretKey).update(dataCheckString).digest('hex');
                const usp = new URLSearchParams(params);
                usp.set('hash', hash);
                return usp.toString();
              }
              (async () => {
                const superAdmin = await db.user.findFirst({ where: { role: 'SUPER_ADMIN' } });
                const initData = buildInitData(superAdmin.telegramId.toString());
                const headers = { 'x-init-data': initData, 'Content-Type': 'application/json' };

                for (const msg of ['Горсетни номери борми', 'Assalom aleykum Qoraxitoy choyxona nomeri bormi']) {
                  const simRes = await fetch('http://localhost:4000/api/admin/simulate', {
                    method: 'POST', headers, body: JSON.stringify({ message: msg }),
                  });
                  const simData = await simRes.json();
                  console.log('MSG:', msg);
                  console.log(JSON.stringify(simData, null, 2));
                  console.log('---');
                }
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "
