name: One-off - investigate stopwords regression report

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const core = require('/app/packages/core/dist/index.js');
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const { classifyQuery } = require('/app/apps/bot/dist/filter/aiClassifier.js');
            const db = new PrismaClient();
            (async () => {
              const g = await db.listing.findFirst({ where: { name: { contains: 'Gondra', mode: 'insensitive' } } });
              const cityId = g.cityId;

              console.log('=== 1. STOP-WORDS DEPLOYNI VAQTI (18-sentabrdan keyingi unresolved) ===');
              const since = new Date('2026-09-17T23:30:00Z');
              const unresolved = await db.queryLog.findMany({
                where: { cityId, createdAt: { gte: since }, isResolved: false, confidence: { gte: 0.85 } },
                orderBy: { createdAt: 'desc' },
                take: 25,
                select: { rawMessage: true, intent: true, categoryName: true, confidence: true, createdAt: true },
              });
              console.log('Yuqori-ishonchli lekin javobsiz sorovlar soni:', unresolved.length);
              console.log(JSON.stringify(unresolved, null, 0));

              console.log('=== 2. OLDINGI BARCHA REGRESSIYA TESTLARI QAYTA (hozirgi kod bilan) ===');
              let pass = 0; const failures = [];
              async function run(label, q, userId, expectFn) {
                const c = await classifyQuery(q, cityId, BigInt(userId));
                if (c.intent !== 'EMERGENCY' && (core.isSelfOffer(q) || core.isJobVacancy(q) || core.isUtilityStatusQuestion(q))) {
                  const ok0 = expectFn('NONE');
                  if (ok0) pass++; else failures.push(label + ' -> NONE (deterministik)');
                  console.log((ok0 ? 'PASS' : 'FAIL'), label, '| DETERMINISTIK | MATCHED: NONE');
                  return;
                }
                const seek = c.intent !== 'NOT_RELEVANT';
                const sr = await core.searchListings({
                  cityId, categoryName: seek ? c.category : null, landmarkName: seek ? c.landmark : null,
                  rawMessage: q, intent: c.intent, name: seek ? c.name : null,
                });
                const m = sr ? sr.listing.name.trim() : 'NONE';
                const ok = expectFn(m);
                if (ok) pass++; else failures.push(label + ' -> ' + m);
                console.log((ok ? 'PASS' : 'FAIL'), label, '| intent:', c.intent, '| cat:', JSON.stringify(c.category), '| MATCHED:', m);
              }
              const ANSWER = (m) => m !== 'NONE';
              const IS = (s) => (m) => m.toLowerCase().includes(s);

              await run('SANTEXNIK', 'santexnik kerak', 9600001, ANSWER);
              await run('BESHBIR', 'beshbirdagi zaprafka ochiqmi', 9600002, IS('carvon'));
              await run('GONDRA', 'gondra zaprafka ochiqmi', 9600003, IS('gondra'));
              await run('DESKA', 'deska zaprafka ishlayabdimi', 9600004, IS('deska'));
              await run('AVTOELEKTIRIK', 'avtoelektirik kerak', 9600005, ANSWER);
              await run('BALON', 'balon kerak', 9600006, ANSWER);
              await run('LABO', 'labo kerak edi yuk tashish uchun', 9600007, ANSWER);
              await run('KAFEL', 'kafel teradigan usta kerak', 9600008, IS('ismoil'));
              await run('QULF', 'mashinamni qulfi buzilgan, kimda qulf ustasi bor', 9600009, IS('jamshid'));
              await run('MOYXONA', 'moshina moyi almashtirish kerak', 9600010, IS('dilshod'));
              await run('GAZAVIK', 'gazavik kerak', 9600011, ANSWER);
              await run('KVARTIRA', 'ijaraga 1 xonali kvartira kerak edi', 9600012, ANSWER);
              await run('SARIQ_BOLA', 'sariq bola pizza nomeri bormi', 9600013, IS('sariq bola'));
              await run('ARENDA_LESA', 'lesa arenda kerak', 9600014, IS('lesa'));

              console.log('=== 3. OXIRGI 48 SOATDAGI JAMI STATISTIKA ===');
              const since48h = new Date(Date.now() - 48*60*60*1000);
              const total48h = await db.queryLog.count({ where: { cityId, createdAt: { gte: since48h } } });
              const resolved48h = await db.queryLog.count({ where: { cityId, createdAt: { gte: since48h }, isResolved: true } });
              console.log('Jami sorov (48soat):', total48h, '| Javob berilgan:', resolved48h, '| Foiz:', (resolved48h/total48h*100).toFixed(1) + '%');

              // Solishtirish uchun stopwords O'ZGARISHIDAN OLDINGI davr (masalan 3-5 kun oldin)
              const before1 = new Date('2026-09-15T00:00:00Z');
              const before2 = new Date('2026-09-17T00:00:00Z');
              const totalBefore = await db.queryLog.count({ where: { cityId, createdAt: { gte: before1, lt: before2 } } });
              const resolvedBefore = await db.queryLog.count({ where: { cityId, createdAt: { gte: before1, lt: before2 }, isResolved: true } });
              console.log('Jami sorov (15-17 sentabr, OLDIN):', totalBefore, '| Javob berilgan:', resolvedBefore, '| Foiz:', totalBefore > 0 ? (resolvedBefore/totalBefore*100).toFixed(1) + '%' : 'N/A');

              await db.\$disconnect();
              process.exit(0);
            })().catch(e => { console.error('DEBUG_ERROR:', e); process.exit(1); });
            "
