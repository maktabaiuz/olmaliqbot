name: One-off - Verify badge ranking order change

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Test via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            echo "=== Find categories with 2+ active listings that have DIFFERING badges ==="
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();
              (async () => {
                const listings = await db.listing.findMany({
                  where: { status: 'ACTIVE' },
                  select: { id: true, name: true, badges: true, categoryId: true, cityId: true, category: { select: { name: true } } },
                });
                const byCat = {};
                for (const l of listings) {
                  const key = l.categoryId + '|' + l.cityId;
                  (byCat[key] = byCat[key] || []).push(l);
                }
                let found = 0;
                for (const key in byCat) {
                  const group = byCat[key];
                  if (group.length < 2) continue;
                  const hasSome = group.some(l => l.badges && l.badges.length > 0);
                  const hasNone = group.some(l => !l.badges || l.badges.length === 0);
                  if (hasSome && found < 5) {
                    console.log(JSON.stringify({ category: group[0].category.name, cityId: group[0].cityId, listings: group.map(l => ({name: l.name, badges: l.badges})) }));
                    found++;
                  }
                }
                if (found === 0) console.log('NO multi-listing category with any badges found');
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "

            echo ""
            echo "=== Regression sanity: prior fixed cases still behave correctly ==="
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const { searchListings, isSelfOffer, extractRequestedBadges } = require('/app/packages/core/dist/index.js');
              const db = new PrismaClient();
              const CITY = '23fdb721-7073-4fd3-bda5-b61bde593490';
              (async () => {
                console.log('isSelfOffer sugurta ad:', isSelfOffer('Лабо хизмати 776880696'));
                console.log('isSelfOffer akalar arenda:', isSelfOffer('Akalar arendaga yegil moshina kerak'));
                const r1 = await searchListings({ cityId: CITY, categoryName: 'taksi', rawMessage: 'taksi kerak karzinka bilan', intent: 'SERVICE', requestedBadges: extractRequestedBadges('taksi kerak karzinka bilan') });
                console.log('taksi+karzinka top:', r1 ? r1.listing.name : 'null');
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "
