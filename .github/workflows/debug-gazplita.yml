name: One-off - diagnose gas-stove repair -> Malyar bug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const core = require('/app/packages/core/dist/index.js');
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const { classifyQuery } = require('/app/apps/bot/dist/filter/aiClassifier.js');
            const db = new PrismaClient();
            (async () => {
              const g = await db.listing.findFirst({ where: { name: { contains: 'Gondra', mode: 'insensitive' } } });
              const cityId = g.cityId;
              const N = core.normalizeText;

              const q = 'Уйдаги газ плитани ремонт киладиган усталар номери кимда бор ёзиб юборинглар илтимос';
              console.log('NORMALIZED:', JSON.stringify(N(q)));

              const c = await classifyQuery(q, cityId, BigInt(9990001));
              console.log('AI_RESULT:', JSON.stringify(c));

              // Malyar kategoriyasi va uning sinonimlari
              const malyar = await db.category.findFirst({ where: { name: { contains: 'Malyar', mode: 'insensitive' } } });
              console.log('MALYAR_CAT:', JSON.stringify(malyar));

              // 'gaz plita' bilan bogliq har qanday kategoriya bormi?
              const cats = await db.category.findMany({ select: { name: true, synonyms: true } });
              const gasRelated = cats.filter(c => /gaz|plita|santex/i.test(c.name + ' ' + c.synonyms.join(' ')));
              console.log('GAS_RELATED_CATS:', JSON.stringify(gasRelated));

              // Bekzod va Behruz yozuvlari
              for (const nm of ['Bekzod', 'Behruz']) {
                const l = await db.listing.findFirst({ where: { cityId, name: { contains: nm, mode: 'insensitive' } }, include: { category: true } });
                if (l) console.log('LISTING', nm, '=>', JSON.stringify({ name: l.name, cat: l.category && l.category.name, jargon: l.jargonSynonyms }));
              }

              const seek = c.intent !== 'NOT_RELEVANT';
              const sr = await core.searchListings({
                cityId,
                categoryName: seek ? c.category : null,
                landmarkName: seek ? c.landmark : null,
                rawMessage: q,
                intent: c.intent,
                name: seek ? c.name : null,
              });
              console.log('SEARCH_RESULT:', sr ? sr.listing.name.trim() : 'NONE');

              await db.\$disconnect();
              process.exit(0);
            })().catch(e => { console.error('DEBUG_ERROR:', e); process.exit(1); });
            "
