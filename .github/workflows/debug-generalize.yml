name: One-off - check jargon fix generalizes beyond zapravka

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 3m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const core = require('/app/packages/core/dist/index.js');
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const { classifyQuery } = require('/app/apps/bot/dist/filter/aiClassifier.js');
            const db = new PrismaClient();
            (async () => {
              // Ko'p so'zli jargon iboralarga ega, zapravka BO'LMAGAN yozuvlarni topamiz
              const candidates = await db.listing.findMany({
                where: { status: 'ACTIVE', type: { not: 'ZAPRAVKA' }, jargonSynonyms: { isEmpty: false } },
                select: { id: true, name: true, type: true, cityId: true, jargonSynonyms: true },
                take: 30,
              });
              const multiWordOnes = candidates.filter(c => c.jargonSynonyms.some(j => j.trim().split(/\s+/).length >= 3));
              console.log('MULTIWORD_JARGON_LISTINGS_COUNT:', multiWordOnes.length);
              console.log('SAMPLE:', JSON.stringify(multiWordOnes.slice(0, 5).map(c => ({ name: c.name, type: c.type, jargonSynonyms: c.jargonSynonyms }))));

              // Har biri uchun: registered iboradan so'zlarni ARALASHTIRIB/qisqartirib
              // sinov so'rovi yasaymiz va tekshiramiz.
              for (const cand of multiWordOnes.slice(0, 4)) {
                const phrase = cand.jargonSynonyms.find(j => j.trim().split(/\s+/).length >= 3);
                const words = phrase.trim().split(/\s+/);
                // Original tartibni buzib, savol so'zi bilan tugatamiz
                const shuffled = [words[words.length - 1], ...words.slice(0, -1), 'ishlayaptimi'].join(' ');
                const c = await classifyQuery(shuffled, cand.cityId, BigInt(4000000));
                const isSeeking = c.intent !== 'NOT_RELEVANT';
                const sr = await core.searchListings({
                  cityId: cand.cityId,
                  categoryName: isSeeking ? c.category : null,
                  landmarkName: isSeeking ? c.landmark : null,
                  rawMessage: shuffled,
                });
                console.log('ORIGINAL_JARGON:', JSON.stringify(phrase));
                console.log('SHUFFLED_QUERY:', JSON.stringify(shuffled));
                console.log('EXPECTED:', cand.name, '-> MATCHED:', sr ? sr.listing.name : 'NONE', sr && sr.listing.name.trim() === cand.name.trim() ? '(CORRECT)' : '(WRONG/NONE)');
                console.log('---');
              }

              await db.\$disconnect();
              process.exit(0);
            })().catch(e => { console.error('DEBUG_ERROR:', e); process.exit(1); });
            "
