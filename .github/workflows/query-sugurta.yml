name: One-off - Query sugurta category and jargon overlap

on:
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Query via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();
              (async () => {
                const cats = await db.category.findMany({
                  where: { name: { contains: 'sug', mode: 'insensitive' } },
                  select: { id: true, name: true, synonyms: true, group: true, objectType: true },
                });
                console.log('SUGURTA_CATEGORIES:', JSON.stringify(cats, null, 2));

                for (const c of cats) {
                  const listings = await db.listing.findMany({
                    where: { categoryId: c.id },
                    select: { id: true, name: true, jargonSynonyms: true },
                    take: 20,
                  });
                  console.log('LISTINGS for', c.name, JSON.stringify(listings, null, 2));
                }

                const logs = await db.queryLog.findMany({
                  where: {
                    OR: [
                      { rawMessage: { contains: 'sugurta', mode: 'insensitive' } },
                      { rawMessage: { contains: 'sug', mode: 'insensitive' } },
                      { rawMessage: { contains: 'osago', mode: 'insensitive' } },
                      { rawMessage: { contains: 'kasko', mode: 'insensitive' } },
                    ],
                  },
                  orderBy: { createdAt: 'desc' },
                  take: 30,
                  select: { rawMessage: true, categoryName: true, landmarkName: true, isResolved: true, confidence: true, createdAt: true },
                });
                console.log('RECENT_QUERY_LOGS:', JSON.stringify(logs, null, 2));
              })().catch(e=>{console.error(e); process.exit(1)}).finally(()=>db.\$disconnect());
            "
