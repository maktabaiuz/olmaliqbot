name: One-off - Check bot logs for Yana/self-offer errors

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            echo "=== Recent bot logs (last 200 lines) ==="
            docker logs --tail 200 kimbor_bot 2>&1 | grep -iE "error|failed|tahrirlash|reveal|more_|editMessage" || echo "(no matching lines)"

            echo ""
            echo "=== Full recent logs (last 60 lines, unfiltered) ==="
            docker logs --tail 60 kimbor_bot 2>&1
