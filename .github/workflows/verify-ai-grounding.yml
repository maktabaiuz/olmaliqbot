name: One-off - verify AI category-enum grounding

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const core = require('/app/packages/core/dist/index.js');
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const { classifyQuery } = require('/app/apps/bot/dist/filter/aiClassifier.js');
            const db = new PrismaClient();
            (async () => {
              const g = await db.listing.findFirst({ where: { name: { contains: 'Gondra', mode: 'insensitive' } } });
              const cityId = g.cityId;
              let pass = 0; const failures = [];

              async function run(label, q, userId, expectFn) {
                const c = await classifyQuery(q, cityId, BigInt(userId));
                if (c.intent !== 'EMERGENCY' && (core.isSelfOffer(q) || core.isJobVacancy(q) || core.isUtilityStatusQuestion(q))) {
                  const ok0 = expectFn('NONE', c);
                  if (ok0) pass++; else failures.push(label + ' -> NONE (deterministik)');
                  console.log((ok0 ? 'PASS' : 'FAIL'), label, '| DETERMINISTIK | MATCHED: NONE');
                  return;
                }
                const seek = c.intent !== 'NOT_RELEVANT';
                const sr = await core.searchListings({
                  cityId, categoryName: seek ? c.category : null, landmarkName: seek ? c.landmark : null,
                  rawMessage: q, intent: c.intent, name: seek ? c.name : null,
                });
                const m = sr ? sr.listing.name.trim() : 'NONE';
                const ok = expectFn(m, c);
                if (ok) pass++; else failures.push(label + ' -> ' + m + ' | cat=' + c.category);
                console.log((ok ? 'PASS' : 'FAIL'), label, '| intent:', c.intent, '| cat:', JSON.stringify(c.category), '| MATCHED:', m);
              }
              const SILENT = (m) => m === 'NONE';
              const ANSWER = (m) => m !== 'NONE';
              const IS = (s) => (m) => m.toLowerCase().includes(s);
              // Kategoriya HECH QACHON bizning haqiqiy royxatimizdan tashqari bolmasligi kerak
              const CAT_IS_REAL_OR_NULL = (m, c) => true; // tekshiruv pastda alohida

              console.log('=== 0. ENUM ISHLAYAPTIMI - avval hallucination bergan sorovlar ===');
              await run('PEREKRUTEL', 'Assalomu aleykum mashina ochib qolgan kimda perekrutel bor', 9900001, SILENT);
              await run('RAZVAL', 'Oxongarondagi mansur razvalni nomeri yoqmi', 9900002, SILENT);
              await run('KLAPAN', 'Qora qiyadagi ota bollarni nomeri yoqmi klapn tortadigan', 9900003, SILENT);
              await run('KARBYURATORCHI', '67 dagi karbyuratorchi Alisherni nomeri kimda bor', 9900004, SILENT);
              await run('MIB', 'Olmaliq mib nechigacha ishlaydi', 9900005, SILENT);
              await run('GAZ_ORNATISH', 'Matizga gaz ornatish qancha', 9900006, SILENT);

              console.log('=== 0b. KATEGORIYA HAQIQIY ROYXATDANMI - qora quti tekshiruvi ===');
              const realCats = new Set(await core.getRealCategoryEnumNames());
              console.log('Haqiqiy kategoriyalar soni:', realCats.size);
              const testMessages = [
                'santexnik kerak', 'perekrutel kerak edi', 'gazavik kerak', 'karbyuratorchi bormi',
                'taksi kerak', 'razval kerak', 'klapan tortadigan usta kerak', 'elektrik kerak',
              ];
              let allCatsValid = true;
              for (const q of testMessages) {
                const c = await classifyQuery(q, cityId, BigInt(Math.floor(Math.random()*1000000)+9900100));
                const isValid = !c.category || realCats.has(c.category);
                if (!isValid) { allCatsValid = false; console.log('  XATO - HAQIQIY EMAS KATEGORIYA:', JSON.stringify(c.category), 'sorov:', q); }
                else console.log('  OK:', JSON.stringify(q), '-> cat:', JSON.stringify(c.category));
              }
              if (allCatsValid) pass++; else failures.push('CATEGORY_ENUM_VALIDITY');
              console.log((allCatsValid ? 'PASS' : 'FAIL'), 'CATEGORY_ENUM_VALIDITY (hech qachon oylab topilgan kategoriya bolmasligi kerak)');

              console.log('=== 1. HAQIQIY SOROVLAR HALI ISHLASHI SHART (regressiya) ===');
              await run('SANTEXNIK', 'santexnik kerak', 9900010, ANSWER);
              await run('TAKSI_BOCHKA', 'Assalomu alekum bochkadan olmaliqqa ketadigan taxilar bormi', 9900011, ANSWER);
              await run('BESHBIR', 'beshbirdagi zaprafka ochiqmi', 9900012, IS('carvon'));
              await run('GONDRA', 'gondra zaprafka ochiqmi', 9900013, IS('gondra'));
              await run('DESKA', 'deska zaprafka ishlayabdimi', 9900014, IS('deska'));
              await run('AVTOELEKTIRIK', 'avtoelektirik kerak', 9900015, ANSWER);
              await run('KAFEL', 'kafel teradigan usta kerak', 9900016, IS('ismoil'));
              await run('QULF', 'mashinamni qulfi buzilgan, kimda qulf ustasi bor', 9900017, IS('jamshid'));
              await run('MOYXONA', 'moshina moyi almashtirish kerak', 9900018, IS('dilshod'));
              await run('GAZAVIK', 'gazavik kerak', 9900019, ANSWER);
              await run('KVARTIRA', 'ijaraga 1 xonali kvartira kerak edi', 9900020, ANSWER);
              await run('SARIQ_BOLA', 'sariq bola pizza nomeri bormi', 9900021, IS('sariq bola'));
              await run('ARENDA_LESA', 'lesa arenda kerak', 9900022, IS('lesa'));
              await run('BALON', 'balon kerak', 9900023, ANSWER);
              await run('GAZ_PLITA', 'Уйдаги газ плитани ремонт киладиган усталар номери кимда бор ёзиб юборинглар илтимос', 9900024, IS('sardor'));

              console.log('=== 2. JIM TURISHI SHART BOLGANLAR (regressiya) ===');
              await run('FORTUNA', 'akalar fartunani nomeri bormi', 9900030, SILENT);
              await run('LADA_SERVICE', 'sariq bola pizza oldida LADA magazin bor, u yerda shina bormi', 9900031, SILENT);
              await run('GAS_NEWS', 'Акалар газ качон беришидан хабарилар борми?', 9900032, SILENT);
              await run('MATIZ', 'Matiz 35talik propan bilan qancha yuradi', 9900033, SILENT);
              await run('ARENDA_CAR', 'арендага механика мошин керак', 9900034, SILENT);
              await run('JOB_ORIGINAL', \"Shlakablok terishga podsobnik yordamchi kerak qanaqa ish bo'lsa yordam qilishi kerak 779758180\", 9900035, SILENT);
              await run('AD_MAKLER', \"Kimga maklersiz Olmaliqda uy kerak bo'lsa profilga o'ting\", 9900036, SILENT);

              console.log('---');
              console.log('RESULT: PASS=' + pass + ' FAIL=' + failures.length);
              for (const f of failures) console.log('FAILED:', f);
              await db.\$disconnect();
              process.exit(failures.length > 0 ? 1 : 0);
            })().catch(e => { console.error('DEBUG_ERROR:', e); process.exit(1); });
            "
