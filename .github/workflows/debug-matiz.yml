name: One-off - diagnose Matiz/propane -> uy arenda mismatch

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const core = require('/app/packages/core/dist/index.js');
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const { classifyQuery } = require('/app/apps/bot/dist/filter/aiClassifier.js');
            const db = new PrismaClient();
            (async () => {
              const g = await db.listing.findFirst({ where: { name: { contains: 'Gondra', mode: 'insensitive' } } });
              const cityId = g.cityId;
              const N = core.normalizeText;

              const q = 'Matiz 35talik propan bilan qancha yuradi';
              console.log('NORMALIZED:', JSON.stringify(N(q)));

              for (let i = 0; i < 3; i++) {
                const c = await classifyQuery(q, cityId, BigInt(9830001 + i));
                console.log('run', i, '| AI_RESULT:', JSON.stringify(c));
                const seek = c.intent !== 'NOT_RELEVANT';
                const sr = await core.searchListings({
                  cityId, categoryName: seek ? c.category : null, landmarkName: seek ? c.landmark : null,
                  rawMessage: q, intent: c.intent, name: seek ? c.name : null,
                });
                console.log('  MATCHED:', sr ? sr.listing.name.trim() + ' [' + (sr.listing.category ? sr.listing.category.name : '?') + ']' : 'NONE');
              }

              // Uy/kvartira arendaga yozuvlarining jargonida 'bilan' yoki boshqa sozlar bormi?
              const arendaCat = await db.category.findFirst({ where: { name: { contains: 'kvartira', mode: 'insensitive' } } });
              const arendaListings = await db.listing.findMany({ where: { categoryId: arendaCat.id }, select: { name: true, jargonSynonyms: true } });
              console.log('ARENDA_LISTINGS:', JSON.stringify(arendaListings));

              await db.\$disconnect();
              process.exit(0);
            })().catch(e => { console.error('DEBUG_ERROR:', e); process.exit(1); });
            "
