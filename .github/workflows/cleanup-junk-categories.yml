name: One-off - delete confirmed junk categories

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 3m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const db = new PrismaClient();
            (async () => {
              const JUNK_NAMES = [
                'Electric ⚡',
                'Elektrik uy dom ofis ishlab chiqarishlarda elektrodvigatel diagnostikasi hisoblagichlar o‘rnatish qisqa tutashuvlarni bartaraf etish',
                'Elektromantaj qilaman uylarni',
                'Ijara uy kerak',
                'Ish',
                'Labo xizmati',
                'polu fabrikat tiftel',
                'test',
                'winiray dubl kobina',
                'Йук ташиш хизмати Газелда',
                'Касб',
              ];
              for (const name of JUNK_NAMES) {
                const cat = await db.category.findFirst({ where: { name } });
                if (!cat) { console.log('  SKIP (topilmadi):', JSON.stringify(name)); continue; }
                const cnt = await db.listing.count({ where: { categoryId: cat.id } });
                if (cnt > 0) { console.log('  SKIP (yozuvlari bor:', cnt + '):', JSON.stringify(name)); continue; }
                await db.category.delete({ where: { id: cat.id } });
                console.log('  OCHIRILDI:', JSON.stringify(name));
              }
              console.log('QOLGAN KATEGORIYALAR:', await db.category.count());
              await db.\$disconnect();
              process.exit(0);
            })().catch(e => { console.error('CLEANUP_ERROR:', e); process.exit(1); });
            "
