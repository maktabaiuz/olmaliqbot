name: One-off - diagnose job-vacancy ad misclassification

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const core = require('/app/packages/core/dist/index.js');
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const { classifyQuery } = require('/app/apps/bot/dist/filter/aiClassifier.js');
            const db = new PrismaClient();
            (async () => {
              const g = await db.listing.findFirst({ where: { name: { contains: 'Gondra', mode: 'insensitive' } } });
              const cityId = g.cityId;

              async function run(label, q, userId) {
                const self = core.isSelfOffer(q);
                const c = await classifyQuery(q, cityId, BigInt(userId));
                const seek = c.intent !== 'NOT_RELEVANT';
                const sr = await core.searchListings({
                  cityId,
                  categoryName: seek ? c.category : null,
                  landmarkName: seek ? c.landmark : null,
                  rawMessage: q,
                  intent: c.intent,
                  name: seek ? c.name : null,
                });
                console.log(label, '| isSelfOffer:', self, '| intent:', c.intent, '| cat:', JSON.stringify(c.category), '| conf:', c.confidence, '| MATCHED:', sr ? sr.listing.name.trim() : 'NONE');
              }

              console.log('=== ISH ELONLARI (bot JIM turishi kerak) ===');
              await run('JOB_ORIGINAL', \"Shlakablok terishga podsobnik yordamchi kerak qanaqa ish bo'lsa yordam qilishi kerak 779758180\", 9800001);
              await run('JOB_NOPHONE', \"Shlakablok terishga podsobnik yordamchi kerak qanaqa ish bo'lsa yordam qilishi kerak\", 9800002);
              await run('JOB_ISHCHI', 'qurilishga ishchi kerak kunlik ish 900 ming 901234567', 9800003);
              await run('JOB_YORDAMCHI', 'yordamchi kerak ishga oylik yaxshi', 9800004);

              console.log('=== HAQIQIY SO_ROVLAR (javob berishi kerak) ===');
              await run('REAL_KAFEL', 'kafel teradigan usta kerak', 9800010);
              await run('REAL_KAFELCHI', 'kafelchi kerak', 9800011);
              await run('REAL_SANTEX', 'santexnik kerak', 9800012);

              console.log('=== BUZUQ KATEGORIYALAR ===');
              const cats = await db.category.findMany({ select: { id: true, name: true, synonyms: true } });
              for (const c of cats) {
                const looksJunk = c.name.includes('\\n') || c.name.length > 40 || /\\+998|\\d{3}-\\d{2}-\\d{2}/.test(c.name) || /\\bkk\$/i.test(c.name.trim());
                if (looksJunk) {
                  const cnt = await db.listing.count({ where: { categoryId: c.id } });
                  console.log('JUNK_CAT:', JSON.stringify({ id: c.id, name: c.name.slice(0, 80), listings: cnt }));
                }
              }
              console.log('TOTAL_CATS:', cats.length);

              await db.\$disconnect();
              process.exit(0);
            })().catch(e => { console.error('DEBUG_ERROR:', e); process.exit(1); });
            "
