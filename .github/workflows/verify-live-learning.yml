name: One-off - verify live learned-term recording
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 90s
          command_timeout: 5m
          script: |
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();
              const j = (o) => JSON.stringify(o, (k,v) => typeof v === 'bigint' ? v.toString() : v);
              (async () => {
                // 1) Jadval mavjudligini va joriy hajmini tekshirish
                const total = await db.learnedTermAggregate.count();
                const pending = await db.learnedTermAggregate.count({ where: { status: 'PENDING' } });
                const aiChecked = await db.learnedTermAggregate.count({ where: { aiConfirmed: { not: null } } });
                console.log('out:TOTAL=' + total + ' PENDING=' + pending + ' AI_CHECKED=' + aiChecked);

                // 2) LIVE yozuvni sinash — core funksiyasini to'g'ridan-to'g'ri chaqiramiz
                const core = require('/app/packages/core/dist/index.js');
                const city = await db.city.findFirst();
                const suffixWords = ['aylanbek','tuynakov','qorovulboy','changiroq','pastanoq'];
                const testTerm = suffixWords[Math.floor(Math.random()*suffixWords.length)];
                const testMsg = 'Akalar ' + testTerm + ' ustasi kerak edi kimda bor';
                await core.recordLearnedTermCandidates(city.id, testMsg, 'TestKategoriya', null);
                await core.recordLearnedTermCandidates(city.id, 'Boshqa gap: ' + testTerm + ' bormi kimda', 'TestKategoriya', null);
                const row = await db.learnedTermAggregate.findUnique({ where: { cityId_term: { cityId: city.id, term: testTerm } } });
                console.log('out:LIVE_TEST_ROW ' + j(row));

                // 3) Eng ko'p skeletli 5 ta joriy nomzod
                const top = await db.learnedTermAggregate.findMany({ where: { status: 'PENDING' }, orderBy: { distinctSkeletonCount: 'desc' }, take: 5 });
                top.forEach(t => console.log('out:TOP ' + t.term + ' skeletons=' + t.distinctSkeletonCount + ' aiConfirmed=' + t.aiConfirmed));

                await db.\$disconnect();
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "
