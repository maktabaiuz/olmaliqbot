name: Check live moderation state (one-off)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 3m
          script: |
            echo "=== 1) Hozir SPAM_LINK yoqilgan guruhlar ==="
            docker exec kimbor_api node -e "
              const { db } = require('/app/packages/db/dist/index.js');
              (async () => {
                const toggles = await db.groupFeatureToggle.findMany({ where: { featureKey: 'SPAM_LINK', isEnabled: true }, include: { cityGroup: true } });
                console.log(toggles.map(t => ({ groupTitle: t.cityGroup.title, chatId: t.cityGroup.chatId.toString(), groupId: t.cityGroupId })));
                const allGroups = await db.cityGroup.findMany();
                console.log('Jami guruhlar:', allGroups.map(g => ({ title: g.title, chatId: g.chatId.toString() })));
                process.exit(0);
              })().catch(e=>{console.error(e);process.exit(1);});
            "
            echo ""
            echo "=== 2) Gemini AI tahlili (kredit qoshilgandan keyin) ==="
            docker exec kimbor_api node -e "
              const geminiKey = process.env.GEMINI_API_KEY;
              (async () => {
                const resp = await fetch('https://generativelanguage.googleapis.com/v1beta/interactions', {
                  method: 'POST',
                  headers: { 'x-goog-api-key': geminiKey, 'content-type': 'application/json' },
                  body: JSON.stringify({
                    model: 'gemini-3.5-flash',
                    input: 'Ushbu havolani tekshir (URL Context orqali). Bu nima ekanini va xavfli yoki zararsiz ekanini aniqla. Javobni ozbek tilida 1-2 gap bilan, albatta XULOSA: sozidan boshlab yoz.\\n\\nHavola: https://www.wikipedia.org',
                    tools: [{ type: 'url_context' }],
                  }),
                });
                const status = resp.status;
                const json = await resp.json().catch(() => null);
                console.log('HTTP status:', status);
                console.log('TO\`LIQ JAVOB:', JSON.stringify(json, null, 2));
                process.exit(0);
              })().catch(e=>{console.error('ERR',e);process.exit(1);});
            "
