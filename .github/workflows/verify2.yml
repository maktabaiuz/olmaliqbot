name: One-off - verify choyxona 29-liniya match reasoning
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 90s
          command_timeout: 10m
          script: |
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const core = require('/app/packages/core/dist/index.js');
              const db = new PrismaClient();
              const j = (o) => JSON.stringify(o, (k,v) => typeof v === 'bigint' ? v.toString() : v);
              (async () => {
                const city = await db.city.findFirst();
                const cat = await db.category.findFirst({ where: { name: { contains: 'choyxona', mode: 'insensitive' } } });
                const listings = await db.listing.findMany({ where: { categoryId: cat.id, status: 'ACTIVE' }, select: { id: true, name: true, description: true, jargonSynonyms: true, primaryLandmarkId: true } });
                console.log('out:ALL_CHOYXONA=' + j(listings));
                await db.\$disconnect();
              })().catch(e=>{console.error('ERR', e.stack); process.exit(1)});
            "
