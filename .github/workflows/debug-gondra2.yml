name: One-off - debug gondra zaprafka qata

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 3m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const { zeroLayerFilter } = require('/app/apps/bot/dist/filter/zeroLayerFilter.js');
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const { classifyQuery } = require('/app/apps/bot/dist/filter/aiClassifier.js');
            const { isSelfOffer } = require('/app/packages/core/dist/index.js');
            const core = require('/app/packages/core/dist/index.js');
            const db = new PrismaClient();
            (async () => {
              const q = 'gondra zaprafka qata';
              console.log('QUERY:', JSON.stringify(q));

              const passedZeroLayer = zeroLayerFilter(q);
              console.log('ZERO_LAYER_PASSED:', passedZeroLayer);

              const selfOffer = isSelfOffer(q);
              console.log('IS_SELF_OFFER:', selfOffer);

              const gondra = await db.listing.findFirst({ where: { name: { contains: 'Gondra', mode: 'insensitive' } } });
              console.log('GONDRA_FOUND_IN_DB:', !!gondra, gondra && JSON.stringify({ id: gondra.id, status: gondra.status, cityId: gondra.cityId, jargonSynonyms: gondra.jargonSynonyms }));

              if (gondra) {
                const classification = await classifyQuery(q, gondra.cityId, BigInt(999999));
                console.log('CLASSIFICATION:', JSON.stringify(classification));

                const isSeeking = classification.intent !== 'NOT_RELEVANT';
                const searchResult = await core.searchListings({
                  cityId: gondra.cityId,
                  categoryName: isSeeking ? classification.category : null,
                  landmarkName: isSeeking ? classification.landmark : null,
                  rawMessage: q,
                });
                console.log('FULL_PIPELINE_FOUND:', !!searchResult);
                if (searchResult) console.log('TEXT_SNIPPET:', (searchResult.text || searchResult.formattedText || '').slice(0, 200));
              }

              await db.\$disconnect();
              process.exit(0);
            })().catch(e => { console.error('VERIFY_ERROR:', e); process.exit(1); });
            "
