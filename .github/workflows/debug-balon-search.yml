name: Fix Avtomobil Shinalari synonyms + verify (one-off)

on:
  workflow_dispatch:

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Add category synonyms + re-verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 3m
          script: |
            echo "=== 1) Add synonyms to Avtomobil Shinalari category ==="
            docker exec -w /app/apps/bot kimbor_bot node -e "
              const { db } = require('@kimbor/db');
              (async () => {
                const cat = await db.category.findFirst({ where: { name: 'Avtomobil Shinalari' } });
                if (!cat) throw new Error('Category not found');
                const newSynonyms = ['balon', 'balonlar', 'shina', 'shinalar', 'avto shina', 'avto shinalar', 'avtomobil shinasi', 'rezina', 'pokrishka', 'vulkanizatsiya'];
                const updated = await db.category.update({
                  where: { id: cat.id },
                  data: { synonyms: Array.from(new Set([...cat.synonyms, ...newSynonyms])) },
                });
                console.log('out: updated synonyms=' + JSON.stringify(updated.synonyms));
              })().catch(e => { console.error('err:', e.message); process.exit(1); }).then(() => process.exit(0));
            "
            echo ""
            echo "=== 2) Re-test: previously-failing wrong-category scenario ==="
            docker exec -w /app/apps/bot kimbor_bot node -e "
              const { searchListings } = require('@kimbor/core');
              const { db } = require('@kimbor/db');
              (async () => {
                const city = await db.city.findFirst();

                const wrongCatTest = await searchListings({ cityId: city.id, categoryName: 'shinamontaj', landmarkName: null, rawMessage: 'balon kerak' });
                console.log('out: [FIX B check] categoryName=shinamontaj (empty category) now finds=' + !!wrongCatTest + (wrongCatTest ? ' listing=' + wrongCatTest.listing.name : ''));

                const directCatTest = await searchListings({ cityId: city.id, categoryName: 'balon', landmarkName: null, rawMessage: 'balon kerak' });
                console.log('out: [FIX A check] categoryName=balon now resolves to real category, finds=' + !!directCatTest + (directCatTest ? ' listing=' + directCatTest.listing.name + ' categoryDisplay=' + directCatTest.formattedText.split(String.fromCharCode(10))[0] : ''));

                const variantTest = await searchListings({ cityId: city.id, categoryName: 'avtomobil shinasi', landmarkName: null, rawMessage: 'shina kerak' });
                console.log('out: [FIX A check 2] categoryName=avtomobil shinasi finds=' + !!variantTest + (variantTest ? ' listing=' + variantTest.listing.name : ''));

                console.log('out: === 3) EXACT full pipeline test for the user real phrase, 3 fresh runs (cache-busted via case variants) ===');
                const { classifyQuery } = require('/app/apps/bot/dist/filter/aiClassifier.js');
                const variants = ['balon kerak', 'Balon kerak', 'balon kerak.'];
                for (const msg of variants) {
                  const c = await classifyQuery(msg, city.id, BigInt(1));
                  const catForSearch = c.intent !== 'NOT_RELEVANT' ? c.category : null;
                  const r = await searchListings({ cityId: city.id, categoryName: catForSearch, landmarkName: c.intent !== 'NOT_RELEVANT' ? c.landmark : null, rawMessage: msg });
                  console.log('out: msg=\"' + msg + '\" intent=' + c.intent + ' category=' + c.category + ' confidence=' + c.confidence + ' -> found=' + !!r + (r ? ' listing=' + r.listing.name : ' (categoryName passed=' + catForSearch + ')'));
                }
              })().catch(e => { console.error('err:', e.message, e.stack); process.exit(1); }).then(() => process.exit(0));
            "
