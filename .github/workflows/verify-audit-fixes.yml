name: One-off - Verify audit fixes in production

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            echo "=== 1) Global Dictionary: write and read a query phrase via /admin/settings ==="
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();
              (async () => {
                await db.appSetting.upsert({
                  where: { key: 'dictionary_query_phrases' },
                  update: { value: JSON.stringify(['sinov_iborasi_12345']) },
                  create: { key: 'dictionary_query_phrases', value: JSON.stringify(['sinov_iborasi_12345']) },
                });
                console.log('wrote test phrase to AppSetting');
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "
            echo '--- now check zeroLayerFilter picks it up (fresh process reads AppSetting on import) ---'
            docker exec kimbor_bot node -e "
              const { zeroLayerFilter } = require('/app/apps/bot/dist/filter/zeroLayerFilter.js');
              (async () => {
                await new Promise(r => setTimeout(r, 2000));
                console.log('zeroLayerFilter with custom phrase (should be true):', zeroLayerFilter('bu sinov_iborasi_12345 haqida gap'));
                console.log('zeroLayerFilter unrelated chat (should be false):', zeroLayerFilter('salom qalaysiz bugun ob-havo yaxshi'));
              })();
            " || echo "bot dist path check failed, trying alt path"
            docker exec kimbor_bot find /app -name "zeroLayerFilter.js" -not -path "*/node_modules/*" 2>/dev/null

            echo ""
            echo "=== 2) UserChat stats: search by telegramId now works ==="
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();
              (async () => {
                const anyUser = await db.user.findFirst({ where: { role: 'USER' } });
                console.log('Sample user telegramId:', anyUser?.telegramId?.toString());
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "

            echo ""
            echo "=== 3) Cleanup test phrase ==="
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();
              (async () => {
                await db.appSetting.upsert({
                  where: { key: 'dictionary_query_phrases' },
                  update: { value: JSON.stringify([]) },
                  create: { key: 'dictionary_query_phrases', value: JSON.stringify([]) },
                });
                console.log('cleaned up test phrase');
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "
