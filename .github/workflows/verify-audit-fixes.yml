name: One-off - verify all audit fixes + regression
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 90s
          command_timeout: 10m
          script: |
            docker exec kimbor_api node -e "
              const crypto = require('crypto');
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const db = new PrismaClient();
              function buildInitData(telegramId) {
                const botToken = process.env.BOT_TOKEN;
                const user = JSON.stringify({ id: telegramId, first_name: 'Test', last_name: 'Admin' });
                const params = { auth_date: Math.floor(Date.now()/1000).toString(), user };
                const paramsArray = Object.entries(params).sort((a,b)=>a[0].localeCompare(b[0]));
                const dataCheckString = paramsArray.map(([k,v])=>k+'='+v).join('\\n');
                const secretKey = crypto.createHmac('sha256','WebAppData').update(botToken).digest();
                const hash = crypto.createHmac('sha256', secretKey).update(dataCheckString).digest('hex');
                const usp = new URLSearchParams(params);
                usp.set('hash', hash);
                return usp.toString();
              }
              (async () => {
                const superAdmin = await db.user.findFirst({ where: { role: 'SUPER_ADMIN' } });
                const headers = { 'x-init-data': buildInitData(superAdmin.telegramId.toString()), 'Content-Type': 'application/json' };
                const cases = [
                  ['REGRESSION: qaysi zapravka still silent', 'Кайси заправка бу катдаги'],
                  ['REGRESSION: plain zapravka still answers', 'zapravka qaerda'],
                  ['REGRESSION: single-listing qaysi still answers', 'Qaysi santexnik yaxshi'],
                  ['REGRESSION: gazavik olmaliq (city-name fix)', 'santexnik kerak suv tomayabdi'],
                  ['REGRESSION: taksi negation still works', 'Йул сурамадиз суришмокчи булдизми чумадим барбир кизилга тушдиз'],
                  ['REGRESSION: barber/barbir bug still silent', 'chumadim barbir qizilga tushdiz'],
                  ['REGRESSION: kvartira arendasi still classifies right', '1 xonali kvartira izlayapman markazga yaqin'],
                  ['REGRESSION: uy hovli arendasi (family rental)', 'studentlarga uy kerak edi arendaga'],
                  ['NEW: comparison question -> should be silent', 'Fortuna yaxshimi yoki LADA?'],
                  ['NEW: named-object restriction (LADA magazin, no real match expected)', 'LADA magazinda narxlar qancha'],
                ];
                for (const [label, msg] of cases) {
                  const r = await fetch('http://localhost:4000/api/admin/simulate', { method: 'POST', headers, body: JSON.stringify({ message: msg }) });
                  const d = await r.json();
                  console.log('out:' + label + ' | ai_cat=' + (d.steps && d.steps.aiClassification && d.steps.aiClassification.category) + ' | found=' + (d.finalResult && d.finalResult.found) + ' | listing=' + (d.finalResult && d.finalResult.listingName));
                }
                await db.\$disconnect();
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "
