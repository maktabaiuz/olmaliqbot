name: One-off - Perekrutel stability re-check

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Run tests via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            docker exec kimbor_bot node -e "
              const { classifyQuery } = require('/app/apps/bot/dist/filter/aiClassifier.js');
              const CITY = '23fdb721-7073-4fd3-bda5-b61bde593490';
              (async () => {
                const tally = {};
                for (let i = 0; i < 6; i++) {
                  const r = await classifyQuery('mashina ochib qolgan, kimda perekrutel bor', CITY);
                  const key = String(r.category);
                  tally[key] = (tally[key] || 0) + 1;
                  console.log(JSON.stringify({run: i+1, category: r.category, landmark: r.landmark, intent: r.intent}));
                }
                console.log('TALLY:', JSON.stringify(tally));

                console.log('');
                console.log('=== Xuddi shu so\\'rov, lekin cityId BERILMASA (landmark context yo\\'q) ===');
                const tally2 = {};
                for (let i = 0; i < 6; i++) {
                  const r = await classifyQuery('mashina ochib qolgan, kimda perekrutel bor');
                  const key = String(r.category);
                  tally2[key] = (tally2[key] || 0) + 1;
                  console.log(JSON.stringify({run: i+1, category: r.category, landmark: r.landmark, intent: r.intent}));
                }
                console.log('TALLY_NO_CITY:', JSON.stringify(tally2));
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "
