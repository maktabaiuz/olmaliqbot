name: One-off - Verify dashboard noise fix

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            docker exec kimbor_api node -e "
              const { clusterUnresolvedQueries } = require('/app/packages/core/dist/index.js');
              const CITY = '23fdb721-7073-4fd3-bda5-b61bde593490';
              (async () => {
                const clusters = await clusterUnresolvedQueries(CITY);
                const missing = clusters.filter(c => !c.isExistingCategory).slice(0, 10);
                console.log('=== Yangi ehtiyojlar (top 10) ===');
                for (const m of missing) {
                  console.log(JSON.stringify({ name: m.canonicalName, count: m.count, examples: m.rawExamples?.slice(0,1) }));
                }
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "
            echo ""
            echo "=== Top 10 qidiruvlar (curl) ==="
            curl -s "https://olmaliq.online/api/admin/queries/top-10?period=month" | python3 -m json.tool 2>/dev/null || curl -s "https://olmaliq.online/api/admin/queries/top-10?period=month"
