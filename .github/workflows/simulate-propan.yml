name: One-off - Simulate Propan query to confirm root cause

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Simulate via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            docker exec kimbor_api node -e "
              const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
              const { searchListings, extractRequestedBadges } = require('/app/packages/core/dist/index.js');
              const db = new PrismaClient();
              const CITY = '23fdb721-7073-4fd3-bda5-b61bde593490';
              (async () => {
                const msg = 'Propan qayerda ishlayabdi akalar';
                const badges = extractRequestedBadges(msg);
                console.log('Extracted badges:', JSON.stringify(badges));
                const r = await searchListings({ cityId: CITY, categoryName: 'avtomobil zapravkasi', rawMessage: msg, intent: 'SERVICE', requestedBadges: badges, debug: true });
                console.log('Top result:', r ? r.listing.name : 'null');
                console.log('Score breakdown:', r ? JSON.stringify(r.scoreBreakdown, null, 2) : 'none');
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "
