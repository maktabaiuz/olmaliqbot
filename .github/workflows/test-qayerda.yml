name: One-off - Test qayerda ishlaydi query

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Run via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            docker exec kimbor_api node -e "
              const { searchListings } = require('/app/packages/core/dist/index.js');
              const CITY = '23fdb721-7073-4fd3-bda5-b61bde593490';
              (async () => {
                const msg = \"Sug'urta qayerda ishlaydi xozir\";
                const r1 = await searchListings({ cityId: CITY, categoryName: \"sug'urta\", rawMessage: msg, intent: 'SERVICE' });
                console.log('WITH_CATEGORY:', r1 ? JSON.stringify(r1.name || Object.keys(r1)) : 'null');
                const r2 = await searchListings({ cityId: CITY, rawMessage: msg, intent: 'SERVICE' });
                console.log('NO_CATEGORY:', r2 ? JSON.stringify(r2.name || Object.keys(r2)) : 'null');
              })().catch(e=>{console.error('ERR', e); process.exit(1)});
            "
