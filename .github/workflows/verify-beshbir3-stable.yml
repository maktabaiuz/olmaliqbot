name: One-off - confirm BESHBIR_3 is now deterministic (20 runs)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e
            docker exec -w /app/apps/bot kimbor_bot node -e "
            const core = require('/app/packages/core/dist/index.js');
            const { PrismaClient } = require('/app/node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/@prisma/client');
            const db = new PrismaClient();
            (async () => {
              const g = await db.listing.findFirst({ where: { name: { contains: 'Gondra', mode: 'insensitive' } } });
              const cityId = g.cityId;
              const results = {};
              for (let i = 0; i < 20; i++) {
                const sr = await core.searchListings({
                  cityId,
                  categoryName: 'avtomobil zapravkasi',
                  landmarkName: null,
                  rawMessage: 'beshbir zaprafka nechigacha ishlaydi',
                  intent: 'HOURS',
                  name: null,
                });
                const m = sr ? sr.listing.name.trim() : 'NONE';
                results[m] = (results[m] || 0) + 1;
              }
              console.log('DISTRIBUTION:', JSON.stringify(results));
              const onlyCarvon = Object.keys(results).length === 1 && results['CARVON'] === 20;
              console.log(onlyCarvon ? 'STABLE_PASS' : 'STABLE_FAIL');
              await db.\$disconnect();
              process.exit(onlyCarvon ? 0 : 1);
            })().catch(e => { console.error('DEBUG_ERROR:', e); process.exit(1); });
            "
