econdary-fixed": "#251a00", "on-secondary-fixed-variant": "#5a4300" }, borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, spacing: { "gutter": "0.75rem", "space-xl": "1.5rem", "margin": "1rem", "space-md": "0.75rem", "space-xs": "0.25rem", "space-sm": "0.5rem", "space-lg": "1rem" }, fontFamily: { "body-lg": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "label-lg": ["Plus Jakarta Sans"], "headline-xl": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "body-sm": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"] }, fontSize: { "body-lg": ["16px", { lineHeight: "24px", fontWeight: "500" }], "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.02em", fontWeight: "700" }], "label-lg": ["14px", { lineHeight: "18px", fontWeight: "700" }], "headline-xl": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "800" }], "headline-md": ["20px", { lineHeight: "28px", letterSpacing: "-0.01em", fontWeight: "700" }], "body-sm": ["12px", { lineHeight: "16px", fontWeight: "400" }], "body-md": ["14px", { lineHeight: "20px", fontWeight: "500" }], "headline-lg": ["26px", { lineHeight: "34px", letterSpacing: "-0.015em", fontWeight: "800" }], "label-sm": ["10px", { lineHeight: "14px", letterSpacing: "0.04em", fontWeight: "800" }], "headline-sm": ["17px", { lineHeight: "24px", fontWeight: "700" }] } } } };</script></head><body class="bg-surface font-body-md text-on-surface antialiased flex flex-col min-h-screen pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full relative select-none overflow-hidden pb-10">
<!-- Dynamic Audio Particle Backdrop Effect -->
<div class="absolute inset-0 pointer-events-none overflow-hidden flex items-center justify-center">
<div class="absolute -top-12 -left-12 w-64 h-64 bg-primary-container/20 rounded-full blur-3xl animate-pulse"></div>
<div class="absolute top-1/3 -right-16 w-72 h-72 bg-secondary-container/25 rounded-full blur-3xl"></div>
<div class="absolute bottom-10 left-8 w-80 h-80 bg-tertiary-fixed-dim/20 rounded-full blur-3xl"></div>
</div>
<!-- Top Action & Live Voice Status -->
<header class="relative z-10 flex items-center justify-between px-margin pt-4 pb-2">
<div class="flex items-center gap-2 bg-surface-container-lowest/90 px-space-md py-1.5 rounded-full shadow-md backdrop-blur-md">
<span class="relative flex h-2.5 w-2.5">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"></span>
<span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-primary"></span>
</span>
<span class="font-label-sm text-primary tracking-wide uppercase">Tinglamoqda...</span>
</div>
<!-- Frosted Close Circle -->
<button aria-label="Yopish" class="w-10 h-10 rounded-full bg-surface-container-lowest/80 text-on-surface shadow-md flex items-center justify-center active:scale-90 transition-transform backdrop-blur-md" type="button">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</header>
<!-- Mascot & Concentric Audio Wave Hero -->
<section class="relative z-10 flex flex-col items-center justify-center px-margin pt-2 pb-3">

<div class="relative w-44 h-44 mb-3 flex items-center justify-center">

<div class="absolute inset-2 bg-primary-container/30 rounded-full blur-xl scale-110"></div>

<div class="relative w-40 h-40 rounded-full bg-gradient-to-b from-surface-container-lowest via-surface-container-low to-primary-fixed p-1.5 shadow-xl flex items-center justify-center">
<div class="w-full h-full rounded-full overflow-hidden bg-primary-fixed/40 flex items-center justify-center relative">
<img alt="Borvoy - Olmaliq yo‘lboshchisi" class="w-full h-full object-cover scale-105" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDIWxtbNmvU-0rvoa1t_sASTIuaCfdJl9cHAstnlT7Ob4AO00f3hsH3K4-BQM_-SdMzC7DYRaDr2XTRDsMuz3UndEwcKEj7QFgYwaH5DJLy-mlCcorAi-Zp9BxJLi7yll5CoIVTTu38xPtHLSw9QT6k1SXwlEUKXSHXUEqAxy-BdFW0xgGbI58NqVU3g7cBnOFVJeChysyl3zNXbPGsidYR7f-uQLFjjyKLe8ZYa-xVAYpcoWUutO7j"/>
<!-- Tactile top-rim reflection shine -->
<div class="absolute inset-0 rounded-full bg-gradient-to-t from-transparent via-transparent to-surface-container-lowest/40 pointer-events-none"></div>
</div>
</div>
<!-- Floating Olmaliq badge on mascot -->
<div class="absolute -bottom-1 bg-surface-container-lowest px-3 py-1 rounded-full shadow-lg flex items-center gap-1.5">
<span class="material-symbols-outlined text-primary text-[15px]" style="font-variation-settings: 'FILL' 1;">spatial_audio_off</span>
<span class="font-label-sm text-on-surface">Borvoy Ovozli AI</span>
</div>
</div>
<!-- Animated Voice Ripple Transmitter -->
<div class="relative w-full max-w-[280px] h-32 flex items-center justify-center">
<!-- Outer expanding pulse waves -->
<div class="absolute w-44 h-44 rounded-full border border-primary-container/20 animate-ping opacity-60 pointer-events-none"></div>
<div class="absolute w-36 h-36 rounded-full bg-primary/10 animate-pulse pointer-events-none"></div>
<div class="absolute w-28 h-28 rounded-full bg-primary/15 blur-sm pointer-events-none"></div>
<!-- Large Glossy 3D Clay Mic Button -->
<button aria-label="Ovoz yozishni to'xtatish yoki boshlash" class="relative z-10 w-20 h-20 rounded-full bg-primary-container text-on-primary-container shadow-2xl flex items-center justify-center active:scale-95 transition-all duration-200" id="micToggleBtn" style="box-shadow: 0 12px 28px -4px rgba(108, 92, 231, 0.55), inset 0 3px 2px rgba(255, 255, 255, 0.45), inset 0 -4px 6px rgba(0, 0, 0, 0.2);" type="button">
<span class="material-symbols-outlined text-[34px] drop-shadow" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
<!-- Mini floating satellite audio indicators -->
<div class="absolute left-6 top-8 w-2 h-2 rounded-full bg-secondary-container animate-bounce"></div>
<div class="absolute right-8 top-6 w-2.5 h-2.5 rounded-full bg-tertiary-fixed-dim animate-bounce" style="animation-delay: 150ms;"></div>
</div>
</section>
<!-- Live Speech Recognition Card -->
<section class="relative z-10 px-margin mb-4">
<div class="w-full bg-surface-container-lowest/95 backdrop-blur-md rounded-lg p-5 shadow-lg relative overflow-hidden" style="box-shadow: 0 14px 28px -8px rgba(108, 92, 231, 0.15), inset 1px 1px 2px rgba(255,255,255,0.9);">
<!-- Top transcription status -->
<div class="flex items-center justify-between mb-2">
<div class="flex items-center gap-1.5">
<span class="inline-block w-2 h-2 rounded-full bg-tertiary"></span>
<span class="font-label-sm text-tertiary uppercase tracking-wider">Jonli tanib olish</span>
</div>
<span class="font-body-sm text-outline">Olmaliq lutfi</span>
</div>
<!-- Spoken Live Text -->
<div class="min-h-[58px] flex items-center flex-wrap">
<p class="font-headline-sm text-on-surface leading-tight">
          « <span class="text-primary font-headline-sm" id="transcriptionText">Karzinka oldidagi gazaviklarni</span>
<span class="inline-block w-1.5 h-5 bg-primary ml-1 animate-pulse align-middle rounded-full"></span> »
        </p>
</div>
<!-- Dialect Recognition Note -->
<div class="mt-3 pt-3 flex items-center justify-between border-t border-surface-container">
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-secondary text-[16px]" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<span class="font-body-sm text-on-surface-variant font-medium">Olmaliq shevasi va qisqartmalar faol</span>
</div>
<span class="font-label-sm text-primary font-bold bg-primary-fixed px-2 py-0.5 rounded-full">98% aniqlik</span>
</div>
</div>
</section>
<!-- Smart Suggested Query Pills -->
<section class="relative z-10 px-margin mb-6">
<p class="font-label-md text-on-surface-variant mb-2.5 px-1 flex items-center gap-1.5">
<span class="material-symbols-outlined text-[16px] text-primary">tips_and_updates</span>
      Masalan, bunday deb so‘rang:
    </p>
<div class="flex flex-wrap gap-2">
<button class="font-label-md bg-surface-container-lowest text-on-surface px-3.5 py-2.5 rounded-full shadow-sm hover:shadow active:scale-95 transition-all flex items-center gap-1.5" onclick="setQuery('Santexnik Rustam aka')" type="button">
<span class="material-symbols-outlined text-[15px] text-secondary">handyman</span>
        « Santexnik Rustam aka »
      </button>
<button class="font-label-md bg-surface-container-lowest text-on-surface px-3.5 py-2.5 rounded-full shadow-sm hover:shadow active:scale-95 transition-all flex items-center gap-1.5" onclick="setQuery('5-mikrorayonda 2 xonali kvartira')" type="button">
<span class="material-symbols-outlined text-[15px] text-primary">apartment</span>
        « 5-mikrorayonda kvartira »
      </button>
<button class="font-label-md bg-surface-container-lowest text-on-surface px-3.5 py-2.5 rounded-full shadow-sm hover:shadow active:scale-95 transition-all flex items-center gap-1.5" onclick="setQuery('24 soat ochiq apteka')" type="button">
<span class="material-symbols-outlined text-[15px] text-tertiary">local_pharmacy</span>
        « Dejurniy apteka »
      </button>
<button class="font-label-md bg-surface-container-lowest text-on-surface px-3.5 py-2.5 rounded-full shadow-sm hover:shadow active:scale-95 transition-all flex items-center gap-1.5" onclick="setQuery('Metallurg stadioni oldida evakuator')" type="button">
<span class="material-symbols-outlined text-[15px] text-error">fmd_good</span>
        « Evakuator chaqirish »
      </button>
</div>
</section>
<!-- Bottom Sticky Actions -->
<footer class="relative z-10 px-margin mt-auto flex items-center gap-3">
<!-- Cancel / Clear button -->
<button class="w-1/3 py-3.5 px-4 rounded-full bg-surface-container text-on-surface-variant font-label-lg active:scale-95 transition-transform text-center flex items-center justify-center gap-1" type="button">
      Bekor qilish
    </button>
<!-- Search Execution button -->
<button class="w-2/3 py-3.5 px-6 rounded-full bg-primary-container text-on-primary font-label-lg shadow-lg active:scale-95 transition-transform flex items-center justify-center gap-2" style="box-shadow: 0 8px 20px -2px rgba(108, 92, 231, 0.42), inset 0 2px 0 rgba(255, 255, 255, 0.35);" type="button">
<span>Natijalarni ko‘rish</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</footer>
</div>
<script>
  function setQuery(text) {
    const display = document.getElementById('transcriptionText');
    if (display) {
      display.textContent = text;
    }
  }

  const micBtn = document.getElementById('micToggleBtn');
  let isListening = true;

  if (micBtn) {
    micBtn.addEventListener('click', () => {
      isListening = !isListening;
      if (!isListening) {
        micBtn.classList.remove('bg-primary-container', 'text-on-primary-container');
        micBtn.classList.add('bg-surface-variant', 'text-on-surface-variant');
      } else {
        micBtn.classList.add('bg-primary-container', 'text-on-primary-container');
        micBtn.classList.remove('bg-surface-variant', 'text-on-surface-variant');
      }
    });
  }
</script></main></body></html>
