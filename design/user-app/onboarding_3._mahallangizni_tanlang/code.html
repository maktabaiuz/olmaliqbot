<!-- Top Navigation Bar -->
<div class="flex items-center justify-between py-space-sm mb-space-xs">
<div class="flex items-center gap-space-xs bg-surface-container px-space-md py-1 rounded-full shadow-sm">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>

</div>
<button class="font-label-lg text-label-lg text-outline hover:text-on-surface transition-colors py-1 px-space-sm rounded-full active:scale-95" type="button">
      O'tkazib yuborish
    </button>
</div>
<!-- Hero Illustration Area (Clay Mascot with depth podium) -->
<div class="relative w-full flex flex-col items-center justify-center my-space-xs">
<!-- Ambient Clay Soft Background Podium Glow -->
<div class="absolute w-52 h-52 bg-primary-fixed/60 rounded-full blur-2xl -z-10 transform scale-90 translate-y-4"></div>
<div class="absolute w-64 h-16 bg-surface-dim/40 rounded-full blur-xl -z-10 translate-y-24"></div>
<!-- Mascot 3D Clay Frame with physical pillowy elevation -->
<div class="relative w-44 h-44 rounded-xl bg-surface-container-lowest p-2 shadow-xl flex items-center justify-center overflow-hidden" style="box-shadow: 0 16px 32px -8px rgba(83, 65, 205, 0.18), inset 2px 2px 4px rgba(255, 255, 255, 0.95), inset -3px -3px 6px rgba(83, 65, 205, 0.08);">
<img alt="Kim bor Olmaliq mascot" class="w-full h-full object-contain pointer-events-none drop-shadow-md" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCvUOLCxn0IuEU76Zik_cGGoB2rSu5s0Um-wGbHvZQzbMJx6cqB3xsl7_99gKkeaaCJfQrEmhOVyWWwbRIgSzyPQ391ntsQBvj-Hvg8IWu_xXi5Bv_gL9oEB2E_el8jdOS41CMOvOUv0F4RX_fhjFWygQhN-GLxrjv0as5ssUE4uoAknTKPODGiPvUsmp9mG8mL24YgEJFj0PVYaU5Gxk_mCTFdvHX7Pu5_4Om5oeJd_OlPTl09SfHX"/>
</div>
<!-- Neighborhood Mini Floating Badge -->
<div class="relative -mt-4 bg-surface-container-lowest px-3 py-1.5 rounded-full shadow-md flex items-center gap-1.5" style="box-shadow: 0 8px 16px -4px rgba(83, 65, 205, 0.15), inset 1px 1px 2px rgba(255, 255, 255, 0.9);">
<span class="material-symbols-outlined text-error text-[18px]" style="font-variation-settings: 'FILL' 1;">pin_drop</span>
<span class="font-label-md text-label-md text-on-surface font-bold">Olmaliq shahri</span>
</div>
</div>
<!-- Header Typography -->
<div class="text-center mt-space-sm mb-space-md px-space-xs">
<h1 class="font-headline-lg text-headline-lg text-on-surface font-extrabold tracking-tight mb-1.5 flex items-center justify-center gap-1">
      Mahallangizni tanlang <span class="inline-block animate-bounce">📍</span>
</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[320px] mx-auto leading-relaxed">
      Sizga eng yaqin xizmatlar va qo'shnilaringiz tavsiya etgan ustalarni birinchi bo'lib ko'rsatamiz.
    </p>
</div>
<!-- Interactive Olmaliq Neighborhood Chips Container -->
<div class="w-full bg-surface-container-lowest/80 backdrop-blur-md rounded-lg p-space-md mb-space-lg shadow-sm" style="box-shadow: 0 12px 28px -6px rgba(83, 65, 205, 0.08), inset 1px 1px 3px rgba(255, 255, 255, 0.9);">
<div class="flex items-center justify-between mb-space-sm px-1">
<span class="font-label-md text-label-md text-on-surface-variant font-bold uppercase tracking-wider">Tuman va massivlar</span>
<span class="font-label-sm text-label-sm text-primary font-bold bg-primary-fixed/50 px-2 py-0.5 rounded-full">1 ta tanlandi</span>
</div>
<div class="grid grid-cols-2 gap-space-xs" id="neighborhoodGrid">
<!-- 1. Metallurg massivi (Pre-selected) -->
<button class="neighborhood-chip selected group relative flex items-center justify-between p-space-sm rounded-DEFAULT text-left transition-all duration-200 bg-primary text-on-primary shadow-md active:scale-95" data-target="metallurg" style="box-shadow: 0 6px 14px -2px rgba(83, 65, 205, 0.4), inset 0 2px 0 rgba(255, 255, 255, 0.35);" type="button">
<div class="flex items-center gap-1.5 min-w-0 pr-1">
<span class="material-symbols-outlined text-[18px] shrink-0" style="font-variation-settings: 'FILL' 1;">location_city</span>
<span class="font-label-md text-label-md font-bold truncate">Metallurg massivi</span>
</div>
<span class="check-icon material-symbols-outlined text-[16px] text-on-primary shrink-0" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<!-- 2. 5-mikrorayon -->
<button class="neighborhood-chip group relative flex items-center justify-between p-space-sm rounded-DEFAULT text-left transition-all duration-200 bg-surface-container text-on-surface active:scale-95" data-target="5micro" style="box-shadow: inset 1px 1px 2px rgba(255, 255, 255, 0.8), 0 2px 6px rgba(0, 0, 0, 0.03);" type="button">
<div class="flex items-center gap-1.5 min-w-0 pr-1">
<span class="material-symbols-outlined text-[18px] text-outline shrink-0">apartment</span>
<span class="font-label-md text-label-md font-bold truncate">5-mikrorayon</span>
</div>
<span class="check-icon hidden material-symbols-outlined text-[16px] text-primary shrink-0">check_circle</span>
</button>
<!-- 3. Avangard massivi -->
<button class="neighborhood-chip group relative flex items-center justify-between p-space-sm rounded-DEFAULT text-left transition-all duration-200 bg-surface-container text-on-surface active:scale-95" data-target="avangard" style="box-shadow: inset 1px 1px 2px rgba(255, 255, 255, 0.8), 0 2px 6px rgba(0, 0, 0, 0.03);" type="button">
<div class="flex items-center gap-1.5 min-w-0 pr-1">
<span class="material-symbols-outlined text-[18px] text-outline shrink-0">home_work</span>
<span class="font-label-md text-label-md font-bold truncate">Avangard massivi</span>
</div>
<span class="check-icon hidden material-symbols-outlined text-[16px] text-primary shrink-0">check_circle</span>
</button>
<!-- 4. Raduga hududi -->
<button class="neighborhood-chip group relative flex items-center justify-between p-space-sm rounded-DEFAULT text-left transition-all duration-200 bg-surface-container text-on-surface active:scale-95" data-target="raduga" style="box-shadow: inset 1px 1px 2px rgba(255, 255, 255, 0.8), 0 2px 6px rgba(0, 0, 0, 0.03);" type="button">
<div class="flex items-center gap-1.5 min-w-0 pr-1">
<span class="material-symbols-outlined text-[18px] text-outline shrink-0">storefront</span>
<span class="font-label-md text-label-md font-bold truncate">Raduga hududi</span>
</div>
<span class="check-icon hidden material-symbols-outlined text-[16px] text-primary shrink-0">check_circle</span>
</button>
<!-- 5. Eski shahar -->
<button class="neighborhood-chip group relative flex items-center justify-between p-space-sm rounded-DEFAULT text-left transition-all duration-200 bg-surface-container text-on-surface active:scale-95" data-target="eskishahar" style="box-shadow: inset 1px 1px 2px rgba(255, 255, 255, 0.8), 0 2px 6px rgba(0, 0, 0, 0.03);" type="button">
<div class="flex items-center gap-1.5 min-w-0 pr-1">
<span class="material-symbols-outlined text-[18px] text-outline shrink-0">cottage</span>
<span class="font-label-md text-label-md font-bold truncate">Eski shahar</span>
</div>
<span class="check-icon hidden material-symbols-outlined text-[16px] text-primary shrink-0">check_circle</span>
</button>
<!-- 6. Kosmonavtlar -->
<button class="neighborhood-chip group relative flex items-center justify-between p-space-sm rounded-DEFAULT text-left transition-all duration-200 bg-surface-container text-on-surface active:scale-95" data-target="kosmonavtlar" style="box-shadow: inset 1px 1px 2px rgba(255, 255, 255, 0.8), 0 2px 6px rgba(0, 0, 0, 0.03);" type="button">
<div class="flex items-center gap-1.5 min-w-0 pr-1">
<span class="material-symbols-outlined text-[18px] text-outline shrink-0">rocket</span>
<span class="font-label-md text-label-md font-bold truncate">Kosmonavtlar</span>
</div>
<span class="check-icon hidden material-symbols-outlined text-[16px] text-primary shrink-0">check_circle</span>
</button>
<!-- 7. Toshkent yo'li -->
<button class="neighborhood-chip group relative flex items-center justify-between p-space-sm rounded-DEFAULT text-left transition-all duration-200 bg-surface-container text-on-surface active:scale-95" data-target="toshkent" style="box-shadow: inset 1px 1px 2px rgba(255, 255, 255, 0.8), 0 2px 6px rgba(0, 0, 0, 0.03);" type="button">
<div class="flex items-center gap-1.5 min-w-0 pr-1">
<span class="material-symbols-outlined text-[18px] text-outline shrink-0">alt_route</span>
<span class="font-label-md text-label-md font-bold truncate">Toshkent yo'li</span>
</div>
<span class="check-icon hidden material-symbols-outlined text-[16px] text-primary shrink-0">check_circle</span>
</button>
<!-- 8. + Boshqa mahalla -->
<button class="neighborhood-chip group relative flex items-center justify-between p-space-sm rounded-DEFAULT text-left transition-all duration-200 bg-surface-container-high/60 text-primary active:scale-95" data-target="other" style="box-shadow: inset 1px 1px 2px rgba(255, 255, 255, 0.6), 0 2px 6px rgba(0, 0, 0, 0.02);" type="button">
<div class="flex items-center gap-1.5 min-w-0 pr-1">
<span class="material-symbols-outlined text-[18px] text-primary shrink-0">add_circle</span>
<span class="font-label-md text-label-md font-bold truncate">Boshqa mahalla</span>
</div>
<span class="material-symbols-outlined text-[16px] text-outline shrink-0">chevron_right</span>
</button>
</div>
</div>
<!-- Bottom Area: Pager Indicator & CTA -->
<div class="w-full flex flex-col items-center gap-space-md mt-auto">
<!-- Clay Pager Dots (Slide 3 Active) -->
<div class="flex items-center gap-2">
<!-- Dot 1 -->
<div class="w-2.5 h-2.5 rounded-full bg-outline-variant/60"></div>
<!-- Dot 2 -->
<div class="w-2.5 h-2.5 rounded-full bg-outline-variant/60"></div>
<!-- Dot 3 (Elongated active purple clay pill) -->
<div class="w-8 h-2.5 rounded-full bg-primary shadow-sm" style="box-shadow: 0 2px 8px rgba(83, 65, 205, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.6);"></div>
</div>
<!-- Big Tactile CTA Button -->
<button class="w-full py-4 px-space-xl bg-primary text-on-primary rounded-full font-label-lg text-label-lg flex items-center justify-center gap-2 cursor-pointer transition-all duration-200 active:scale-[0.97]" id="continueBtn" style="box-shadow: 0 10px 24px -2px rgba(83, 65, 205, 0.45), inset 0 2px 0 rgba(255, 255, 255, 0.35);" type="button">
<span class="tracking-wide text-headline-sm">Davom etish</span>
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</button>
</div>
</div>
<script>
  (function() {
    const chips = document.querySelectorAll('.neighborhood-chip');
    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        if (chip.getAttribute('data-target') === 'other') {
          return;
        }

        chips.forEach(c => {
          if (c.getAttribute('data-target') === 'other') return;
          c.classList.remove('bg-primary', 'text-on-primary', 'shadow-md');
          c.classList.add('bg-surface-container', 'text-on-surface');
          c.style.boxShadow = 'inset 1px 1px 2px rgba(255, 255, 255, 0.8), 0 2px 6px rgba(0, 0, 0, 0.03)';
          const icon = c.querySelector('.material-symbols-outlined:first-child');
          if (icon) {
            icon.classList.remove('text-on-primary');
            icon.classList.add('text-outline');
          }
          const check = c.querySelector('.check-icon');
          if (check) check.classList.add('hidden');
        });

        chip.classList.remove('bg-surface-container', 'text-on-surface');
        chip.classList.add('bg-primary', 'text-on-primary', 'shadow-md');
        chip.style.boxShadow = '0 6px 14px -2px rgba(83, 65, 205, 0.4), inset 0 2px 0 rgba(255, 255, 255, 0.35)';
        
        const activeIcon = chip.querySelector('.material-symbols-outlined:first-child');
        if (activeIcon) {
          activeIcon.classList.remove('text-outline');
          activeIcon.classList.add('text-on-primary');
        }

        const activeCheck = chip.querySelector('.check-icon');
        if (activeCheck) {
          activeCheck.classList.remove('hidden', 'text-primary');
          activeCheck.classList.add('text-on-primary');
        }
      });
    });
  })();
</script></main></body></html>
