<!DOCTYPE html>

<html class="light" lang="uz"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Statistika - Toshkent Admin</title>
<!-- Fonts and Icons -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "tertiary-container": "#dd910f",

                      "on-secondary-fixed": "#001e2e",
                      "primary-fixed-dim": "#89ceff",
                      "tertiary": "#845400",
                      "on-secondary": "#ffffff",
                      "error": "#ba1a1a",
                      "background": "#f6faff",
                      "on-primary-fixed-variant": "#004c6e",
                      "on-background": "#171c20",
                      "inverse-on-surface": "#edf1f7",
                      "secondary": "#00658e",
                      "tertiary-fixed-dim": "#ffb95a",
                      "surface-container-highest": "#dfe3e8",
                      "primary-container": "#2aabee",
                      "outline-variant": "#bec8d2",
                      "error-container": "#ffdad6",
                      "surface-container": "#eaeef4",
                      "inverse-primary": "#89ceff",
                      "tertiary-fixed": "#ffddb6",
                      "surface-dim": "#d6dae0",
                      "primary-fixed": "#c9e6ff",
                      "surface-container-lowest": "#ffffff",
                      "on-tertiary-container": "#503100",
                      "secondary-fixed": "#c7e7ff",
                      "on-secondary-container": "#004c6d",
                      "on-primary-container": "#003c58",
                      "surface-variant": "#dfe3e8",
                      "on-tertiary": "#ffffff",
                      "surface-container-low": "#f0f4fa",
                      "outline": "#6e7881",
                      "on-surface-variant": "#3e4850",
                      "surface-tint": "#006591",
                      "secondary-fixed-dim": "#85cfff",
                      "on-error-container": "#93000a",
                      "surface-container-high": "#e4e8ee",
                      "secondary-container": "#54c0fd",
                      "inverse-surface": "#2c3135",
                      "on-primary": "#ffffff",
                      "on-tertiary-fixed": "#2a1800",
                      "on-tertiary-fixed-variant": "#643f00",
                      "on-secondary-fixed-variant": "#004c6c",
                      "primary": "#006591",
                      "surface": "#f6faff",
                      "surface-bright": "#f6faff",
                      "on-error": "#ffffff",
                      "on-primary-fixed": "#001e2f"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "stack-md": "16px",
                      "edge-margin": "16px",
                      "container-max": "680px",
                      "stack-sm": "8px",
                      "gutter": "12px",
                      "stack-lg": "24px"
              },
              "fontFamily": {
                      "title-bold": [
                              "Inter"
                      ],
                      "caption": [
                              "Inter"
                      ],
                      "body-main": [
                              "Inter"
                      ],
                      "body-secondary": [
                              "Inter"
                      ],
                      "section-label": [
                              "Inter"
                      ]
              },
              "fontSize": {
                      "title-bold": [
                              "20px",

                                      "lineHeight": "24px",
                                      "fontWeight": "700"
                              }
                      ],
                      "caption": [
                              "11px",
                              {
                                      "lineHeight": "14px",
                                      "fontWeight": "400"
                              }
                      ],
                      "body-main": [
                              "15px",
                              {
                                      "lineHeight": "20px",
                                      "fontWeight": "400"
                              }
                      ],
                      "body-secondary": [
                              "13px",
                              {
                                      "lineHeight": "18px",
                                      "fontWeight": "400"

                      ],
                      "section-label": [
                              "11px",
                              {
                                      "lineHeight": "16px",
                                      "letterSpacing": "0.05em",
                                      "fontWeight": "600"

                      ]
              }
      },
          },
        }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Hide scrollbar for horizontal scrolling chips */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center">
<!-- TopAppBar from JSON -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface transition-all">
<div class="flex items-center justify-between px-edge-margin h-14 w-full max-w-container-max mx-auto">
<button aria-label="Go back" class="text-on-surface dark:text-on-surface hover:bg-surface-container-low dark:hover:bg-surface-container-high rounded-full p-2 flex items-center justify-center transition-all active:opacity-70">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-title-bold text-title-bold text-primary dark:text-primary-fixed-dim truncate">
                Toshkent Admin
            </h1>
<button aria-label="City location" class="text-on-surface dark:text-on-surface hover:bg-surface-container-low dark:hover:bg-surface-container-high rounded-full p-2 flex items-center justify-center transition-all active:opacity-70">
<span class="material-symbols-outlined">location_city</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-container-max mx-auto px-edge-margin pt-[80px] pb-[96px] flex flex-col gap-stack-lg flex-1">
<!-- Screen Title -->
<section class="flex flex-col gap-stack-sm">
<h2 class="font-title-bold text-title-bold text-on-surface">Statistika</h2>
</section>
<!-- Filter Chip Row -->
<section class="flex gap-gutter overflow-x-auto no-scrollbar py-1 -mx-edge-margin px-edge-margin snap-x">
<button class="snap-start shrink-0 h-8 px-4 rounded-full border border-primary bg-primary text-on-primary font-section-label text-section-label flex items-center justify-center transition-colors">
                7 kun
            </button>
<button class="snap-start shrink-0 h-8 px-4 rounded-full border border-outline-variant text-on-surface-variant font-section-label text-section-label flex items-center justify-center hover:bg-surface-container transition-colors">
                30 kun
            </button>
<button class="snap-start shrink-0 h-8 px-4 rounded-full border border-outline-variant text-on-surface-variant font-section-label text-section-label flex items-center justify-center hover:bg-surface-container transition-colors">
                Yil
            </button>
<button class="snap-start shrink-0 h-8 px-4 rounded-full border border-outline-variant text-on-surface-variant font-section-label text-section-label flex items-center justify-center hover:bg-surface-container transition-colors">
                Hammasi
            </button>
</section>
<!-- AI Report Card (Glassmorphism/Premium) -->
<section class="bg-surface-container-low rounded-xl p-stack-md flex flex-col gap-stack-md border border-outline-variant/30 shadow-sm relative overflow-hidden">
<!-- Decorative gradient backdrop for AI feel -->
<div class="absolute -top-10 -right-10 w-32 h-32 bg-secondary-container/40 rounded-full blur-3xl pointer-events-none"></div>
<div class="flex items-start gap-gutter relative z-10">
<div class="w-12 h-12 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">smart_toy</span>
</div>
<div class="flex flex-col gap-1">
<p class="font-body-main text-body-main text-on-surface">
                        Bu hafta bot <strong>238</strong> savolga javob berdi — <strong>89%</strong>. 
                        O'tgan haftadan <span class="text-secondary">5% yaxshi</span>.
                    </p>
<p class="font-body-secondary text-body-secondary text-on-surface-variant mt-2">
                        Eng katta bo'shliq — <strong>kafelchi</strong>, 14 marta so'ralgan.
                    </p>
</div>
</div>
<!-- Primary Action -->
<button class="w-full py-3 rounded-lg bg-primary text-on-primary font-body-main text-body-main font-semibold flex items-center justify-center gap-2 active:opacity-80 transition-opacity mt-2 relative z-10">
<span class="material-symbols-outlined">person_add</span>
                Kafelchi qo'shish
            </button>
</section>
<!-- Supporting Stats Rows -->
<section class="flex flex-col rounded-xl bg-surface-container-lowest border border-outline-variant/30 overflow-hidden">
<!-- Stat Row 1 -->
<div class="flex items-center justify-between p-stack-md border-b border-divider border-outline-variant/20">
<div class="flex items-center gap-gutter text-on-surface-variant">
<span class="material-symbols-outlined text-outline">question_answer</span>
<span class="font-body-main text-body-main">Savollar</span>
</div>
<span class="font-body-main text-body-main font-semibold text-on-surface">238</span>
</div>
<!-- Stat Row 2 -->
<div class="flex items-center justify-between p-stack-md border-b border-divider border-outline-variant/20">
<div class="flex items-center gap-gutter text-on-surface-variant">
<span class="material-symbols-outlined text-outline">note_add</span>
<span class="font-body-main text-body-main">Yangi yozuv</span>
</div>
<span class="font-body-main text-body-main font-semibold text-on-surface">31</span>
</div>
<!-- Stat Row 3 -->
<div class="flex items-center justify-between p-stack-md">
<div class="flex items-center gap-gutter text-on-surface-variant">
<span class="material-symbols-outlined text-outline">group</span>
<span class="font-body-main text-body-main">Foydalanuvchi</span>
</div>
<span class="font-body-main text-body-main font-semibold text-on-surface">86</span>
</div>
</section>
</main>
<!-- BottomNavBar from JSON - 'Yana' is active -->
<nav class="fixed bottom-0 w-full z-50 bg-surface dark:bg-surface border-t border-outline-variant dark:border-outline md:hidden">
<div class="flex justify-around items-center h-16 w-full max-w-container-max mx-auto px-2">
<button aria-label="Bosh sahifa" class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-surface-container-low transition-transform active:scale-95">
<span class="material-symbols-outlined">home</span>
<span class="font-caption text-caption mt-1">Bosh sahifa</span>
</button>
<button aria-label="Qo'shish" class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-surface-container-low transition-transform active:scale-95">
<span class="material-symbols-outlined">add_circle</span>
<span class="font-caption text-caption mt-1">Qo'shish</span>
</button>
<button aria-label="So'rovlar" class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-surface-container-low transition-transform active:scale-95">
<span class="material-symbols-outlined">pending_actions</span>
<span class="font-caption text-caption mt-1">So'rovlar</span>
</button>
<button aria-label="Baza" class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-surface-container-low transition-transform active:scale-95">
<span class="material-symbols-outlined">database</span>
<span class="font-caption text-caption mt-1">Baza</span>
</button>
<!-- Active Item: Yana -->
<button aria-current="page" aria-label="Yana" class="flex flex-col items-center justify-center bg-secondary-container/14 text-primary dark:text-primary-fixed-dim rounded-full px-4 py-1 hover:bg-surface-container-low transition-transform active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">menu</span>
<span class="font-caption text-caption mt-1 font-semibold">Yana</span>
</button>
</div>
</nav>
</body></html>
